function Audit(){
  const {db,openModal,closeModal,flash,can}=useApp();
  const exportCsv=()=>{
    const head=["Timestamp","Actor","Role","Action","Entity","Detail","Comment"];
    const rows=db.audit.map(a=>[a.ts,a.actor,a.role,a.action,a.entity,a.detail,a.comment]);
    const csv=[head].concat(rows).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
    openModal(<Modal title="Export audit log (CSV)" onClose={closeModal} wide={true}>
      <div className="modal-note">Direct download is blocked in this demo sandbox — copy the CSV below, or in production this exports a file.</div>
      <textarea readOnly rows={12} style={{width:"100%",fontFamily:"var(--mono)",fontSize:11.5,border:"1px solid var(--border)",padding:10}} value={csv}/>
      <div className="modal-f"><button className="btn" onClick={closeModal}>Close</button><button className="btn primary" onClick={()=>{try{navigator.clipboard.writeText(csv);flash("Copied CSV to clipboard");}catch(e){flash("Copy from the box above");}}}>Copy to clipboard</button></div>
    </Modal>);
  };
  const cols=[
    {key:"ts",label:"Timestamp (UTC)",w:"162px",filterType:"text",val:x=>x.ts,render:x=><span className="mono" style={{fontSize:11.5,color:"var(--muted)"}}>{x.ts}</span>},
    {key:"actor",label:"Actor",w:"150px",filterType:"text",val:x=>x.actor,render:x=><span className="tcell">{x.actor}</span>},
    {key:"role",label:"Role",w:"140px",filterType:"select",options:["All","Sourcing","Buyer","Finance","BU Head","Controllership","SQE","Engineering","System"],val:x=>x.role,render:x=><span className="mchip">{x.role}</span>},
    {key:"action",label:"Action",filterType:"text",val:x=>x.action,render:x=><span>{x.action}</span>},
    {key:"entity",label:"Entity",w:"200px",filterType:"text",val:x=>x.entity,render:x=><span className="tpid">{x.entity}</span>},
    {key:"detail",label:"Detail",w:"170px",hidden:true,filterType:"text",val:x=>x.detail,render:x=><span className="tmeta">{x.detail}</span>},
    {key:"comment",label:"Comment",w:"180px",filterType:"text",val:x=>x.comment,render:x=><span className="tmeta">{x.comment}</span>},
  ];
  return <>
    <div className="pagehead"><h1>Audit trail</h1><p>Immutable, read-only record of every action — actor, role, UTC timestamp, before/after and comment. Exportable as CSV (admin only).</p></div>
    <div className="block">
      <div className="block-h"><h2><Icon n="audit" cls="" style={{width:16,height:16,color:"var(--teal)"}}/> Activity log <span className="cnt">{db.audit.length}</span></h2>{can("audit.export")?<button className="admin-add" onClick={exportCsv}>Export CSV</button>:null}</div>
      <DataTable columns={cols} rows={db.audit} pageSize={10}/>
    </div>
  </>;
}

/* A field is required either always (req:true) or conditionally (req: values => bool).
   Evaluated in both places that care - the asterisk and the validator - so the form cannot
   show one thing and enforce another. */
const isReq=(f,v)=>typeof f.req==="function"?!!f.req(v||{}):!!f.req;

/* ---------- phase form renderer ---------- */
function FormField({f,val,onChange,err,db,all,project,group}){
  const people=(db.admin.people||[]).map(p=>p.name);
  const id="ff-"+f.k;
  const common={value:val==null?"":val,onChange:onChange,placeholder:f.ph||""};
  let ctrl;
  if(f.type==="choice") ctrl=<select {...common}><option value="">Select…</option>{f.options.map(o=><option key={o} value={o}>{o}</option>)}</select>;
  else if(f.type==="person") ctrl=<><input list={id+"-dl"} {...common} placeholder={f.ph||"Search people…"}/><datalist id={id+"-dl"}>{people.map(p=><option key={p} value={p}/>)}</datalist></>;
  else if(f.type==="textarea") ctrl=<textarea rows={3} {...common}/>;
  else if(f.type==="number"||f.type==="currency") ctrl=<input type="number" min="0" step={f.type==="currency"?"any":"1"} inputMode="decimal" {...common}/>;
  else if(f.type==="date") ctrl=<input type="date" {...common}/>;
  else if(f.type==="supplier") ctrl=<><input list={id+"-dl"} {...common} placeholder={f.ph||"Pick from the supplier list or type a new vendor"}/>
    <datalist id={id+"-dl"}>{((db&&db.suppliers)||[]).map(x=>x.name).filter(Boolean).map(n=><option key={n} value={n}/>)}</datalist></>;
  else if(f.type==="email") ctrl=<input type="email" {...common} placeholder={f.ph||"name@company.com"}/>;
  /* Reference only: read from the project record, never typed and never submitted. */
  else if(f.type==="ref") ctrl=<div className="rovalue">{(f.from&&project?f.from(project):"")||"Not recorded yet"}</div>;
  else if(f.type==="vendorlist") ctrl=<VendorList value={val} onChange={onChange} showErr={!!err}
    suppliers={(db&&db.suppliers)||[]}
    parts={((db&&db.parts)||[]).filter(x=>project&&x.pid===project.id)}/>;
  else if(f.type==="samplegrid") ctrl=<SampleGrid value={val} onChange={onChange}
    pid={(project&&project.id)+(group?"::"+group:"")} project={project} group={group}
    parts={partsInGroup(db&&db.parts,project&&project.id,group)}/>;
  else if(f.type==="notifygrid") ctrl=<NotifyGrid value={val} onChange={onChange}
    pid={(project&&project.id)+(group?"::"+group:"")} project={project} group={group}
    parts={partsInGroup(db&&db.parts,project&&project.id,group)}/>;
  else if(f.type==="sapgrid") ctrl=<SapGrid value={val} onChange={onChange} po={!!f.po}
    pid={project&&project.id}
    parts={((db&&db.parts)||[]).filter(x=>project&&x.pid===project.id)}/>;
  else if(f.type==="partsgrid") ctrl=<QuoteGrid value={val} onChange={onChange} showErr={!!err}
    pid={project&&project.id} rates={(db&&db.rates)||[]}
    parts={((db&&db.parts)||[]).filter(x=>project&&x.pid===project.id)}/>;
  /* The value is the File object itself - the upload happens on submit, once, rather than on
     every keystroke of the rest of the form. */
  else if(f.type==="file") ctrl=<input type="file" accept={f.accept||undefined}
    onChange={e=>onChange({target:{value:(e.target.files&&e.target.files[0])||null}})}/>;
  else ctrl=<input {...common}/>;
  /* A grid in a half-width column truncates every text cell. The wide field types take the
     whole row instead. */
  const wide=["partsgrid","vendorlist","sapgrid","notifygrid","samplegrid"].indexOf(f.type)>=0;
  return <div className={"field2"+(wide?" fullrow":"")+(err?" invalid":"")}>
    <div className="flabel">{f.label} {isReq(f,all)?<i>*</i>:null}</div>
    {ctrl}
    {err?<div className="ferr">{err}</div>:f.type==="currency"&&val?<div className="impfile">{money(val,(all||{}).currency)}</div>:null}
  </div>;
}
function PhaseForm({formId,pid,group}){
  const {db,act,closeForm,roleKey,can,confirm,me,flash}=useApp();
  const spec=FORM_SPECS[formId], project=db.projects.find(p=>p.id===pid);
  /* From F-07 the form is answered for one group, not for the project. Everything the form
     reads and writes - the status it validates against, the values it reloads, the rejection
     counter in its note - comes from that group's track. Opened without a group (an older
     link, a bookmark) it falls back to whichever track the form is actually live on, so the
     screen still works rather than going read-only for no visible reason. */
  const allTracks=project?liveTracks(project):[];
  const track=(spec&&isTrackForm(formId)&&allTracks.length)
    ? (trackOf(project,group)||allTracks.find(t=>spec.from.indexOf(t.status)>=0)||null)
    : null;
  const grp=track?track.g:null;
  /* The status this form is answering against, and the store it reads and writes. */
  const atStatus=track?track.status:(project?project.status:"");
  const store=track?(track.form||{}):((project&&project.form)||{});
  const [v,setV]=useState(()=>{
    const o={};
    (spec?spec.sections:[]).forEach(sec=>sec.fields.forEach(f=>{
      o[f.k]=store&&store[formId]&&store[formId][f.k]!=null
        ? store[formId][f.k] : (f.def?personFor(f.def):(f.init&&project?(f.init(project)||""):""));
    }));
    o[spec?spec.comment.k:"c"]="";
    return o;
  });
  /* Pre-picked where the form offers no choice, so validation and the confirm dialog behave
     exactly as they do on a form that does ask. */
  const [decision,setDecision]=useState(
    (spec&&spec.decision.hidden&&spec.decision.options.length===1)?spec.decision.options[0].v:"");
  const [showErr,setShowErr]=useState(false);
  if(!spec||!project) return <Denied page="phases" roleKey={roleKey}/>;
  const mayEdit=can(spec.cap)&&spec.from.indexOf(atStatus)>=0;
  /* The counters a conditional gate reads belong to the group being answered for. */
  /* The note and the parts list belong to the group being inspected, not to the project.
     A pseudo-project carries the track's counters into spec.note without every spec having
     to learn what a track is. */
  const noteSubject=track?{...project,rejectionCount:track.rejectionCount||0,
    engRejectionCount:track.engRejectionCount||0}:project;
  const grpParts=grp?partsInGroup(db.parts,project.id,grp):[];
  const set=k=>e=>setV(o=>({...o,[k]:e.target.value}));
  const errs={};
  spec.sections.forEach(sec=>sec.fields.forEach(f=>{
    if(f.type==="ref") return;   /* nothing to validate - it is not an input */
    if(f.type==="file"){ if(isReq(f,v)&&!v[f.k]) errs[f.k]=f.label+" is required"; return; }
    if(f.type==="samplegrid"){
      const rr=sampleGridRows(v[f.k]).filter(r=>r.some(Boolean));
      if(!rr.length){ errs[f.k]="Nothing is expected against this project"; return; }
      if(!rr.some(r=>r[3])){ errs[f.k]="Record at least one received date"; return; }
      const noQty=rr.find(r=>r[3]&&!(parseFloat(r[4])>0));
      if(noQty) errs[f.k]="Enter the quantity received for "+(noQty[1]||noQty[0]||"that sample");
      return;
    }
    if(f.type==="notifygrid"){
      const rr=notifyRows(v[f.k]).filter(r=>r.some(Boolean));
      if(!rr.length){ errs[f.k]="Add at least one vendor to notify"; return; }
      const noMail=rr.find(r=>!r[3]||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r[3]));
      if(noMail){ errs[f.k]="A valid contact email is needed for "+(noMail[0]||"every vendor"); return; }
      const noDate=rr.find(r=>!r[4]);
      if(noDate){ errs[f.k]="Set the sample deadline for "+(noDate[0]||"every vendor"); return; }
      const noQty=rr.find(r=>!(parseFloat(r[5])>0));
      if(noQty) errs[f.k]="Set the sample quantity for "+(noQty[0]||"every vendor");
      return;
    }
    if(f.type==="sapgrid"){
      const rr=sapRows(v[f.k]);
      if(!rr.length){ errs[f.k]="No parts to raise a "+(f.po?"PO":"PR")+" against"; return; }
      if(f.po){
        if(!rr.some(r=>r[4])) errs[f.k]="At least one part needs a PO number";
        return;
      }
      if(!rr.some(r=>r[2])){ errs[f.k]="At least one part needs a PR number"; return; }
      const noQty=rr.find(r=>r[2]&&!(parseFloat(r[3])>0));
      if(noQty) errs[f.k]="Enter the TRUN quantity for "+(noQty[0]||"every part with a PR");
      return;
    }
    if(f.type==="vendorlist"){
      const vr=vendorRows(v[f.k]);
      if(!vr.some(r=>r[0]||r[1]||r[2])){ if(isReq(f,v)) errs[f.k]="Add at least one vendor"; return; }
      const noName=vr.findIndex(r=>vendorCellBad(r,0));
      if(noName>=0){ errs[f.k]="Enter the vendor name on row "+(noName+1); return; }
      const noParts=vr.find(r=>vendorCellBad(r,1));
      if(noParts){ errs[f.k]="List the part numbers "+noParts[0]+" supplies"; return; }
      const badMail=vr.find(r=>vendorCellBad(r,2));
      if(badMail){ errs[f.k]=(String(badMail[2]||"").trim()?"Check the email address for ":"Enter the email address for ")+badMail[0]; return; }
      const projParts=((db&&db.parts)||[]).filter(x=>x.pid===project.id).map(x=>x.part).filter(Boolean);
      const stray=[];
      vr.forEach(r=>splitParts(r[1]).forEach(pn=>{ if(projParts.length&&projParts.indexOf(pn)<0&&stray.indexOf(pn)<0)stray.push(pn); }));
      if(stray.length){ errs[f.k]="Not on this project: "+stray.join(", "); return; }
      /* The same part quoted by two vendors is ambiguous downstream - F-05 would notify both
         for the same sample. */
      const seen={},dup=[];
      vr.forEach(r=>splitParts(r[1]).forEach(pn=>{ if(seen[pn]&&dup.indexOf(pn)<0)dup.push(pn); seen[pn]=1; }));
      if(dup.length){ errs[f.k]="Assigned to more than one vendor: "+dup.join(", "); return; }
      /* a part with no vendor is a part nobody will be asked to sample */
      const orphan=projParts.filter(pn=>!seen[pn]);
      if(orphan.length) errs[f.k]="No vendor assigned for: "+orphan.slice(0,5).join(", ")+(orphan.length>5?" and "+(orphan.length-5)+" more":"");
      return;
    }
    /* A quote is complete when every part carries a quantity and both prices. Naming the
       first offending part is the difference between a fixable error and a hunt. */
    if(f.type==="partsgrid"){
      const rows=quoteToRows(v[f.k]);
      if(!rows.length){ errs[f.k]="Add at least one part to the quote"; return; }
      const bad=rows.find(r=>quoteCellBad(r,5));
      if(bad) errs[f.k]="Every part needs a localized price \u2014 check "+(bad[0]||"the blank row");
      else { const noccy=rows.find(r=>quoteCellBad(r,6));
             if(noccy) errs[f.k]="Set the currency the localized price is quoted in for "+(noccy[0]||"every part"); }
      return;
    }
    const val=String(v[f.k]==null?"":v[f.k]).trim();
    if(isReq(f,v)&&!val) errs[f.k]=f.label+" is required";
    else if((f.type==="number"||f.type==="currency")&&val&&(!isFinite(+val)||+val<0)) errs[f.k]="Must be a positive number";
    else if(f.type==="email"&&val&&!isEmail(val)) errs[f.k]="Enter a valid email address";
    else if(f.min&&val.length<f.min) errs[f.k]=f.label+" needs at least "+f.min+" characters ("+val.length+" so far)";
  }));
  if(!String(v[spec.comment.k]||"").trim()) errs[spec.comment.k]=spec.comment.label+" is required";  /* submit only - save skips errs entirely */
  /* A target that reads off the project (F-02c follows the route the Finance Head set) is
     resolved here, so validation, the button and the command all see the same status. */
  const pick=spec.decision.options.find(o=>o.v===decision);
  const chosen=pick?{...pick,to:(typeof pick.to==="function"?pick.to(project):pick.to)}:null;
  const calc=spec.computed?spec.computed(v):null;
  /* A File cannot be serialised into the command payload, and an attachment belongs in the
     library rather than inside a form record. So each file is uploaded as its own document and
     the form keeps only the filename - which is what the timeline and the captured-fields
     drawer can actually show. Shared by submit and save. */
  const prepared=()=>{
    const vals={...v,...(spec.derived?spec.derived(v):{})};
    spec.sections.forEach(sec=>sec.fields.forEach(f=>{
      if(f.type!=="file") return;
      const file=vals[f.k];
      vals[f.k]=file?file.name:"";
      if(file) act.uploadDoc({pid:project.id,name:file.name,type:f.label,file:file});
    }));
    return vals;
  };
  /* Saving is not deciding. Evidence that arrives over days has to be keepable without
     answering the decision or writing a closing comment, so this skips both and moves
     nothing - the form stays open for the next instalment. */
  const save=()=>{
    act.submitForm(formId,project,prepared(),{v:"Saved",label:"Saved",desc:"",to:"",phase:""},grp);
    flash(spec.id+" saved \u2014 the project has not moved");
  };
  const submit=()=>{
    if(!decision){setShowErr(true);act&&null;return;}
    if(Object.keys(errs).length){setShowErr(true);return;}
    const lead=leaderFor(formId,roleKey,noteSubject);
    confirm({title:spec.id+" \u2014 "+chosen.label,
      message:lead
        ? "Record "+chosen.label.toLowerCase()+" for "+(grp?(grp+" ("+grpParts.length+" part(s)) on "+project.id):project.id)
          +" as a recommendation? "+chosen.desc+" "+(grp?grp:"The project")+" stays at "+atStatus+" until "+ROLE[lead].label+" approves it in Teams."
        : grp
        ? "Record "+chosen.label.toLowerCase()+" for "+grp+" ("+grpParts.length+" part(s)) on "+project.id+"? "+chosen.desc+" This moves "+grp+" to "+chosen.to+". The other group(s) are unaffected."
        : "Record "+chosen.label.toLowerCase()+" for "+project.id+"? "+chosen.desc+" This writes an audit entry and moves the project to "+chosen.to+".",
      confirmLabel:chosen.label,tone:chosen.v==="No-Go"?"danger":chosen.v==="Hold"?"":"ok",
      onConfirm:()=>{ act.submitForm(formId,project,prepared(),chosen,grp); closeForm(); }});
  };
  return <>
    <button className="backlink" onClick={closeForm}>‹ Back to phase workspaces</button>
    <div className="pagehead">
      <h1>{spec.id} · {spec.name}</h1>
      <p><span className="mono" style={{color:"var(--teal)",fontWeight:600}}>{project.id}</span> · {project.title} · {plantLine(project)} · {grp?grpParts.length+" part(s) in "+grp:project.parts+" part(s)"} · owner {project.owner}</p>
    </div>
    <div className="formmeta">
      <span className={"pill "+statusClass(atStatus)}>{statusLabel(atStatus)}</span>
      {grp?<span className="mchip grpchip">{grp}</span>:null}
      <span className="mchip">{plantLine(project)}</span>
      <span className="mchip">{spec.owner}</span>
    </div>
    {/* Which parts this verdict covers is the whole point of answering per group - it is
        shown rather than left to be inferred from the group name. */}
    {grp?<div className="roform" style={{marginTop:0}}>
      <b>This decision covers {grp} only.</b>{" "}
      {grpParts.length?grpParts.map(x=>x.part).join(", "):"No parts are tagged to this group."}
      {allTracks.length>1?" \u00b7 "+(allTracks.length-1)+" other group(s) on this project are decided separately.":""}
      {/* The head opens the same form for the same group, so what the engineer put forward
          has to be on the screen the head decides on. */}
      {track&&track.recommendation&&track.recommendation.form===spec.id
        ? <div style={{marginTop:8}}><b>{track.recommendation.by}</b> recommended <b>{track.recommendation.decision}</b> ({track.recommendation.to}) on {track.recommendation.at}.</div>
        : null}
    </div>:null}
    {mayEdit&&leaderFor(formId,roleKey,noteSubject)? <div className="roform">
      <b>Your submission is a recommendation.</b> {ROLE[leaderFor(formId,roleKey,noteSubject)].label} receives it
      as a Teams approval and their decision is what moves the project. Everything you record here
      goes to them with it.</div>:null}
    {!mayEdit? <div className="roform"><b>Read-only.</b> {can(spec.cap)?((grp?grp+" is":"This project is")+" at "+atStatus+", so "+spec.id+" is not the active form for it."):ROLE[roleKey].label+" cannot submit "+spec.id+"."}</div>:null}
    <div className="wiz">
      <div className="block"><div className="panel-pad">
        <div className="modal-note">{spec.intro}</div>
        {spec.note&&spec.note(noteSubject)?<div className="roform" style={{marginTop:12,marginBottom:0}}>{spec.note(noteSubject)}</div>:null}
        {spec.sections.map((sec,i)=><div key={i}>
          <div className="fsec">{sec.title}</div>
          {sec.note?<div className="partnote">{sec.note}</div>:null}
          <div className="fgrid2">
            {sec.fields.map(f=><FormField key={f.k} f={f} db={db} all={v} project={project} group={grp} val={v[f.k]} onChange={set(f.k)} err={showErr?errs[f.k]:null}/>)}
          </div>
          {i===0&&calc? <div className="calcbox">{calc.map((c,j)=><div key={j} className={"calccell "+(c.tone||"")}><div className="ck">{c.k}</div><div className="cv">{c.v}</div></div>)}</div> : null}
        </div>)}

/* ---------- session source: Teams SSO where hosted, dropdown otherwise ----------
   Inside Teams the tab gets the signed-in user from the Teams context and maps
   them to a role through Admin > People. Everywhere else (this preview) the
   header dropdown is the identity source. Same SessionProvider shape either way. */
function useTeamsIdentity(){
  const [id,setId]=useState(null);
  useEffect(()=>{
    let settled=false;
    const stop=()=>{if(!settled){settled=true;setId(null);}};
    const timer=setTimeout(stop,1500);
    try{
      const sdk=window.microsoftTeams;
      if(!sdk||!sdk.app||!sdk.app.initialize){stop();return ()=>clearTimeout(timer);}
      sdk.app.initialize().then(()=>sdk.app.getContext()).then(ctx=>{
        if(settled)return; settled=true; clearTimeout(timer);
        /* The deep-link target arrives on this same context object, so it is kept here
           rather than fetched again. */
        try{ window.__NPI_TEAMS_CTX__=ctx&&(ctx.page||ctx); }catch(e){}
        const u=(ctx&&ctx.user)||{};
        const upn=String(u.userPrincipalName||u.loginHint||"").toLowerCase();
        setId(upn?{upn:upn,name:u.displayName||upn}:null);
      }).catch(stop);
    }catch(e){stop();}
    return ()=>clearTimeout(timer);
  },[]);
  return id;
}
/* ---------- SharePoint bridge ----------
   The SPFx web part injects window.__NPI_SP__ (an SPHttpClient bound to the signed-in
   user, plus the site URL and who they are). When it is absent - running as a standalone
   artifact - every read below is skipped and the app keeps its seed data. One codebase,
   two hosts: nothing here is a fork.
   Field names come from CONTRACT-verified.json, pulled off the live site. They are NOT
   guessable: the project's plant is `ProjectSite`, not `Plant`; parts carry `ProjectID`
   as text, not a lookup. */
/* ---------------------------------------------------------------- deep links

   Every "Open in the Hub" button in every Teams card and DM lands here. Until now they landed
   nowhere useful: the Hub read no target at all, so a card about one part of one group on one
   project dropped the reader on the home page to go and find it.

   One format, three readers. A Teams tab gets the target through the Teams context
   (subEntityId on the way in, `subPageId` on the way out - TeamsJS v2 renamed the property but
   not the link parameter, so code that reads subEntityId silently gets undefined). A browser
   tab, or anyone who opened the link from Outlook or mobile mail, gets it from the query
   string. Both parse to the same object, so the backend only ever builds one kind of link.

   Encoded as a short query string rather than JSON: it survives being pasted into an email
   client that mangles braces, and it is readable in a URL bar when someone reports a bad link. */
const NPI_TARGET_KEYS={p:"pid",part:"part",g:"group",f:"form",tab:"page"};
function parseNpiTarget(raw){
  const t={};
  String(raw||"").replace(/^[?#]/,"").split("&").forEach(kv=>{
    const i=kv.indexOf("=");
    if(i<0) return;
    const k=NPI_TARGET_KEYS[decodeURIComponent(kv.slice(0,i))];
    if(k) t[k]=decodeURIComponent(kv.slice(i+1).replace(/\+/g," "));
  });
  return t.pid||t.page?t:null;
}
function buildNpiTarget(t){
  const out=[];
  Object.keys(NPI_TARGET_KEYS).forEach(short=>{
    const v=t&&t[NPI_TARGET_KEYS[short]];
    if(v) out.push(short+"="+encodeURIComponent(v));
  });
  return out.join("&");
}
/* Where the Hub was asked to go. Teams first because a tab has no useful query string of its
   own; the URL is the fallback that makes the same link work outside Teams. */
function readNpiTarget(){
  try{
    const c=(window.__NPI_TEAMS_CTX__)||null;
    const sub=c&&(c.subPageId||c.subEntityId||(c.page&&c.page.subPageId));
    const hit=parseNpiTarget(sub);
    if(hit) return hit;
  }catch(e){}
  try{
    const q=window.location.search||"", h=window.location.hash||"";
    const m=q.match(/[?&]npi=([^&]*)/)||h.match(/[?&#]npi=([^&]*)/);
    if(m) return parseNpiTarget(decodeURIComponent(m[1]));
    return parseNpiTarget(q);
  }catch(e){}
  return null;
}
/* Resolved lazily, NOT captured at module load. In SPFx the bundle is imported
   before the web part's render() runs, so a module-level const would read
   window.__NPI_SP__ while it is still undefined and pin the app to sample data
   forever. Every caller asks at the moment it needs it. */
/* Leaving the app is host-specific. A Teams tab runs in an iframe where window.open is
   unreliable and sometimes silently blocked, so the Teams SDK gets first refusal; a browser
   tab on the SharePoint page takes the normal path. Wrapped because a blocked popup should
   not take the click handler down with it. */
function openExternal(url){
  if(!url) return false;
  try{
    const sp=spx(), sdk=window.microsoftTeams;
    if(sp&&sp.inTeams&&sdk&&sdk.app&&sdk.app.openLink){ sdk.app.openLink(url); return true; }
  }catch(e){}
  try{ return !!window.open(url,"_blank","noopener"); }catch(e){ return false; }
}
const spx=()=>(typeof window!=="undefined"&&window.__NPI_SP__)||null;
const spNum=x=>(x==null||x==="")?null:(isFinite(+x)?+x:null);
const spDate=x=>{if(!x)return "—";const d=new Date(x);if(isNaN(d))return "—";
  const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return String(d.getDate()).padStart(2,"0")+" "+m[d.getMonth()]+" "+d.getFullYear();};
/* SLA hours are not modelled in SharePoint yet - derive a stable placeholder from age so
   the chips render without inventing urgency that is not in the data. */
const spSla=x=>{if(!x)return 72;const h=Math.round((Date.now()-new Date(x).getTime())/36e5);
  return Math.max(4,Math.min(168,168-h));};

/* A document library holds files, so "upload" has to move bytes. The previous version took a
   filename and a size it made up, which put rows in the list that no file stood behind - the
   one thing a document register must never contain. Folder per project, matching the layout
   the library already uses (FileDirRef ends in the ProjectID). */
async function spUploadDoc(file,pid,category){
  const sp=spx();
  const lib="ProjectDocuments";
  const root=(sp.siteUrl.replace(/^https?:\/\/[^\/]+/,""))+"/"+lib;
  const folder=root+"/"+pid;
  const hdrs={"Accept":"application/json;odata=nometadata"};
  /* Create the project folder if this is its first document. An existing folder answers 400,
     which is a success for our purposes - the only outcome we care about is that it exists. */
  try{
    await sp.client.post(sp.siteUrl+"/_api/web/folders/add(url='"+encodeURIComponent(folder)+"')",
      sp.cfg,{headers:hdrs,body:""});
  }catch(e){}
  const buf=await file.arrayBuffer();
  const url=sp.siteUrl+"/_api/web/GetFolderByServerRelativeUrl('"+encodeURIComponent(folder)+
            "')/Files/add(url='"+encodeURIComponent(file.name)+"',overwrite=true)";
  const res=await sp.client.post(url,sp.cfg,{headers:hdrs,body:buf});
  if(!res.ok) throw new Error("upload: "+res.status+" "+(await res.text()).slice(0,200));
  const added=await res.json();
  /* Metadata is a second call - the add() endpoint returns the file, not its list item. A
     failure here leaves the file in place but uncategorised, which is recoverable; failing the
     whole upload because a Choice value was rejected would not be. */
  try{
    const it=await sp.client.get(sp.siteUrl+"/_api/web/GetFileByServerRelativeUrl('"+
      encodeURIComponent(added.ServerRelativeUrl)+"')/ListItemAllFields?$select=Id",sp.cfg);
    if(it.ok){
      const id=(await it.json()).Id;
      await sp.client.post(sp.siteUrl+"/_api/web/lists/getbytitle('"+lib+"')/items("+id+")",sp.cfg,{
        headers:{...hdrs,"Content-type":"application/json;odata=nometadata",
                 "odata-version":"","IF-MATCH":"*","X-HTTP-Method":"MERGE"},
        body:JSON.stringify({ProjectIDRef:pid,DocumentCategory:category})});
    }
  }catch(e){}
  return added.ServerRelativeUrl;
}

/* ---------- what a Teams channel card says ----------
   The router posts one card per move, to the channel of whoever acts next. What that card
   should say depends on the stage, and most of it was captured by forms submitted earlier -
   which the router never sees, because a command carries only its own form. So the Hub, which
   holds the whole project, keeps a running summary on the row (HubSummaryJSON) and writes the
   cards itself:
     payload.card   the card for the move this command makes
     summary.cards  the cards for every move that can come next, keyed "status|group", so a
                    decision taken in a Teams approval - which never passes through the Hub -
                    still gets its stage's card
   Figures travel in their own list (m) so the router can drop them for a channel whose role
   may not see cost. Only the Sourcing channel's stages are written; every other stage keeps
   the router's generic card until its channel is designed. */
const readJson=(x,fallback)=>{
  if(!x) return fallback;
  try{ return JSON.parse(x); }catch(e){ return fallback; }  /* a hand-edited cell must not blank the project */
};
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const cDate=(x)=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(x||""));return m?(+m[3])+" "+MONTHS[+m[2]-1]+" "+m[1]:String(x||"");};
const cTrim=(x,n)=>{const t=String(x==null?"":x).replace(/\s+/g," ").trim();return t.length>n?t.slice(0,n-1)+"…":t;};
const cInr=(n)=>(n==null||!isFinite(n))?"":"₹"+Math.round(n).toLocaleString("en-IN");
const cOrd=(n)=>n+(n%100>=11&&n%100<=13?"th":(["th","st","nd","rd"][n%10]||"th"));
/* a blank value is left off rather than shown as "-": a card is scanned, and a row of dashes
   is noise that pushes the useful lines below the fold on a phone */
const cFact=(title,value)=>{const v=String(value==null?"":value).trim();
  return (!v||v==="—"||v==="NaN")?null:{title:title,value:v};};
const plural=(n,w)=>n+" "+w+(n===1?"":"s");

/* Everything a later card needs, folded in as each form is submitted. Kept small on purpose:
   facts, not whole forms - TracksJSON already carries the forms. */
function summaryAfter(p,formId,v,group,extra,by){
  const s=JSON.parse(JSON.stringify(p.summary||{}));
  delete s.cards;
  /* A gate decision carries no form. The Finance Head's gate carries the funding route, which
     every later step reads, so it is kept the same way a form's values are. */
  if(!formId&&extra&&extra.route) s.f02f={route:extra.route,by:by||""};
  const gs=()=>{s.g=s.g||{};s.g[group||""]=s.g[group||""]||{};return s.g[group||""];};
  if(formId==="F-01") s.intake=extra;
  else if(formId==="F-02"){
    const t=f02Totals(v);
    s.f02={spend:inrOfUsd(t.spend),nspend:inrOfUsd(t.nspend),save:inrOfUsd(t.save),
      pct:(t.save!=null&&t.spend)?t.save/t.spend*100:null,
      invest:num(v.capexOpexAmount),route:v.routingSuggestion||"",
      vendor:{n:(v.vendorName||"").trim(),e:(v.vendorEmail||"").trim()},
      quote:!!v.quoteFile,subs:((s.f02&&s.f02.subs)||0)+1,by:by||""};
    s.vendor=s.f02.vendor;
  }
  else if(formId==="F-02c") s.f02c={gl:v.glAccount||"",cc:v.costCentre||"",pc:v.profitCentre||"",
    route:(s.f02f||{}).route||(s.f02c||{}).route||"",by:by||""};
  else if(formId==="F-03c") s.f03c={net:v.networkId||"",acc:v.accoladeId||"",pr:v.prNumber||"",po:v.poNumber||""};
  else if(formId==="F-03o") s.f03o={confirmed:true,by:by||""};
  else if(formId==="F-04"){
    const rr=sapRows(v.sapLines);
    s.f04={...(s.f04||{}),pr:rr.filter(r=>r[2]).length,total:rr.length,
      trun:rr.reduce((a,r)=>a+(num(r[3])||0),0)};
  }
  else if(formId==="F-04-PO"){
    const rr=sapRows(v.sapLines);
    s.f04={...(s.f04||{}),po:rr.filter(r=>r[4]).length,total:rr.length};
  }
  else if(formId==="F-04o-PR") s.f04o={...(s.f04o||{}),pr:v.prNumber||"",amount:num(v.amount)};
  else if(formId==="F-04o-PO") s.f04o={...(s.f04o||{}),po:v.poNumber||""};
  else if(formId==="F-05") s.f05={contact:v.contactName||"",e:v.contactEmail||"",d:v.sampleDeadline||"",q:num(v.sampleQty)};
  else if(formId==="F-06R"){
    const replace=v.resourceAction==="Replace the vendor";
    gs().rs={dec:v.resourceAction||"",vendor:replace?(v.newVendorName||""):"",price:replace?(v.newVendorQuoted||""):"",
      told:v.failureReason||"",due:v.resampleDeadline||"",qty:num(v.resampleQty)};
    if(replace&&v.newVendorName) s.vendor={n:v.newVendorName.trim(),e:(v.newVendorEmail||"").trim()};
  }
  else if(formId==="F-06"){
    /* counts and lots, not the rows: a group can hold hundreds of parts */
    const rr=sampleGridRows(v.sampleLines).filter(r=>r.some(Boolean)), got=rr.filter(r=>r[3]);
    const lots=[];got.forEach(r=>{if(r[5]&&lots.indexOf(r[5])<0)lots.push(r[5]);});
    gs().smp={exp:rr.length,got:got.length,qty:got.reduce((a,r)=>a+(num(r[4])||0),0),lots:lots,
      type:v.sampleType||"",ppap:v.ppapLevel||"",docs:v.documents||""};
  }
  else if(formId==="F-07") gs().sqe={res:v.dimensionalResult||"",cpk:v.cpk,notes:v.sqeNotes||"",
    grr:v.gaugeRR||"",lab:v.labReport||""};
  else if(formId==="F-08") gs().eng={conf:v.designConformance||"",fff:v.fitFormFunction||"",
    dwg:v.drawingReference||"",rev:v.drawingRevision||"",revOk:v.revisionVerified||"",cp:v.controlPlan||"",
    notes:v.engineeringNotes||""};
  else if(formId==="F-09") gs().trial={made:num(v.qtyMade),acc:num(v.qtyAccepted),def:num(v.defectCount),
    mode:v.defectMode||"",yield:num(v.yieldRate),rar:v.runAtRate||"",notes:v.trialNotes||""};
  else if(formId==="F-10") gs().psw={dev:v.deviationsExist||"",desc:v.deviationDescription||"",
    plan:v.actionPlan||"",level:v.ppapLevel||"",trun:v.trunReferenceNumber||"",partRev:v.partRevision||"",
    reason:v.submissionReason||"",fair:v.fairChecklistComplete||"",dim:v.dimensionalComplete||""};
  else if(formId==="F-14") s.close={cost:num(v.finalCost),variance:num(v.costVariancePercent),
    rating:v.finalVendorRating||"",lessons:v.lessonsLearned||""};
  return s;
}

/* The card for arriving at `to`. ctx: the project's parts and lots, the group's rejection
   count before this move, and the status it is coming from. Null for a stage whose channel
   has no designed card yet - the router then posts its generic one. */
/* Pilot lots. Three lots, one after another, each ordered on its own PR, received, inspected
   and - if it fails IQC - dispositioned by the SQE Head. Only lot 1 opening and the last lot
   landing move the project, so the rest are EVENT cards: they name their own channel (ch) and
   the label on the chip, because no status change exists for the router to read them from. */
const lotTitle=(l)=>l.lot+" of 3 ("+(LOT_FORMS[lotNum(l)]||"")+")";
const lotLine=(l)=>[l.qty?l.qty+" pcs":"",l.pr?"PR "+l.pr:"",(l.delivery&&l.delivery!=="\u2014")?l.delivery:"",
  "IQC "+(l.iqc||"pending")].filter(Boolean).join(" \u00b7 ");
function lotCard(kind,s,lot,ctx){
  const f02=s.f02||{}, parts=ctx.parts||[], n=lotNum(lot);
  const earlier=(ctx.lots||[]).filter(l=>lotNum(l)<n).sort((a,b)=>lotNum(a)-lotNum(b));
  const V0=curVendor(s), orderFrom=V0?V0.n+(V0.e?" \u2014 "+V0.e:""):"";
  const prev=earlier[earlier.length-1];
  let h, f, ch;
  if(kind==="opened"){
    h=(prev?prev.lot+" "+(ctx.accepted?"accepted on disposition":"passed IQC")+" \u2014 ":"")
      +(prev?lot.lot.toLowerCase():lot.lot)+" opened: raise its PR ("+LOT_FORMS[n]+")";
    ch="BUYER";
    f=[cFact("Lot",lotTitle(lot)),cFact("Covers",plural(parts.length,"part")),cFact("Order from",orderFrom),
       cFact(prev&&ctx.accepted?"Disposition":"",prev&&ctx.accepted?ctx.accepted:"")]
      .concat(earlier.map(l=>cFact(l.lot,lotLine(l))));
  }
  else if(kind==="ordered"){
    h=lot.lot+" ordered \u2014 record delivery and IQC when it arrives ("+LOT_FORMS[n]+")";
    ch="SQE_ENG";
    f=[cFact("Lot",lotTitle(lot)),cFact("PR number",lot.pr),cFact("Ordered quantity",lot.qty),
       cFact("Covers",plural(parts.length,"part"))];
  }
  else if(kind==="quarantine"){
    h=lot.lot+" failed IQC \u2014 SQE Head to decide the disposition";
    ch="SQE_HEAD";
    f=[cFact("Lot",lotTitle(lot)),cFact("Delivered",lot.delivery),cFact("Quantity",lot.qty),cFact("PR number",lot.pr)];
  }
  else if(kind==="returned"){
    const rework=ctx.disposition==="Rework";
    h=lot.lot+(rework?" sent for rework":" returned to supplier")+" \u2014 arrange the "
      +(rework?"reworked lot":"replacement")+" with the vendor";
    ch="BUYER";
    f=[cFact("Lot",lotTitle(lot)),cFact("Quantity",lot.qty),cFact("IQC finding",cTrim(lot.iqcNotes,200)),
       cFact("Disposition",ctx.disposition),cFact("Vendor",orderFrom)];
  }
  return {h:h,f:f.filter(Boolean),m:[],ch:ch,chip:"Pilot lots \u00b7 "+lot.lot};
}
/* Months for the saving to repay the investment - the one number a head approving a business
   case asks first. Only when both exist and the saving is real. */
const cPayback=(f)=>{
  if(!(f.invest>0&&f.save>0)) return "";
  const mo=f.invest/(f.save/12);
  return mo<1?"under 1 month":mo.toFixed(1)+" months";
};
function cardFor(s,to,group,ctx){
  const g=group||"", gi=(s.g&&s.g[g])||{}, f02=s.f02||{};
  const parts=ctx.parts||[], inGroup=g?parts.filter(x=>x.group===g):parts;
  const groups=[];parts.forEach(x=>{if(x.group&&groups.indexOf(x.group)<0)groups.push(x.group);});
  const partsLine=plural(parts.length,"part")+(groups.length>1?" in "+groups.length+" groups":"");
  const groupLine=g?g+" ("+plural(inGroup.length,"part")+")":null;
  const pn=inGroup.map(x=>x.part);
  const V=curVendor(s), vendorNames=V?V.n:"", vendorLine=V?V.n+(V.e?" \u2014 "+V.e:""):"";
  const i0=s.intake||{}, fc=s.f02c||{};
  const money=[cFact("Annual spend",(f02.spend!=null&&f02.nspend!=null)?cInr(f02.spend)+" \u2192 "+cInr(f02.nspend):""),
    cFact("Annual saving",f02.save!=null?cInr(f02.save)+(f02.pct!=null?" ("+f02.pct.toFixed(1)+"%)":""):""),
    cFact("Investment",f02.invest!=null?cInr(f02.invest):"None"),cFact("Payback",cPayback(f02))];
  const sq=gi.sqe||{}, en=gi.eng||{}, tr=gi.trial||{};
  /* the vendor the group is with NOW - a re-source may have moved it off the F-02 vendor */
  const groupVendor=(gi.rs&&gi.rs.vendor)||vendorNames;
  const sqeLine=[sq.res,(sq.cpk!=null&&sq.cpk!=="")?"Cpk "+sq.cpk:""].filter(Boolean).join(" \u00b7 ");
  const trialLine=tr.made!=null?[tr.made+" made",tr.acc!=null?tr.acc+" accepted":"",tr.yield!=null?tr.yield+"% yield":"",
    tr.def!=null?plural(tr.def,"defect"):""].filter(Boolean).join(" \u00b7 "):"";
  let h=null,f=[],m=[],ch="";
  if(to==="Feasibility Review"){
    const i=s.intake||{};
    h="New request — please check feasibility";
    f=[cFact("Category",i.category),cFact("ECN",i.ecn),cFact("Scope",cTrim(i.scope,180)),
       cFact("Target completion",cDate(i.target)),cFact("Objectives",(i.obj||[]).join(", ")),
       cFact("Parts",plural(i.parts||0,"part")+((i.groups||[]).length
         ?" in "+plural(i.groups.length,"group")+": "+cTrim(i.groups.join(", "),120):""))];
  }
  else if(to==="Held"){
    h="Project on hold";
    f=[cFact("Parts",partsLine),cFact("Vendor",vendorNames)];
  }
  else if(to==="Returned to Sourcing"){
    h="Sent back to Sourcing — revise and resubmit F-02";
    f=[cFact("Times submitted",f02.subs||""),
       cFact("Vendor",vendorNames),cFact("Parts",partsLine)];
    m=[cFact("Submitted saving",f02.save!=null?cInr(f02.save)+" / year"+(f02.pct!=null?" ("+f02.pct.toFixed(1)+"%)":""):""),
       cFact("Submitted investment",f02.invest!=null?cInr(f02.invest)+(f02.route?" · "+f02.route+" suggested":""):"")];
  }
  else if(to==="Sourcing Head Approval Pending"){
    h="Feasibility submitted — Sourcing Head to approve";
    f=[cFact("Submission",f02.subs>1?cOrd(f02.subs)+" (resubmitted)":"First"),cFact("Vendor",vendorNames),
       cFact("Vendor quote",f02.quote?"Attached":"Not attached"),cFact("Parts",partsLine)];
    m=[cFact("Annual spend",(f02.spend!=null&&f02.nspend!=null)?cInr(f02.spend)+" → "+cInr(f02.nspend):""),
       cFact("Annual saving",f02.save!=null?cInr(f02.save)+(f02.pct!=null?" ("+f02.pct.toFixed(1)+"%)":""):""),
       cFact("Investment",f02.invest!=null?cInr(f02.invest)+(f02.route?" · "+f02.route+" suggested":""):"None")];
  }
  else if(to==="Business Head Approval Pending"){
    h="Sourcing Head approved \u2014 Business Head to approve the business case";
    f=[cFact("Category",i0.category),cFact("Scope",cTrim(i0.scope,160)),cFact("Parts",partsLine),
       cFact("Vendor",vendorNames),cFact("Target completion",cDate(i0.target)),cFact("Prepared by",f02.by)];
    m=money.concat([cFact("Suggested route",f02.route)]);
  }
  /* The Finance Head decides and classifies; the Finance team then books the coding, so
     the two cards say which of those is being asked for. */
  else if(to==="Finance Routing Decision Pending"){
    const rt=(s.f02f||{}).route||fc.route||"";
    h="Funded as "+(rt||"approved")+" \u2014 record the account coding (F-02c)";
    f=[cFact("To record","GL account, cost centre, profit centre"),cFact("Route",rt),
       cFact("Approved by",(s.f02f||{}).by),cFact("Parts",partsLine),cFact("Vendor",vendorNames)];
    m=money;
  }
  else if(to==="Finance Head Approval Pending"){
    h="Business case approved \u2014 Finance Head to approve and fund it (F-02f)";
    f=[cFact("To decide","Approve, and fund as Capex or Opex"),
       cFact("Sourcing suggested",f02.route||"No suggestion"),cFact("Parts",partsLine),
       cFact("Vendor",vendorNames),cFact("Prepared by",f02.by)];
    m=money;
  }
  else if(to==="Approval Pending - Capex"){
    h="Capex approved \u2014 record the AEF identifiers (F-03c)";
    f=[cFact("To record","Network ID, Accolade ID, SAP PR and PO numbers"),cFact("Account coding",[fc.gl?"GL "+fc.gl:"",fc.cc?"CC "+fc.cc:"",fc.pc?"PC "+fc.pc:""].filter(Boolean).join(" \u00b7 ")),
       cFact("Parts",partsLine),cFact("Vendor",vendorNames)];
    m=[cFact("Approved investment",f02.invest!=null?cInr(f02.invest):"")];
  }
  else if(to==="Approval Pending - Opex"){
    h="Opex approved \u2014 confirm the coding and hand it to the Planner (F-03o)";
    f=[cFact("Account coding",[fc.gl?"GL "+fc.gl:"",fc.cc?"CC "+fc.cc:"",fc.pc?"PC "+fc.pc:""].filter(Boolean).join(" \u00b7 ")),
       cFact("Parts",partsLine),cFact("Vendor",vendorNames)];
    m=[cFact("Approved amount",f02.invest!=null?cInr(f02.invest):"")];
  }
  else if(to==="Development Approved"){
    const a=s.f03c||{};
    h="Development approved \u2014 raise the purchase requisitions (F-04)";
    f=[cFact("Funding",[fc.route,a.net?"Network "+a.net:"",a.acc?"Accolade "+a.acc:""].filter(Boolean).join(" \u00b7 ")),
       cFact("Account coding",[fc.gl?"GL "+fc.gl:"",fc.cc?"CC "+fc.cc:"",fc.pc?"PC "+fc.pc:""].filter(Boolean).join(" \u00b7 ")),
       cFact("To record","A PR number and TRUN quantity per part"),
       cFact("Order from",vendorLine),
       cFact("Parts",partsLine)];
    m=[cFact("Approved investment",f02.invest!=null?cInr(f02.invest):"")];
  }
  /* The Buyer picks up where the Planner left off - the PRs are raised, the POs are not. */
  else if(to==="PO Creation Pending"){
    const f4=s.f04||{};
    h="Requisitions raised \u2014 create the purchase orders (F-04-PO)";
    f=[cFact("PRs raised",f4.total?f4.pr+" of "+f4.total+" part(s)":""),
       cFact("TRUN quantity",f4.trun?String(f4.trun):""),
       cFact("To record","A PO number per part"),
       cFact("Order from",vendorLine),
       cFact("Parts",partsLine)];
    m=[cFact("Approved investment",f02.invest!=null?cInr(f02.invest):"")];
  }
  else if(to==="Opex - PR Pending"){
    const g3=s.f03o||{};
    h="Opex approved \u2014 raise the SAP PR (F-04o-PR)";
    f=[cFact("GL account",g3.gl),cFact("Cost centre",g3.cc),cFact("Profit centre",g3.pc),cFact("Budget line",fc.budget),
       cFact("Vendor",vendorNames),cFact("Parts",partsLine)];
    m=[cFact("Approved amount",f02.invest!=null?cInr(f02.invest):"")];
  }
  else if(to==="PO Pending"){
    const f4=s.f04||{}, fo=s.f04o||{};
    h="PR / PO raised \u2014 notify the vendor (F-05)";
    f=[cFact("Parts with a PO",f4.total?(f4.po||0)+" of "+f4.total:""),cFact("PO number",fo.po),
       cFact("TRUN quantity",f4.trun?String(f4.trun):""),
       cFact("Vendor to notify",vendorLine)];
  }
  else if(to==="Opex - PO Pending"){
    const fo=s.f04o||{}, f3=s.f03o||{};
    h="Opex PR raised — confirm the PO (F-04o-PO)";
    f=[cFact("PR number",fo.pr),cFact("GL account",f3.gl),cFact("Cost centre",f3.cc)];
    m=[cFact("PR amount",fo.amount!=null?cInr(fo.amount):"")];
  }
  else if(to==="In Development"){
    const f5=s.f05||{};
    h="Vendor notified \u2014 samples on the way";
    f=[cFact("Vendor",vendorNames),cFact("Contact",[f5.contact,f5.e].filter(Boolean).join(" \u2014 ")),
       cFact("Sample due",cDate(f5.d)),cFact("Sample quantity",f5.q!=null?f5.q+" pcs":""),
       cFact("Parts",partsLine)];
  }
  else if(to==="Sample Rejected"){
    const n=(ctx.rej||0)+1, byEng=!!ctx.from&&ctx.from!=="Sample Under Inspection"&&ctx.from!=="Re-sample Requested";
    h="Samples rejected"+(g?" for "+g:"")+" — choose the next step (F-06R)";
    f=[cFact("Group",groupLine),cFact("Rejected at",byEng?"Engineering review (F-08)":"SQE validation (F-07)")]
      .concat(byEng
        ?[cFact("Fit / form / function",en.fff),cFact("Design conformance",en.conf),cFact("Engineering notes",cTrim(en.notes,200))]
        :[cFact("Dimensional result",sq.res),cFact("Cpk / Ppk",sq.cpk),cFact("Inspection notes",cTrim(sq.notes,200))])
      .concat([cFact("Rejection",cOrd(n)+" of 3"+(n>=3?" — Sourcing Head must approve the next re-sample":"")),
               cFact("Vendor",vendorNames)]);
  }
  else if(to==="Re-sample Requested"){
    const rs=gi.rs||{};
    h="Re-sample requested"+(g?" for "+g:"");
    f=[cFact("Group",groupLine),cFact("Decision",rs.dec),cFact("New vendor",rs.vendor),
       cFact("Price vs approved quote",rs.price),cFact("Re-sample due",cDate(rs.due)),
       cFact("Quantity",rs.qty||""),cFact("Vendor told",cTrim(rs.told,200))];
  }
  else if(to==="PSW Pending Sign-off"){
    h=(g||"Samples")+" passed the production trial \u2014 prepare the PSW (F-10)";
    f=[cFact("Group",groupLine),cFact("SQE result",sqeLine),
       cFact("Drawing",[en.dwg,en.rev?"rev "+en.rev:""].filter(Boolean).join(" ")),
       cFact("Trial",trialLine),cFact("Run-at-rate",tr.rar)];
  }
  else if(to==="PSW Rejected"){
    const ps=gi.psw||{};
    h="PSW rejected"+(g?" for "+g:"")+" — rework needed";
    f=[cFact("Group",groupLine),cFact("PPAP level",ps.level),
       cFact("Deviations",[ps.dev,cTrim(ps.desc,160)].filter(Boolean).join(": ")),
       cFact("Action plan",cTrim(ps.plan,200))];
  }
  else if(to==="Sample Under Inspection"){
    const sm=gi.smp||{}, rej=ctx.rej||0;
    h=(rej?"Re-samples":"Samples")+" received"+(g?" for "+g:"")+" \u2014 SQE to inspect (F-07)";
    f=[cFact("Group",groupLine),cFact("Vendor",groupVendor),
       cFact("Samples received",sm.exp?sm.got+" of "+plural(sm.exp,"part")+(sm.qty?" \u00b7 "+sm.qty+" pcs":""):""),
       cFact("Lot numbers",(sm.lots||[]).slice(0,4).join(", ")+((sm.lots||[]).length>4?" +"+(sm.lots.length-4)+" more":"")),
       cFact("Sample type",sm.type),cFact("PPAP level",sm.ppap),cFact("Documents",cTrim(sm.docs,160)),
       cFact("Attempt",rej?cOrd(rej+1)+" sample \u2014 "+plural(rej,"earlier rejection"):""),
       cFact("Last rejected for",rej?cTrim((gi.rs&&gi.rs.told)||sq.notes,160):"")];
  }
  else if(to==="SQE Approved"||to==="SQE Conditional"){
    const cond=to==="SQE Conditional";
    h="SQE passed "+(g||"the samples")+(cond?" with conditions":"")+" \u2014 Engineering to review fit, form and function (F-08)";
    f=[cFact("Group",groupLine),cFact("Vendor",groupVendor),cFact("Dimensional result",sq.res),
       cFact("Cpk / Ppk",sq.cpk),cFact("Gauge R&R",sq.grr),cFact("Lab / test report",sq.lab),
       cFact(cond?"Conditions":"Inspection notes",cTrim(sq.notes,200))];
  }
  else if(to==="Production Rejected"){
    h="Production trial rejected"+(g?" for "+g:"")+" \u2014 Engineering to re-review (F-08)";
    f=[cFact("Group",groupLine),cFact("Trial",trialLine),cFact("Defect mode",tr.mode),
       cFact("Run-at-rate",tr.rar),cFact("Trial notes",cTrim(tr.notes,200))];
  }
  else if(to==="Engineering Approved"){
    h="Engineering approved "+(g||"the samples")+" \u2014 run the production trial (F-09)";
    f=[cFact("Group",groupLine),cFact("Vendor",groupVendor),
       cFact("Drawing",[en.dwg,en.rev?"rev "+en.rev:""].filter(Boolean).join(" ")),
       cFact("Revision verified",en.revOk),cFact("Control plan / PFMEA",en.cp),
       cFact("Fit / form / function",en.fff),cFact("SQE result",sqeLine),
       cFact("Engineering notes",cTrim(en.notes,200)),cFact("Previous trial",trialLine)];
  }
  else if(to==="Trial Repeat Required"){
    h="Production trial to be repeated"+(g?" for "+g:"")+" (F-09)";
    f=[cFact("Group",groupLine),cFact("Last trial",trialLine),cFact("Defect mode",tr.mode),
       cFact("Run-at-rate",tr.rar),cFact("Trial notes",cTrim(tr.notes,200))];
  }
  else if(to==="PSW Sign-off Pending"){
    const ps=gi.psw||{};
    h="PSW ready for CFT sign-off"+(g?" \u2014 "+g:"");
    f=[cFact("Group",groupLine),cFact("TRUN reference",ps.trun),cFact("Part revision",ps.partRev),
       cFact("Submission reason",ps.reason),cFact("PPAP level",ps.level),cFact("FAIR checklist",ps.fair),
       cFact("Dimensional results",ps.dim),cFact("Deviations",[ps.dev,cTrim(ps.desc,160)].filter(Boolean).join(": ")),
       cFact("Action plan",/^Yes/.test(ps.dev||"")?cTrim(ps.plan,200):""),
       cFact("Trial",trialLine),cFact("SQE result",sqeLine)];
  }
  else if(to==="FAIR Released"){
    const all=(ctx.tracks||[]).length, done=(ctx.tracks||[]).filter(t=>t.status==="FAIR Released").length;
    const every=!all||done>=all;
    h=every?"All part groups released (FAIR) \u2014 start pilot lot 1 (F-11)"
           :(g||"Group")+" released (FAIR) \u2014 pilot lots start when every group is released";
    f=[cFact(every&&all>1?"Last released":"Group",groupLine),cFact("Groups released",all?done+" of "+all:""),cFact("Parts",partsLine),
       cFact("Vendor",every?vendorLine:"")];
  }
  else if(to==="Pilot Lots In Progress"){
    const c=lotCard("opened",s,{lot:"Lot 1"},{...ctx,lots:[]});
    h="All part groups released \u2014 pilot lot 1 opened: raise its PR (F-11)"; f=c.f; ch=c.ch;
  }
  else if(to==="All Lots Delivered"||to==="Pilot Lots Failed - Hold"){
    const lots=(ctx.lots||[]).slice().sort((a,b)=>String(a.lot).localeCompare(String(b.lot)));
    h=to==="All Lots Delivered"?"All pilot lots delivered — close the project (F-14)"
                               :"Pilot lot failed — Sourcing Head decision needed";
    f=lots.map(l=>cFact(l.lot,[l.qty?l.qty+" pcs":"","IQC "+(l.iqc||"pending"),
      (l.delivery&&l.delivery!=="—")?l.delivery:""].filter(Boolean).join(" · ")));
  }
  else if(to==="Dropped"){
    h="Project dropped"; ch="SRC_MEMBER";
    f=[cFact("Parts",partsLine),cFact("Vendor",vendorNames)];
  }
  else if(to==="Project Completed"){
    const c=s.close||{};
    h="Project completed"; ch="SRC_MEMBER";
    f=[cFact("Vendor rating",c.rating?c.rating+" / 5":""),cFact("Lessons learned",cTrim(c.lessons,240))];
    m=[cFact("Final cost",c.cost!=null?cInr(c.cost):""),
       cFact("Variance vs approved",c.variance!=null?(c.variance>0?"+":"")+c.variance+"%":"")];
  }
  if(!h) return null;
  return {h:h,f:f.filter(Boolean),m:m.filter(Boolean),ch:ch};
}

/* ---------- write path: the app posts intents, the router applies them ----------
   Nothing here writes a status. Every mutation becomes a row in NPICommands, and
   Svc-Command-Router authorises it against People/Roles, validates the move against
   StatusTransitions, applies only the Hub* shadow columns, notifies the next role in its
   Teams channel and writes the audit row. Two reasons it is a queue and not a PATCH: the
   rules then live in exactly one place, and CurrentStatus is never touched, which is what
   lets the 34 legacy card flows keep running untouched alongside the Hub. */

/* The router derives the required capability from the command name, so the command IS the
   permission. Keyed by the app's own capability strings so a form cannot send a command
   that asks for a different right than the button required. */
/* Who owns the decision at the three phase gates. The team member does the work and records
   the evidence; the head decides. So a submission by anyone other than the head is a
   RECOMMENDATION - it captures the evidence and leaves the project where it is - and the head
   answers a Teams approval, which is what actually moves it.
   Svc-Gate-Approval reads this same map to decide who to ask, so the two engines cannot
   disagree about who a gate belongs to. */
const GATE_LEADER={"F-07":"SQE_HEAD","F-08":"ENG_LEAD","F-09":"MFG_HEAD"};
/* A gate that only exists sometimes. Two failed samples is bad luck; a third is a decision
   about the vendor, and the plant wants a head to look at the plan before more samples are
   ordered. So F-06R becomes a recommend-then-decide gate on the third strike and is an
   ordinary form before that - which is what the F-07 note has always promised and nothing
   has ever enforced. Counted per group, so one bad group does not gate the others. */
const CONDITIONAL_LEADER={"F-06R":(s)=>(((s&&s.rejectionCount)||0)>=3?"SRC_HEAD":null)};
const leaderFor=(formId,roleId,subject)=>{
  const c=CONDITIONAL_LEADER[formId];
  const L=GATE_LEADER[formId]||(c?c(subject):null);
  return (L&&roleId!==L)?L:null;
};

const CMD_FOR_CAP={
  "project.create":"SubmitIntake",        "feasibility.submit":"SubmitFeasibility",
  "routing.decide":"DecideRouting",       "aef.prepare":"RecordAEF",
  "opex.code":"RecordOpexCoding",         "pr.create":"RaisePR",
  "po.confirm":"ConfirmPO",               "vendor.notify":"NotifyVendor",
  "sample.record":"RecordSample",         "sample.validate":"RecordSampleResult",
  "eng.approve":"ApproveEngineering",     "trial.decide":"RecordTrial",
  "psw.initiate":"InitiatePSW",           "psw.sign":"RecordPSWSignoff",
  "pilot.confirmDelivery":"ConfirmDelivery","pilot.disposition":"DispositionLot",
  "pilot.iqc":"RecordIQC",
  /* A distinct command from pr.create: BUYER holds both, PLANNER holds only pr.create, and
     one command name can carry only one capability server-side - sharing it would authorise a
     pilot-lot PR against the weaker right. */
  "pilot.raisePR":"RaiseLotPR",           "project.close":"CloseProject",
  "approve.gate":"RecordDecision",        "approval.reassign":"ReassignApprover",
  "deviation.approve":"ApproveDeviation",
  "admin.manage":"ForceAdvance",
};

/* RequestedBy is a Person column and the router matches it to People.UPN, so the command is
   useless without it. Resolved once against the NPI site - in Teams the host web is the
   team's own site, and a user id from there would be the wrong id. */
let _spUserId=null;
async function spUserId(){
  if(_spUserId!=null) return _spUserId;
  const sp=spx();
  const res=await sp.client.get(sp.siteUrl+"/_api/web/currentuser?$select=Id",sp.cfg);
  if(!res.ok) throw new Error("currentuser: "+res.status);
  _spUserId=(await res.json()).Id;
  return _spUserId;
}
/* SharePoint updates go through POST + X-HTTP-Method MERGE. IF-MATCH * takes the last write
   rather than failing on a concurrent edit, which is right for a rates table one team curates
   and wrong for anything with a state machine - hence only reference data uses this. */
async function spPatch(list,id,item){
  const sp=spx();
  const res=await sp.client.post(sp.siteUrl+"/_api/web/lists/getbytitle('"+list+"')/items("+id+")",sp.cfg,{
    headers:{"Accept":"application/json;odata=nometadata",
             "Content-type":"application/json;odata=nometadata","odata-version":"",
             "IF-MATCH":"*","X-HTTP-Method":"MERGE"},
    body:JSON.stringify(item)});
  if(!res.ok) throw new Error(list+": "+res.status+" "+(await res.text()).slice(0,200));
  return true;
}
async function spDelete(list,id){
  const sp=spx();
  const res=await sp.client.post(sp.siteUrl+"/_api/web/lists/getbytitle('"+list+"')/items("+id+")",sp.cfg,{
    headers:{"Accept":"application/json;odata=nometadata","odata-version":"",
             "IF-MATCH":"*","X-HTTP-Method":"DELETE"}});
  if(!res.ok) throw new Error(list+": "+res.status+" "+(await res.text()).slice(0,200));
  return true;
}
async function spPost(list,item){
  const sp=spx();
  const res=await sp.client.post(sp.siteUrl+"/_api/web/lists/getbytitle('"+list+"')/items",sp.cfg,{
    headers:{"Accept":"application/json;odata=nometadata",
             "Content-type":"application/json;odata=nometadata","odata-version":""},
    body:JSON.stringify(item)});
  if(!res.ok) throw new Error(list+": "+res.status+" "+(await res.text()).slice(0,200));
  return await res.json();
}
/* CommandID is the router's idempotency key - it terminates on a duplicate - so it has to be
   unique per intent, not per retry of the same intent. */
const newCommandId=()=>"HUB-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
async function sendCommand(command,payload,target){
  const uid=await spUserId();
  const cid=newCommandId();
  const row=await spPost("NPICommands",{
    Title:command+" "+(target||""), CommandID:cid, Command:command,
    PayloadJSON:JSON.stringify(payload||{}), RequestedById:uid,
    TargetEntity:target||"", CommandStatus:"Queued"});
  return {itemId:row.Id, commandId:cid};
}
/* The router runs asynchronously, so "saved" is a claim the app cannot make at post time.
   Poll until the row leaves Queued/Processing and report what actually happened - including
   the rejection reason, which is the whole point of having the router write one. */
async function awaitCommand(itemId,ms){
  const sp=spx(), deadline=Date.now()+(ms||90000);
  while(Date.now()<deadline){
    await new Promise(r=>setTimeout(r,2500));
    const res=await sp.client.get(sp.siteUrl+
      "/_api/web/lists/getbytitle('NPICommands')/items("+itemId+")?$select=CommandStatus,ResultMessage",sp.cfg);
    if(res.ok){
      const r=await res.json();
      if(r.CommandStatus==="Applied"||r.CommandStatus==="Rejected") return r;
    }
  }
  return {CommandStatus:"Timeout",
          ResultMessage:"The router did not answer within 90 seconds. The command is still queued and will apply when it runs."};
}

async function spq(list,qs){
  const sp=spx();
  const url=sp.siteUrl+"/_api/web/lists/getbytitle('"+list+"')/items"+(qs?"?"+qs:"");
  const res=await sp.client.get(url,sp.cfg);
  if(!res.ok) throw new Error(list+": "+res.status+" "+(await res.text()).slice(0,180));
  return (await res.json()).value||[];
}

      const rows=await spq("Roles","$select=Title,RoleLabel,Group,AADGroup,CFTSignatory,LegacyRoleCode&$top=200");
      return rows.map(r=>({role:r.RoleLabel||r.Title, code:r.Title||"", aad:r.AADGroup||"—",

    }), grab("matrix",async()=>{
      const rows=await spq("ApprovalMatrix","$select=ChainType,Step,RoleCode,SLAHours,EscalateTo,Form&$top=200&$orderby=ChainType,Step");
      return rows.map(r=>({journey:"NPI", path:r.ChainType||"—",
        sequence:"Step "+(spNum(r.Step)||0)+" · "+(r.RoleCode||"?")+(r.Form?" ("+r.Form+")":""),
        sla:(spNum(r.SLAHours)!=null?spNum(r.SLAHours)+"h":"—")+
            (r.EscalateTo?" → "+r.EscalateTo:"")}));
    }), grab("refdata",async()=>{
      const rows=await spq("RefData","$select=RefList,RefValue,RefCode,Active&$top=500&$orderby=RefList,SortOrder");
      /* One row per value on the site; the screen shows one row per list, which is how an
         admin thinks about reference data. */
      const by={};
      rows.filter(r=>r.Active!==false).forEach(r=>{
        (by[r.RefList||"Other"]=by[r.RefList||"Other"]||[]).push(r.RefValue||r.RefCode||"");
      });
      return Object.keys(by).sort().map(k=>({list:k, values:by[k].join(" · ")}));
    }), grab("sla",async()=>{
      const rows=await spq("SLAConfig","$select=GateKey,SLAHours,ReminderPct,EscalateTo&$top=200");
      return rows.map(r=>({gate:r.GateKey||"—",
        sla:(spNum(r.SLAHours)!=null?spNum(r.SLAHours)+"h":"—"),
        reminder:(spNum(r.ReminderPct)!=null?"at "+spNum(r.ReminderPct)+"%":"—"),
        escalate:r.EscalateTo||"—"}));
    }), grab("people",async()=>{
      /* No $select here, deliberately. Naming a column SharePoint does not have returns
         400 for the whole request, so a single absent field costs the entire directory
         rather than one property - which is how DemoOnly, provisioned on one side only,
         took People down completely. This list is 20 rows; the payload is not worth a
         read that breaks on schema drift. It also means DemoOnly starts arriving the
         moment it exists, with no second change here. */
      const rows=await spq("People","$top=500");
      /* SharePoint's Boolean is Active; the app's vocabulary is a status string, so the
         rename happens here and nowhere else. Only an explicit true counts as active:
         this decides whether someone gets a role, so a null or absent value must fail
         CLOSED. The inverse (`Active===false ? ...`) would treat an unset field as
         permission, which is the wrong way round for an access check.
         DemoOnly is carried through so fabricated rows stay visibly fabricated. */
      return rows.map(r=>({name:r.Title||"", email:(r.UPN||"").toLowerCase(),
        role:(ROLE[r.RoleCode]||{}).label||r.RoleCode||"", roleCode:r.RoleCode||"",
        plant:r.Plant||"Pune", demoOnly:r.DemoOnly===true,
        status:r.Active===true?"Active":"Inactive"}));
    }),
  ]);
  out.__errors=errs;
  return out;
}

/* ---------- keeping the standalone Hub between visits ----------
   On SharePoint the lists ARE the record and nothing is kept here: a local copy of project
   state beside them would be a second source of truth that goes stale the moment a card or
   another person moves a project. Standalone - the Vercel build, a file opened locally, a
   Teams tab on the demo - has no record at all, so every reload threw away whatever had been
   entered. That is what this keeps, and only that.

   `shape` is the seed's own version: when the demo data or the workflow behind it changes,
   yesterday's saved copy describes a process that no longer exists, so it is dropped rather
   than migrated. Every call is wrapped - private windows, blocked site data and a full quota
   all throw, and none of them are a reason for the app not to open. */
const DEMO_KEY="npiHub.standalone";
const DEMO_SHAPE="2026-09-24.team-by-plant";
let demoSaveFailed=false;
const demoLoad=()=>{
  if(spx()) return null;
  try{
    const raw=window.localStorage.getItem(DEMO_KEY);
    if(!raw) return null;
    const o=JSON.parse(raw);
    return (o&&o.shape===DEMO_SHAPE&&o.db)?o:null;
  }catch(e){ return null; }
};
const demoSave=(db,role)=>{
  if(spx()) return;
  try{
    window.localStorage.setItem(DEMO_KEY,JSON.stringify(
      {shape:DEMO_SHAPE,saved:new Date().toISOString(),role:role||"",db:db}));
    demoSaveFailed=false;
  }catch(e){ demoSaveFailed=true; }   /* quota or blocked storage - the footer says so */
};
const demoClear=()=>{ try{ window.localStorage.removeItem(DEMO_KEY); }catch(e){} };

function App(){
  const [page,setPage]=useState("home");
  const [roleKey,setRole]=useState(()=>{const r=demoLoad();return (r&&r.role)||"SRC_MEMBER";});
  const [authSrc,setAuthSrc]=useState("dev");
  /* Who actually signed in, once People resolves them. Every role in ROLE_REGISTRY
     carries a persona name so the role switcher has a face to show, but a persona is

    saveRate:async(r)=>{

    signPSW:(project,group,roleId,decision,comment)=>{
      if(roleKey!==roleId){denied("PSW signature as "+ROLE[roleId].label);return;}
      const ent=project.id+(group?" / "+group:"");
      setDb(d=>{
        const signers=ROLE_REGISTRY.filter(r=>isCFT(r.id,d));
        /* The signature lands on the warrant being signed - the group's, or the project's when
           there are no groups - and the resulting status is that warrant's, not the project's.
           The project follows from the roll-up. */
        const advance=(cur,curStatus)=>{
          const psw={...(cur||{}),signatures:{...((cur||{}).signatures||{}),[roleId]:{decision,by:me,at:todayStr(),comment}}};
          const all=signers.every(r=>psw.signatures[r.id]&&psw.signatures[r.id].decision==="Signed");
          return {psw:psw,status:decision==="Rejected"?"PSW Rejected":all?"FAIR Released":curStatus};
        };
        const projects=d.projects.map(p=>{
          if(p.id!==project.id) return p;
          if(group) return applyTracks({...p,updated:todayStr()},
            tracksOf(p).map(t=>{if(t.g!==group)return t;
              const r=advance(t.psw,t.status);
              return {...t,psw:r.psw,status:r.status,phase:r.status==="FAIR Released"?"PSW":t.phase};}));
          const r=advance(p.psw,p.status);
          return {...p,psw:r.psw,status:r.status,phase:r.status==="FAIR Released"?"PSW":p.phase,updated:todayStr()};
        });
        const now=projects.find(x=>x.id===project.id);
        const released=group
          ? !tracksOf(now).some(t=>t.g===group&&t.status!=="FAIR Released")
          : now.status==="FAIR Released";
        const was=group?((tracksOf(project).find(t=>t.g===group)||{}).status||""):(project.status||"");
        const isNow=group?((tracksOf(now).find(t=>t.g===group)||{}).status||""):(now.status||"");
        return {...d,projects,
          audit:withAudit(d,{action:"F-10 CFT "+decision,entity:ent,
            /* the role is already its own column; detail carries the move when there is one */
            detail:(isNow&&isNow!==was)?((group?group+": ":"")+was+" → "+isNow):ROLE[roleId].label,
            comment:comment||"—"}),
          notifs:withNotif(d,"PSW "+decision.toLowerCase()+" by "+ROLE[roleId].label+" · "+ent
            +(released?(group&&now.status!=="FAIR Released"?" — "+group+" released, project still "+now.status:" — FAIR released"):""))};
      });
      flash("PSW "+decision+" — "+ent);
      const pswFrom=group?((trackOf(project,group)||{}).status||""):project.status;
      const pswCur=(group?(trackOf(project,group)||{}).psw:project.psw)||{};
      const pswSigs={...(pswCur.signatures||{}),[roleId]:{decision:decision}};
      const pswAll=ROLE_REGISTRY.filter(r=>isCFT(r.id,db)).every(r=>pswSigs[r.id]&&pswSigs[r.id].decision==="Signed");
      const pswTo=decision==="Rejected"?"PSW Rejected":(pswAll&&pswFrom==="PSW Sign-off Pending")?"FAIR Released":"";
      runCommand("psw.sign",{projectId:project.id,
        ...(pswTo?{fromStatus:pswFrom,toStatus:pswTo,
          ...cardBits(project,{group:group,from:pswFrom,to:pswTo,note:comment,
            tracks:tracksOf(project).map(t=>t.g===group?{...t,status:pswTo}:t)})}:{}),
        ...trackBitsFor(project,group,(t)=>{
          const cur=t.psw||{},sigs={...(cur.signatures||{}),[roleId]:{decision,by:me,at:todayStr(),comment}};
          const signers=ROLE_REGISTRY.filter(r=>isCFT(r.id,db));
          const all=signers.every(r=>sigs[r.id]&&sigs[r.id].decision==="Signed");
          return {...t,psw:{...cur,signatures:sigs},
            status:decision==="Rejected"?"PSW Rejected":all?"FAIR Released":t.status};
        }),fields:{role:roleId,decision:decision,comment:comment||"",group:group||""}},
        project.id,"PSW "+decision);
    },
