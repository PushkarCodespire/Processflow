<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>NPI Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#202020; --ink-soft:#3A3A3A; --muted:#707070; --faint:#909090;
  --teal:#E1261C; --teal-d:#A81610; --teal-l:#C21B12; --teal-wash:#FBEAE8;
  --red:#C4281C; --red-wash:#FBEAE8;
  --gold:#D9A63C;
  --amber:#B4740E; --amber-wash:#FBF1DF;
  --green:#1E7E45; --green-wash:#E4F2EA;
  --blue:#215E9E; --blue-wash:#E6EEF6;
  --ground:#F4F4F4; --surface:#FFFFFF; --panel:#F7F7F7; --panel2:#EFEFEF;
  --border:#E2E2E2; --border2:#ECECEC;
  --sidebar:#0E1C1B; --sidebar-2:#152826; --sidebar-tx:#B7C6C2; --sidebar-tx2:#7C8F8A;
  --shadow:none;
  --shadow-l:0 2px 10px rgba(16,40,38,.16);
  --sans:"Honeywell Sans","Inter","Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E8EDEB; --ink-soft:#C4CFCB; --muted:#94A29E; --faint:#6F7E7A;
  --teal:#F0645B; --teal-l:#F27A72; --teal-wash:#3A1F1D;
  --red:#F08B80; --red-wash:#3A211E; --amber:#E0A94A; --amber-wash:#33280F;
  --green:#5FC888; --green-wash:#12301E; --blue:#7FB0DE; --blue-wash:#142634;
  --ground:#0C1514; --surface:#141F1D; --panel:#111A19; --panel2:#0F1817;
  --border:#26332F; --border2:#1E2A28;
  --sidebar:#0A1413; --sidebar-2:#111F1D;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.3);
  --shadow-l:0 6px 22px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --ink:#E8EDEB; --ink-soft:#C4CFCB; --muted:#94A29E; --faint:#6F7E7A;
  --teal:#F0645B; --teal-l:#F27A72; --teal-wash:#3A1F1D;
  --red:#F08B80; --red-wash:#3A211E; --amber:#E0A94A; --amber-wash:#33280F;
  --green:#5FC888; --green-wash:#12301E; --blue:#7FB0DE; --blue-wash:#142634;
  --ground:#0C1514; --surface:#141F1D; --panel:#111A19; --panel2:#0F1817;
  --border:#26332F; --border2:#1E2A28;
  --sidebar:#0A1413; --sidebar-2:#111F1D;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.3);
  --shadow-l:0 6px 22px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
*,*::before,*::after{border-radius:0 !important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
#root{min-height:100vh}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

/* shell */
.shell{display:flex;flex-direction:column;min-height:100vh}
.appheader{display:flex;align-items:center;height:58px;background:var(--surface);border-bottom:1px solid var(--border);color:var(--ink);position:sticky;top:0;z-index:10;padding:0 20px}
.brandwrap{display:flex;align-items:center;gap:11px;min-width:0}
.wordmark{font-weight:700;font-size:19px;color:var(--teal);letter-spacing:-.4px}
.hdiv{width:1px;height:22px;background:var(--border);margin:0 6px;flex:none}
.apptitle{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap}
.crumb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.hicon{width:36px;height:36px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:grid;place-items:center;position:relative;font-size:15px}
.hicon:hover{background:var(--panel);color:var(--ink)}
.hicon .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;background:var(--teal);border:1.5px solid var(--surface)}
.hamburger{display:none;width:38px;height:38px;flex:none;align-items:center;justify-content:center;background:none;border:1px solid var(--border);color:var(--ink);cursor:pointer;padding:0}
.hamburger svg{width:20px;height:20px}
.nav-backdrop{display:none}
.demoTag{font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--teal);background:var(--teal-wash);padding:3px 7px;text-transform:uppercase}
.roleSel{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--border);padding:4px 10px 4px 5px}
.roleSel .av{width:28px;height:28px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11.5px}
.roleSel .who{line-height:1.12;color:var(--ink)}
.roleSel .who b{font-size:12.5px}
.roleSel .who span{font-size:10.5px;color:var(--muted)}
.roleSel select{border:none;background:none;font-family:inherit;font-size:12px;color:var(--ink);font-weight:600;outline:none;cursor:pointer}
.roleSel select option{color:var(--ink)}

.body{display:grid;grid-template-columns:224px 1fr;flex:1;min-height:0}
.sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:58px;height:calc(100vh - 58px)}
.sb-nav{padding:14px 12px;overflow-y:auto;flex:1}
.sb-sec{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);padding:14px 10px 6px;font-weight:700}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;color:var(--ink-soft);padding:9px 11px;border-radius:8px;font-size:13px;font-weight:500;text-align:left;transition:background .12s,color .12s}
.sb-item svg{width:17px;height:17px;flex:none;opacity:.9}
.sb-item:hover{background:var(--teal-wash);color:var(--teal)}
.sb-item.active{background:var(--teal);color:#fff}
.sb-badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--red);color:#fff;border-radius:20px;padding:1px 7px;min-width:18px;text-align:center}
.sb-item.active .sb-badge{background:rgba(255,255,255,.28)}
.sb-foot{padding:12px 16px;border-top:1px solid var(--border);font-size:10.5px;color:var(--faint)}
.appfooter{background:var(--panel);border-top:1px solid var(--border);color:var(--muted);font-size:11.5px;text-align:center;padding:11px 20px}
.appfooter u{color:var(--teal);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--teal) 40%,transparent)}
.main{display:contents}

/* content */
.content{padding:24px 26px 60px;overflow-y:auto;min-width:0}
.pagehead{margin-bottom:20px}
.pagehead h1{font-size:23px;margin:0 0 3px;letter-spacing:-.3px;font-weight:600}
.pagehead p{margin:0;color:var(--muted);font-size:14px}
.pagehead .hi{color:var(--teal)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .k{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.tile .k .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.tile .v{font-size:30px;font-weight:700;margin-top:8px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:1px}
.tile.warn .v{color:var(--red)}
.ic-teal{background:var(--teal-wash);color:var(--teal)}
.ic-amber{background:var(--amber-wash);color:var(--amber)}
.ic-red{background:var(--red-wash);color:var(--red)}
.ic-green{background:var(--green-wash);color:var(--green)}
.ic-blue{background:var(--blue-wash);color:var(--blue)}

.cols{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.block{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.block-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border2)}
.block-h h2{font-size:14px;margin:0;display:flex;align-items:center;gap:9px;font-weight:600}
.block-h .cnt{font-size:11px;color:var(--muted);font-weight:600;background:var(--panel2);padding:2px 8px;border-radius:20px}
.block-h .link{font-size:12px;color:var(--teal);font-weight:600;background:none;border:none}

/* task rows */
.task{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid var(--border2)}
.task:last-child{border-bottom:none}
.task:hover{background:var(--panel)}
.task .stripe{width:3px;align-self:stretch;border-radius:3px;flex:none}
.task .body{flex:1;min-width:0}
.task .t1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.task .pid{font-family:var(--mono);font-size:11.5px;color:var(--teal);font-weight:600}
.task .ttl{font-size:13.5px;font-weight:600}
.task .t2{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.task .act{flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.p-teal{background:var(--teal-wash);color:var(--teal)} .p-red{background:var(--red-wash);color:var(--red)}
.p-amber{background:var(--amber-wash);color:var(--amber)} .p-green{background:var(--green-wash);color:var(--green)}
.p-blue{background:var(--blue-wash);color:var(--blue)} .p-gray{background:var(--panel2);color:var(--muted)}
.sla{font-family:var(--mono);font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.sla.g{color:var(--green)} .sla.a{color:var(--amber)} .sla.r{color:var(--red)}
.btn{font-size:12.5px;font-weight:600;border-radius:8px;padding:7px 14px;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft)}
.btn:hover{background:var(--panel)}
.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.primary:hover{background:var(--teal-l)}
.btn.sm{padding:5px 10px;font-size:11.5px;min-width:88px;text-align:center;white-space:nowrap}
.btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
.btn.no{background:var(--surface);color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--border))}

/* data table */
.dt{background:var(--surface)}
.dt-tools{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border2);flex-wrap:wrap}
.dt-search{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--panel);padding:7px 10px;color:var(--muted);min-width:180px;flex:1}
.dt-search input{border:none;background:none;outline:none;font-family:inherit;font-size:13px;color:var(--ink);width:100%}
.dt-filter{font-family:inherit;font-size:12.5px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--border);padding:7px 9px;font-weight:500;cursor:pointer}
.dt-count{font-size:11.5px;color:var(--muted);margin-left:auto;font-weight:600;white-space:nowrap}
.dt-wrap{overflow-x:auto}
.dt-table{width:100%;border-collapse:collapse;font-size:13px}
.dt-table th{text-align:left;padding:9px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);background:var(--panel);white-space:nowrap}
.dt-table th.sortable{cursor:pointer;user-select:none}
.dt-table th.sortable:hover{color:var(--teal)}
.dt-table th .arr{margin-left:5px;font-size:9px}
.dt-table th .arr.dim{opacity:.32}
.dt-table td{padding:9px 12px;border-bottom:1px solid var(--border2);vertical-align:middle}
.dt-table tbody tr:hover{background:var(--panel)}
.dt-empty{text-align:center;color:var(--muted);padding:26px}
.xlwrap{border:1px solid var(--border);background:var(--surface);overflow:auto;max-height:340px}
.xltable{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
/* Part number and description carry the identifying text, so they get the room; the
   numerics and the currency only ever hold a few characters. */
.qgrid .xltable{table-layout:auto;min-width:760px}
.qgrid .xltable th:nth-child(2),.qgrid .xltable td:nth-child(2){width:17%}
.qgrid .xltable th:nth-child(3),.qgrid .xltable td:nth-child(3){width:30%}
.qgrid .xltable th:nth-child(n+4),.qgrid .xltable td:nth-child(n+4){width:13%}
/* A currency is three characters - it needs a fraction of the room a price does. The two
   headers wrap onto a second line rather than holding the column open. */
.qgrid .xltable th:nth-child(6),.qgrid .xltable td:nth-child(6),
.qgrid .xltable th:nth-child(8),.qgrid .xltable td:nth-child(8){width:74px}
.qgrid .xltable th:nth-child(6),.qgrid .xltable th:nth-child(8){white-space:normal;line-height:1.25}
.qgrid .xltable td:nth-child(6) .xlsel,.qgrid .xltable td:nth-child(8) .xlsel{padding-left:6px;padding-right:2px}
.qgrid .xlwrap{max-height:420px}
/* The PR/PO grid is narrower than the quote grid and carries one free-text column, so the
   description takes the slack. Without this the row-number column absorbed it and the PR
   step drew a serial column wider than the part numbers. */
.sgrid .xltable{min-width:0;table-layout:fixed}
.sgrid .xltable th:nth-child(2),.sgrid .xltable td:nth-child(2){width:132px}
.sgrid .xltable th:nth-child(3),.sgrid .xltable td:nth-child(3){width:auto}
.sgrid .xltable th:nth-child(n+4),.sgrid .xltable td:nth-child(n+4){width:120px}
.vgrid .xltable{table-layout:auto;min-width:660px}
.vgrid .xltable th:nth-child(2),.vgrid .xltable td:nth-child(2){width:26%}
.vgrid .xltable th:nth-child(3),.vgrid .xltable td:nth-child(3){width:34%}
.vgrid .xltable th:nth-child(4),.vgrid .xltable td:nth-child(4){width:30%}
.xltable th{position:sticky;top:0;z-index:1;text-align:left;padding:7px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;background:var(--panel);border-bottom:1px solid var(--border);border-right:1px solid var(--border2);white-space:nowrap}
.xltable td{padding:0;border-bottom:1px solid var(--border2);border-right:1px solid var(--border2);vertical-align:middle}
.xltable tr:last-child td{border-bottom:none}
.xltable th.rn,.xltable td.rn{width:34px;text-align:center;color:var(--faint);font-size:11px;background:var(--panel);font-family:var(--mono)}
.xltable td.rn{padding:6px 0}
.xltable td input{font-family:inherit;font-size:12.5px;color:var(--ink);background:transparent;border:0;outline:none;padding:7px 9px;width:100%;display:block}
.xltable td .dcell{display:flex;align-items:center;gap:4px;padding:3px 6px}
.xltable td .dcell input{padding:4px 5px}
.btn.xs{font-size:10.5px;padding:3px 7px;line-height:1.2;white-space:nowrap}
.btn.xs[disabled]{opacity:.4;cursor:default}

/* ---------------------------------------------------------------- reports */
.rbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--border);border-radius:13px;padding:11px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.rfilter{display:flex;flex-direction:column;gap:3px}
.rfilter span{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.rfilter select{font-size:12.5px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;
  background:var(--panel2);color:var(--ink);min-width:120px;font-weight:500}
.rfilter select:focus{outline:2px solid var(--teal);outline-offset:-1px}
.rspacer{flex:1 1 auto}
.rasat{font-size:11px;color:var(--muted);white-space:nowrap}

.rtabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--border);
  border-radius:11px;padding:4px;margin-bottom:16px;overflow-x:auto}
.rtab{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;
  padding:8px 15px;border-radius:8px;cursor:pointer;white-space:nowrap;font-family:inherit}
.rtab:hover{color:var(--ink)}
.rtab.on{background:var(--surface);color:var(--teal);box-shadow:var(--shadow)}

.rtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px;margin-bottom:16px}
.rtile{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 15px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.rtile .k{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.rtile .k .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.rtile .v{font-size:27px;font-weight:700;margin-top:9px;letter-spacing:-.8px;font-variant-numeric:tabular-nums;
  display:flex;align-items:baseline;gap:8px}
.rtile .s{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rtile .nodata{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.rtile.clickable{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.rtile.clickable:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(0,0,0,.10)}
/* A target turns a number into a judgement, so it is shown as a stripe rather than a word. */
.rtile.rag-good{box-shadow:inset 3px 0 0 var(--green),var(--shadow)}
.rtile.rag-warn{box-shadow:inset 3px 0 0 var(--amber),var(--shadow)}
.rtile.rag-bad{box-shadow:inset 3px 0 0 var(--red),var(--shadow)}
.delta{font-weight:700;font-size:10.5px;padding:1px 6px;border-radius:20px}
.delta.up{color:var(--green);background:var(--green-wash)}
.delta.down{color:var(--red);background:var(--red-wash)}

.rpanel .block-h{align-items:center}
.rsub{padding:0 16px;margin-top:-4px;font-size:11.5px;color:var(--muted)}
.rempty{padding:26px 14px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7;
  border:1px dashed var(--border);border-radius:10px;background:var(--panel2)}
.rempty b{color:var(--ink-soft)}
.hbar-row.pick{cursor:pointer;border-radius:6px}
.hbar-row.pick:hover .hbar-fill{filter:brightness(1.12)}
.hbar-row.pick:hover .hbar-lbl{color:var(--teal)}
.hbar-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-row{grid-template-columns:minmax(120px,210px) 1fr minmax(52px,auto)}
.hbar-track{position:relative;border-radius:3px;overflow:hidden}
.hbar-fill{border-radius:3px;transition:width .3s ease}
.hbar-mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-soft);opacity:.55}

.rstack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--panel2)}
.rstack-seg{transition:width .3s ease}
.rlegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted)}
.rlegend span{display:flex;align-items:center;gap:6px}
.rlegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.rlegend b{color:var(--ink);font-variant-numeric:tabular-nums}
.rspark{opacity:.85}


.rchart{position:relative;width:100%}
.rchart canvas{width:100%!important}
.rchart-load{display:grid;place-items:center;color:var(--muted);font-size:12px;
  border:1px dashed var(--border);border-radius:10px;background:var(--panel2)}
.rtable-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
.rtable{width:100%;border-collapse:collapse;font-size:12.5px}
.rtable th{text-align:left;padding:9px 12px;background:var(--panel2);color:var(--muted);
  font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.rtable td{padding:9px 12px;border-top:1px solid var(--border)}
.rtable td.num,.rtable th.num{text-align:right;font-variant-numeric:tabular-nums}
.rtable tr.pick{cursor:pointer}
.rtable tr.pick:hover td{background:var(--panel2)}
.rrate{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.rrate i{height:7px;border-radius:4px;display:inline-block;min-width:3px;max-width:90px}
@media(max-width:860px){.rbar{gap:8px}.rfilter select{min-width:98px}.rasat{display:none}}

.grpchip{background:var(--teal);color:#fff;border-color:var(--teal)}
.trk{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border)}
.trk-row{display:grid;grid-template-columns:minmax(150px,1.4fr) minmax(130px,auto) minmax(150px,1.6fr) auto;

.jstep .jdot{flex:none;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--panel2);color:var(--muted)}

.jdetail .dt-table tr.jnow td{background:var(--teal-wash)}

.qtot .good{color:var(--teal)} .qtot .bad{color:var(--red)}
.xlpaste{margin-top:10px}

.tpid{font-family:var(--mono);font-size:11.5px;color:var(--teal);font-weight:600;white-space:nowrap}
.tcell{font-weight:500}
.tmeta{color:var(--muted);font-size:12px}
.dt-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--border2);font-size:12px;color:var(--muted);flex-wrap:wrap}
.dt-pager{display:flex;align-items:center;gap:10px}
.dt-page{font-size:12px;color:var(--ink-soft);font-weight:600}

/* material data grid */
.mdg{background:var(--surface);position:relative}
.mdg-toolbar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border2)}
.mdg-tbtn{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--teal);font-family:inherit;font-size:12px;font-weight:500;letter-spacing:.4px;padding:7px 10px;text-transform:uppercase}
.mdg-tbtn:hover,.mdg-tbtn.on{background:var(--teal-wash)}
.mdg-tbtn svg{width:16px;height:16px}
.mdg-quick{margin-left:auto;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding:6px 4px;min-width:180px}
.mdg-quick input{border:none;background:none;outline:none;font-family:inherit;font-size:13px;color:var(--ink);width:100%}
.mdg-quick svg{width:16px;height:16px;color:var(--muted);flex:none}
.colpanel{position:absolute;z-index:15;top:46px;left:8px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-l);padding:8px 6px;min-width:200px}
.colpanel .cp-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:4px 10px 8px}
.colpanel label{display:flex;align-items:center;gap:10px;padding:7px 10px;font-size:13px;cursor:pointer}
.colpanel label:hover{background:var(--panel)}
.colpanel input{accent-color:var(--teal);width:15px;height:15px}
.mdg-wrap{overflow-x:auto}
.mdg-table{width:100%;border-collapse:collapse;font-size:13px}
.mdg-table th{text-align:left;padding:11px 12px;font-size:12.5px;color:var(--ink-soft);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
.mdg-table th.sortable{cursor:pointer;user-select:none}
.mdg-table th.sortable:hover{color:var(--teal)}
.mdg-table th .arr{margin-left:6px;font-size:10px;color:var(--teal)}
.mdg-table th .arr.dim{opacity:0}
.mdg-table th.sortable:hover .arr.dim{opacity:.4}
.filter-row th{padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border2)}
.filter-row input,.filter-row select{width:100%;font-family:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);outline:none}
.filter-row input:focus,.filter-row select:focus{border-color:var(--teal)}
.mdg-table td{padding:11px 12px;border-bottom:1px solid var(--border2);vertical-align:middle;color:var(--ink)}
.mdg-table tbody tr:hover{background:var(--panel)}
.mdg-empty{text-align:center;color:var(--muted);padding:28px}
.mchip{display:inline-block;font-size:11px;padding:3px 9px;border:1px solid var(--border);color:var(--ink-soft);background:var(--panel)}
.mdg-footer{display:flex;align-items:center;justify-content:flex-end;gap:26px;padding:6px 14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.mdg-rpp{display:flex;align-items:center;gap:8px}
.mdg-rpp select{font-family:inherit;font-size:12.5px;border:none;background:none;color:var(--ink);font-weight:500;outline:none;cursor:pointer}
.mdg-arrows{display:flex;align-items:center;gap:2px}
.mdg-arrows button{width:32px;height:32px;border:none;background:none;color:var(--ink-soft);font-size:20px;line-height:1;cursor:pointer}
.mdg-arrows button:hover:not([disabled]){background:var(--panel);color:var(--teal)}
.mdg-arrows button[disabled]{opacity:.32;cursor:default}
.mdg-click{cursor:pointer}
/* datatable responsive */
@media (max-width:680px){
  .mdg-toolbar{flex-wrap:wrap}
  .mdg-quick{margin-left:0;order:3;flex:1 1 100%;min-width:0;margin-top:2px}
  .mdg-footer{flex-wrap:wrap;gap:12px 18px;justify-content:space-between}
  .colpanel{left:8px;right:8px;min-width:0}
}
@media (max-width:560px){
  .mdg-wrap{overflow-x:visible}
  .mdg-table,.mdg-table tbody,.mdg-table tr,.mdg-table td{display:block;width:auto}
  .mdg-table thead{display:none}
  .mdg-table tr{border:1px solid var(--border);margin:10px;background:var(--surface)}
  .mdg-table tbody tr:hover{background:var(--surface)}
  .mdg-table td{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 12px;border:none;border-bottom:1px solid var(--border2);text-align:right}
  .mdg-table td:last-child{border-bottom:none}
  .mdg-table td::before{content:attr(data-label);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;text-align:left;flex:0 0 38%;white-space:nowrap}
  .mdg-table td[data-label=""]{justify-content:flex-end}
  .mdg-table td[data-label=""]::before{display:none}
  .mdg-table td.mdg-empty{justify-content:center;text-align:center;padding:22px}
  .mdg-table td.mdg-empty::before{content:none}
}
.backlink{background:none;border:none;color:var(--teal);font-family:inherit;font-size:13px;font-weight:600;padding:2px 0;margin-bottom:8px;cursor:pointer}
.backlink:hover{text-decoration:underline}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
/* The project header carries five tiles since the two suppliers were split apart; four
   columns left the fifth stranded on a row of its own. */

.detail-grid.six{grid-template-columns:repeat(6,1fr)}

/* ppap request form */
.ppap-grid{display:grid;grid-template-columns:196px 1fr 282px;gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.panel-pad{padding:16px}
.eyebrow2{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;margin-bottom:12px}
.step{display:flex;gap:11px;padding-bottom:16px;position:relative}
.step:last-child{padding-bottom:0}
.step .sdot{width:26px;height:26px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--border);color:var(--muted);background:var(--panel);z-index:1}
.step.done .sdot{background:var(--teal);color:#fff;border-color:var(--teal)}
.step.current .sdot{border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 3px var(--teal-wash)}
.step .sline{position:absolute;left:12.5px;top:26px;bottom:0;width:1.5px;background:var(--border)}
.step.done .sline{background:var(--teal)}
.step .sl{font-size:13px;font-weight:500;line-height:1.2}
.step.current .sl{color:var(--teal);font-weight:600}
.step .ss{font-size:11px;color:var(--muted);margin-top:2px}

.rtag{font-size:9px;text-transform:uppercase;letter-spacing:.3px;font-weight:700;padding:2px 7px;align-self:flex-start}

.rtag.skipped{background:var(--panel2);color:var(--faint)}
.formhead{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;padding:15px 18px;border-bottom:1px solid var(--border2)}

.formbody{padding:18px}

.radio2 input{accent-color:var(--teal);width:15px;height:15px}
.flabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.flabel i{color:var(--red);font-style:normal}
.fsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--teal);font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--border2);margin:22px 0 14px}
.fsec-row{display:flex;justify-content:space-between;align-items:center}

.field2.fullrow{grid-column:1 / -1}
.imp-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}
.field2{display:flex;flex-direction:column;gap:5px}
.field2 input,.field2 textarea{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);padding:8px 10px;width:100%;outline:none;resize:vertical}

.attachrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;padding-top:15px;border-top:1px solid var(--border2)}

.rk2{font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.ready2.ok .rk2{color:var(--green)} .ready2.warn .rk2{color:var(--amber)}

.ppap-actions{display:flex;flex-direction:column;gap:9px;margin-top:14px}

@media (max-width:1080px){ .ppap-grid{grid-template-columns:1fr} }

/* approval detail */

.btn.ok:hover{filter:brightness(1.08)}
.btn.no{background:var(--surface);color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--border))}
.btn.no:hover{background:var(--red-wash)}

/* admin */
.admin-grid{display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:start}

.form-grid select,.form-grid input,.form-grid textarea{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);padding:8px 10px;width:100%;outline:none}

.usermenu{position:absolute;top:46px;right:0;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-l);width:200px;z-index:40}
.usermenu button{display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;font-size:13px;color:var(--ink-soft);padding:10px 14px;cursor:pointer}
.usermenu button:hover{background:var(--panel);color:var(--teal)}
.chipbtn{cursor:pointer}

/* intake wizard */
.wiz{max-width:860px}
.wiz-steps{display:flex;align-items:center;margin-bottom:16px}
.wiz-step{display:flex;align-items:center;gap:9px}
.wiz-step.done{cursor:pointer}
.wiz-step .wn{width:28px;height:28px;flex:none;display:grid;place-items:center;border:1.5px solid var(--border);color:var(--muted);font-size:12px;font-weight:700;background:var(--surface)}
.wiz-step.done .wn{background:var(--teal);color:#fff;border-color:var(--teal)}
.wiz-step.current .wn{border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 3px var(--teal-wash)}
.wiz-step .wl{font-size:13px;font-weight:500;color:var(--ink-soft)}
.wiz-step.current .wl{color:var(--teal);font-weight:600}
.wiz-line{height:2px;background:var(--border);flex:1;margin:0 8px}
.wiz-line.on{background:var(--teal)}
.wiz-nav{display:flex;justify-content:space-between;margin-top:16px}
.wiz-right{display:flex;gap:9px;align-items:center}
.field2 select{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);padding:8px 10px;width:100%;outline:none}
.field2 select:focus{border-color:var(--teal)}
.wcol2{grid-column:span 2}
.part-head{display:grid;grid-template-columns:1fr 1.4fr 1fr 82px;gap:10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:0 2px 7px}
.part-row{display:grid;grid-template-columns:1fr 1.4fr 1fr 82px;gap:10px;margin-bottom:10px;align-items:center}
.part-row input{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);padding:8px 10px;width:100%;outline:none}
.part-row input:focus{border-color:var(--teal)}
@media (max-width:720px){ .part-head{display:none} .part-row{grid-template-columns:1fr;gap:6px} .wcol2{grid-column:auto} }
.grp-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:11px 13px;background:var(--panel);border:1px solid var(--border2)}
.grp-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;background:var(--surface);border:1px solid var(--border);color:var(--ink)}
.grp-chip b{color:var(--teal)}
.grp-chip .x{cursor:pointer;color:var(--muted);font-weight:700;padding:0 2px}
.grp-chip .x:hover{color:var(--red)}
.grp-add{display:inline-flex;gap:6px;align-items:center;margin-left:auto}
.grp-add input{font-family:inherit;font-size:12.5px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:6px 9px;width:160px;outline:none}
.grp-add input:focus{border-color:var(--teal)}
.partbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.field2.invalid input,.field2.invalid textarea,.field2.invalid select{border-color:var(--red);background:var(--red-wash)}
.field2.invalid .xltable td input,.field2.invalid .xltable td select{background:transparent;border-color:transparent}
.xltable th i{color:var(--red);font-style:normal;margin-left:2px}
.xltable td.miss{background:var(--red-wash);box-shadow:inset 0 0 0 1px var(--red)}
/* The email under each name on the intake team step - secondary, and never mistaken for
   the name field above it. */
.teammail{margin-top:5px;font-size:12px;color:var(--muted)}
.rovalue{padding:7px 9px;border:1px dashed var(--border);border-radius:6px;background:var(--panel2,transparent);color:var(--muted);font-size:12.5px}
.ferr{color:var(--red);font-size:11.5px;margin-top:3px;font-weight:500;line-height:1.35}
.fhint{color:var(--muted);font-size:11.5px;margin-top:3px;line-height:1.35}
.rateinp{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--surface);border:1px solid var(--teal);padding:5px 7px;width:100%;max-width:130px;outline:none}
.combo{position:relative}
.combo>input{width:100%;padding-right:30px!important}
.combo-caret{position:absolute;top:0;right:0;height:100%;width:28px;display:grid;place-items:center;color:var(--muted);cursor:pointer;pointer-events:auto;font-size:9px}
.combo-caret:hover{color:var(--teal)}
.combo-pop{position:absolute;z-index:40;top:calc(100% + 2px);left:0;right:0;max-height:212px;overflow:auto;background:var(--surface);border:1px solid var(--border);box-shadow:0 8px 22px rgba(0,0,0,.14)}
.combo-opt{padding:7px 10px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo-opt:hover,.combo-opt.on{background:var(--teal-wash);color:var(--teal)}
.combo-none{padding:8px 10px;font-size:12px;color:var(--muted)}
.combo-new{padding:7px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--border2)}
.fwarn{color:var(--amber);font-size:11.5px;margin-top:3px;font-weight:500;line-height:1.35}
.wiz-left{display:flex;gap:10px;flex-wrap:wrap}
.groupby-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;padding:11px 13px;background:var(--surface);border:1px solid var(--border2)}
.groupby-row select{font-family:inherit;font-size:12.5px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:6px 9px;outline:none}
.groupby-row select:focus{border-color:var(--teal)}
.gb-label{font-size:12.5px;font-weight:600;color:var(--ink)}
.gb-note{font-size:11.5px;color:var(--muted);margin-left:auto}
.fsec-btns{display:flex;gap:8px;flex-wrap:wrap}
.impfile{font-size:12px;color:var(--teal);margin-top:6px}
.impfile b{color:var(--ink)}
@media(max-width:680px){ .gb-note{margin-left:0;flex-basis:100%} }
.partnote{font-size:12.5px;color:var(--muted);margin:-4px 0 14px;line-height:1.5}
.partnote b{color:var(--ink)}
.attach-box{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:11px 13px;background:var(--panel);border:1px solid var(--border2)}
.attach-empty{font-size:12.5px;color:var(--muted)}
.attach-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;background:var(--surface);border:1px solid var(--border);color:var(--ink)}
.attach-chip .x{cursor:pointer;color:var(--muted);font-weight:700;padding:0 2px}
.attach-chip .x:hover{color:var(--red)}
.emptyparts{padding:18px;border:1px dashed var(--border);color:var(--muted);font-size:13px;text-align:center;margin-top:12px}
.pgroup{border:1px solid var(--border2);margin-top:12px}
.pgroup-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--border2);font-size:13px;font-weight:600;color:var(--ink)}
.pgroup-head .cnt{color:var(--teal);font-weight:600}
.pgroup-head .note{margin-left:auto;font-weight:400;font-size:11px;color:var(--muted)}
.pcard{display:grid;grid-template-columns:1.1fr 1.7fr 1.3fr auto;gap:12px;align-items:center;padding:9px 12px;border-top:1px solid var(--border2);font-size:12.5px;color:var(--ink-soft)}
.pcard:first-of-type{border-top:none}
.pcard .pn{font-weight:600;color:var(--ink)}
.pcard .meta{color:var(--muted);font-size:11.5px}
@media(max-width:720px){ .pcard{grid-template-columns:1fr;gap:4px} .grp-add{margin-left:0;width:100%} .grp-add input{flex:1} }
/* intake stepper — small screens */
@media(max-width:560px){
  .wiz-steps{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .wiz-step .wl{display:none;white-space:nowrap}
  .wiz-step.current .wl{display:inline}
  .wiz-line{margin:0 6px;min-width:14px}
  .pgroup-head{flex-wrap:wrap}
  .pgroup-head .note{margin-left:0;flex-basis:100%}
  .partbtns .btn{flex:1}
  .imp-row{flex-direction:column;align-items:stretch}
  .imp-row .btn{width:100%}
}

/* phase board (Planner-style) */
.board-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.board-tools .seg{margin-bottom:0}
.bt-search{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);padding:7px 10px;min-width:190px;flex:1;max-width:300px}
.bt-search input{border:none;background:none;outline:none;font-family:inherit;font-size:13px;color:var(--ink);width:100%}
.bt-sel{font-family:inherit;font-size:12.5px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:7px 9px;outline:none}
.bt-sel:focus{border-color:var(--teal)}
.bt-label{font-size:12px;color:var(--muted);font-weight:600}
.bt-chip{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:14px}
.bcol{flex:0 0 296px;width:296px;background:var(--panel);border:1px solid var(--border);display:flex;flex-direction:column;max-height:calc(100vh - 260px)}
.bcol.over{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-wash)}
.bcol-h{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:2}
.bcol-h .nm{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcol-h .ct{font-size:11px;font-weight:700;color:var(--muted);background:var(--panel2);padding:1px 8px;border-radius:20px;flex:none}
.bcol-h .add{margin-left:auto;background:none;border:none;color:var(--teal);font-size:18px;line-height:1;padding:0 4px;flex:none}
.bcol-b{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;flex:1;min-height:88px}
.bcard{background:var(--surface);border:1px solid var(--border);padding:10px 11px 10px 14px;cursor:pointer;position:relative;box-shadow:var(--shadow)}
.bcard:hover{border-color:var(--teal)}
.bcard.dragging{opacity:.4}
.bcard .stripe{position:absolute;left:0;top:0;bottom:0;width:3px}
.bcard .bid{font-family:var(--mono);font-size:11px;color:var(--teal);font-weight:600}
.bcard .btitle{font-size:13px;font-weight:600;margin:3px 0 7px;line-height:1.3;color:var(--ink)}
.bcard .bmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px}
.bcard .bav{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:700;flex:none}
.bcard .bsm{font-size:11px;color:var(--muted)}
.bcard-empty{font-size:12px;color:var(--faint);text-align:center;padding:16px 8px;border:1px dashed var(--border)}
.bprog{height:3px;background:var(--panel2);margin-top:9px}
.bprog i{display:block;height:100%;background:var(--teal)}
@media (max-width:560px){ .bcol{flex:0 0 84vw;width:84vw} .bt-chip{margin-left:0;flex-basis:100%} }
/* stage 5 — reports / modals / detail views */
@media (max-width:560px){
  .modal-back{padding:16px 10px}
  .form-grid{grid-template-columns:1fr}
  .modal-f .btn{flex:1}
  .chartbody{padding:14px}
  .tiles.five{gap:10px}
}
@media (max-width:480px){
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv .kk{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;margin-top:9px}
  .kv .kk:first-child{margin-top:0}
}
@media (max-width:420px){ .tiles.five{grid-template-columns:1fr} }
/* stage 6 — touch targets on phones */
@media (max-width:560px){
  .btn{padding:9px 15px}
  .btn.sm{padding:8px 12px;font-size:12px}
  .mdg-arrows button{width:38px;height:38px}
  .mdg-tbtn{padding:9px 11px}
  .mdg-rpp select{padding:6px 4px}
  .linkbtn{padding:7px 0}
}

/* approval mini */
.appr{padding:14px 16px;border-bottom:1px solid var(--border2)}
.appr:last-child{border-bottom:none}
.appr-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.appr-role{font-size:10.5px;color:var(--muted)}
.appr-title{font-size:13px;font-weight:500;margin-top:6px;line-height:1.35}
.appr-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.appr-actions{display:flex;gap:8px;margin-top:12px}
.appr-actions .btn{flex:1}
.appr.done .appr-status{font-size:12px;font-weight:600;margin-top:6px}
.appr.done.ok .appr-status{color:var(--green)}
.appr.done.no .appr-status{color:var(--red)}

/* activity */
.act-item{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--border2)}
.act-item:last-child{border-bottom:none}
.act-item .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.act-item .tx{font-size:12.5px;color:var(--ink-soft);line-height:1.4}
.act-item .tx b{color:var(--ink)}
.act-item .tm{font-size:11px;color:var(--faint);margin-top:2px}

.rail-block{margin-bottom:18px}

/* placeholder */
.ph{display:grid;place-items:center;min-height:60vh;text-align:center}
.ph .box{max-width:420px}
.ph .big{width:64px;height:64px;border-radius:16px;background:var(--teal-wash);color:var(--teal);display:grid;place-items:center;margin:0 auto 18px}
.ph h2{font-size:20px;margin:0 0 8px}
.ph p{color:var(--muted);margin:0}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);font-size:13px;font-weight:500;padding:11px 20px;border-radius:10px;box-shadow:var(--shadow-l);z-index:40;display:flex;align-items:center;gap:9px}
.toast .cbadge{color:#fff}
:root[data-theme="dark"] .toast,:root:not([data-theme="light"]) .toast{background:#e8edeb;color:#0c1514}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:#e8edeb;color:#0c1514}}

.themeBtn{background:none;border:none;color:var(--ink-soft)}
@media (max-width:1080px){ .tiles{grid-template-columns:repeat(2,1fr)} .cols{grid-template-columns:1fr} }
/* home dashboard — small screens */
@media (max-width:560px){
  .tiles{gap:10px;margin-bottom:16px}
  .tile{padding:13px 13px}
  .tile .v{font-size:25px;margin-top:6px}
  .cols{gap:14px}
}
@media (max-width:360px){ .tiles{grid-template-columns:1fr} }
/* ---------- responsive shell ---------- */
/* small desktop / large tablet: narrower sidebar, tighter header */
@media (max-width:1080px){
  .body{grid-template-columns:200px 1fr}
  .appheader{padding:0 16px}
  .crumb{display:none}
}
/* tablet & below: sidebar becomes an off-canvas drawer */
@media (max-width:900px){
  .body{grid-template-columns:1fr}
  .hamburger{display:inline-flex}
  .sidebar{position:fixed;top:58px;left:0;width:270px;max-width:82vw;height:calc(100vh - 58px);transform:translateX(-100%);transition:transform .22s ease;z-index:55;box-shadow:var(--shadow-l)}
  .sidebar.open{transform:none}
  .nav-backdrop{display:block;position:fixed;inset:58px 0 0 0;background:rgba(20,20,20,.44);z-index:50;border:none}
  .apptitle{display:none}
}
/* landscape phone: condense header identity + role chip */
@media (max-width:680px){
  .wordmark{display:none}
  .hdiv{display:none}
  .demoTag{display:none}
  .roleSel .who{display:none}
  .roleSel{padding:4px 8px 4px 5px}
  .hdr-right{gap:7px}
  .content{padding:18px 15px 52px}
  .pagehead h1{font-size:20px}
  .pagehead p{font-size:13px}
}
/* phone: shrink header controls, full-width drawer feel */
/* phase forms */
.calcbox{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-top:14px}
.calccell{background:var(--panel);padding:11px 13px}
.calccell .ck{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.calccell .cv{font-size:16px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.calccell.good .cv{color:var(--green)} .calccell.bad .cv{color:var(--red)}
.decrow{display:flex;flex-direction:column;gap:8px}
.decopt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.decopt:hover{background:var(--panel)}
.decopt.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);background:var(--teal-wash)}
.decopt input{accent-color:var(--teal);margin-top:2px;width:15px;height:15px;flex:none}
.decopt .dl{font-size:13.5px;font-weight:600;color:var(--ink)}
.decopt .dd{font-size:12px;color:var(--muted);margin-top:2px}
.formmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.roform{background:var(--amber-wash);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);padding:11px 14px;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px}
.pickrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--border2);cursor:pointer}
.pickrow:first-child{border-top:none}
.pickrow:hover{background:var(--panel)}
.pickrow .pk{flex:1}
.pickrow .pt{font-size:13px;font-weight:600}
.pickrow .ps{font-size:11.5px;color:var(--muted);margin-top:2px}

/* project timeline — approval chain + decision history */
.tl{display:flex;flex-direction:column}
.tl-item{display:grid;grid-template-columns:26px 1fr;gap:12px;position:relative;padding-bottom:14px}
.tl-item:last-child{padding-bottom:0}
.tl-line{position:absolute;left:12.5px;top:26px;bottom:0;width:1.5px;background:var(--border)}
.tl-item.ok .tl-line{background:var(--green)}
.tl-item.no .tl-line{background:var(--red)}
.tl-dot{width:26px;height:26px;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--border);background:var(--panel);color:var(--muted);z-index:1}
.tl-item.ok .tl-dot{background:var(--green);border-color:var(--green);color:#fff}
.tl-item.no .tl-dot{background:var(--red);border-color:var(--red);color:#fff}
.tl-item.wait .tl-dot{background:var(--amber);border-color:var(--amber);color:#fff}
.tl-item.info .tl-dot{background:var(--blue);border-color:var(--blue);color:#fff}
.tl-item.now .tl-dot{background:var(--surface);border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 3px var(--teal-wash)}
.tl-item.next{opacity:.55}
.tl-card{min-width:0;border:1px solid var(--border2);background:var(--surface);padding:11px 13px}
.tl-item.now .tl-card{border-color:var(--teal)}
.tl-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.tl-act{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.25}
.tl-fid{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.tl-when{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
.tl-who{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);margin-top:7px;flex-wrap:wrap}
.tl-av{width:20px;height:20px;background:var(--panel2);color:var(--ink-soft);display:grid;place-items:center;font-size:9px;font-weight:700;flex:none}
.tl-role{color:var(--muted)}
.tl-role.amb{color:var(--amber);font-weight:600}
.tl-quote{margin-top:9px;padding:8px 11px;background:var(--panel);border-left:2px solid var(--border2);font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.tl-item.ok .tl-quote{border-left-color:var(--green)}
.tl-item.no .tl-quote{border-left-color:var(--red)}
.tl-item.now .tl-quote{border-left-color:var(--teal)}
.tl-toggle{background:none;border:none;color:var(--teal);font-family:inherit;font-size:11.5px;font-weight:600;padding:9px 0 0;cursor:pointer;text-align:left}
.tl-toggle:hover{text-decoration:underline}
.tl-fields{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin-top:8px;padding:10px 12px;background:var(--panel);font-size:12.5px}
.tl-fields .tk{color:var(--muted);font-weight:600}
.tl-fields .tv{color:var(--ink);word-break:break-word}
.tl-actions{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap}
.tl-empty{font-size:12.5px;color:var(--muted);padding:20px;text-align:center;line-height:1.5}
.tl-case{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:16px}
.tl-case>div{background:var(--panel);padding:10px 12px}
.tl-case .ck{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.tl-case .cv{font-size:14px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;color:var(--ink)}
.tl-case .cv.good{color:var(--green)} .tl-case .cv.bad{color:var(--red)}
@media (max-width:560px){
  .tl-item{grid-template-columns:22px 1fr;gap:9px}
  .tl-dot{width:22px;height:22px;font-size:10px}
  .tl-line{left:10.5px;top:22px}
  .tl-when{margin-left:0;flex-basis:100%}
  .tl-fields{grid-template-columns:1fr;gap:1px}
  .tl-fields .tk{margin-top:8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
  .tl-fields .tk:first-child{margin-top:0}
}
@media (max-width:720px){ .calcbox{grid-template-columns:1fr 1fr} }
@media (max-width:460px){
  .appheader{padding:0 10px;gap:6px}
  .hicon{width:34px;height:34px}
  .hamburger{width:34px;height:34px}
  .content{padding:14px 12px 48px}
  .toast{left:12px;right:12px;transform:none;justify-content:center}
}

/* the chain as the flows run it: F-02c routing, then F-02d Sourcing Head,
   F-02e Business Head, F-02f Finance Head. No Controllership gate. */
const APPROVAL_CHAIN=["SRC_HEAD","BU_HEAD","FIN_HEAD"];
const GATE_ROLES={Capex:APPROVAL_CHAIN,Opex:APPROVAL_CHAIN,
  SQE:["SQE_ENG","SQE_HEAD"],Engineering:["ENG","ENG_LEAD"],Trial:["PROD_ENG","MFG_HEAD"],

/* a gate is yours if your role is named on it - the phase engineer decides
   F-07/F-08/F-09, the heads decide the money gates, CFT signs off PSW */
/* CFT membership is configuration: Admin > Roles is the source of truth and
   the registry is only the seed, so changing a signatory needs no code. */
function isCFT(roleId,db){
  const cfg=db&&db.admin&&db.admin.roles;
  if(cfg){const row=cfg.find(r=>r.code===roleId); if(row) return row.cft==="Yes";}
  return !!(ROLE[roleId]||{}).cft;
}
function approvalsFor(roleId,rows,db){
  return rows.filter(a=>{
    /* A derived approval names its own owners - it was built from the status machine, which
       knows exactly who decides that status. GATE_ROLES stays for the seeded rows, where the
       coarse type is all there is. */
    if(a.cft) return isCFT(roleId,db);
    if(a.roles) return a.roles.indexOf(roleId)>=0;
    const r=GATE_ROLES[a.type]||[];
    if(r.indexOf("__CFT__")>=0) return isCFT(roleId,db);
    return r.indexOf(roleId)>=0;});
}

/* ---------------------------------------------------------------- group tracks

const isTrackForm=(f)=>TRACK_FORMS.indexOf(f)>=0;
/* A project that predates grouping, or whose intake named none, runs a single track. One
   group is the ordinary case with n=1, not a special path through the code. */
const groupsOf=(p)=>{const g=((p&&p.groups)||[]).filter(Boolean);return g.length?g:["All parts"];};
/* Derived rather than required: a row seeded straight into the sampling stretch gets its
   tracks the first time anything asks, each at the status the project is already sitting at. */
const tracksOf=(p)=>{
  if(p&&p.tracks&&p.tracks.length) return p.tracks;
  if(!p||!isTrackStatus(p.status)) return [];
  return groupsOf(p).map(g=>({g:g,status:p.status,phase:p.phase||"Sample Qual",form:{},
    rejectionCount:p.rejectionCount||0,engRejectionCount:p.engRejectionCount||0}));
};
/* Once every group is through, the tracks stop driving anything: the project is whole again
   and one "start pilot lot" task is correct, not one per group. */
const liveTracks=(p)=>{const t=tracksOf(p);return t.some(x=>x.status!=="FAIR Released")?t:[];};
/* The tracks that still owe someone a decision. A group already at FAIR Released is waiting
   for its siblings, not for a person, so it raises no task and no approval. */
const openTracks=(p)=>liveTracks(p).filter(t=>t.status!=="FAIR Released");
const trackRank=(st)=>{const i=TRACK_ORDER.indexOf(st);return i<0?TRACK_ORDER.length:i;};
const rollUp=(tracks)=>tracks.reduce((a,t)=>trackRank(t.status)<trackRank(a.status)?t:a,tracks[0]);
const trackOf=(p,g)=>tracksOf(p).find(t=>t.g===g)||null;
/* What the group is actually about - the parts intake put in it. Projects seeded before
   grouping have no group on their parts, so the single track owns all of them. */
const partsInGroup=(parts,pid,g)=>(parts||[]).filter(x=>x.pid===pid&&(!g||!x.group||x.group===g));
/* Writing a track means recomputing what the project says about itself: status and phase are
   the slowest group's, always, so nothing downstream has to know tracks exist. */
const applyTracks=(p,tracks)=>{
  const lead=rollUp(tracks);
  return {...p,tracks:tracks,status:lead.status,phase:lead.phase||p.phase};
};

const GATE_ACTS=["Decide","Validate","Review","Run trial","Sign"];
function approvalsFromProjects(rows){
  const out=[];
  (rows||[]).forEach((p,i)=>{
    /* Once the tracks have split, an approval belongs to a group, not to the project: three
       groups sitting at SQE validation are three separate decisions for three separate sets
       of parts. */
    const tr=openTracks(p);
    const units=tr.length?tr.map(t=>({status:t.status,g:t.g})):[{status:p.status,g:null}];
    units.forEach((u,ui)=>{
    const defs=STATUS_TASKS[u.status]; if(!defs) return;
    (Array.isArray(defs)?defs:[defs]).forEach((rule,j0)=>{
      const j=ui*10+j0;
      if(GATE_ACTS.indexOf(rule.act)<0) return;
      /* Where the status is one of the four chain gates, carry the step: the decision then
         goes through decideGate, which validates the move and posts the command, rather than
         only writing a local audit line. */
      const step=APPROVAL_STEPS.find(x=>x.at===u.status)||null;
      /* Once the member has recommended, the item belongs to the approver - otherwise it sits
         in the member's inbox with nothing left for them to do. */
      const rec=(p.recommendation&&step&&p.recommendation.form===step.id)?p.recommendation:null;
      const roles=(rec&&step.approver)?[step.approver]:(rule.roles||null);
      out.push({id:"AP-"+p.id+"-"+j, pid:p.id, part:u.g||"\u2014", group:u.g,
        gate:(rec?(rule.title+" \u2014 approve recommendation"):rule.title)+(u.g?" \u00b7 "+u.g:""),
        type:rule.phase, roles:roles, cft:!!rule.cft, step:step,
        by:p.owner||"\u2014",
        amount:p.totalInvestment!=null?money(p.totalInvestment):"\u2014",
        h:6+((i*17)%136)});
    });
    });
  });
  return out;
}
const inRole=(list,id)=>list.indexOf(id)>=0;
function tasksFor(roleId,db){
  const out=[];
  db.projects.forEach((p,i)=>{
    /* A group is the unit of work from F-07 on, so SQE with three groups to inspect sees
       three items - one per group, each naming the parts it covers. */
    const tr=openTracks(p);
    const units=tr.length?tr.map(t=>({status:t.status,g:t.g})):[{status:p.status,g:null}];
    units.forEach(u=>{
      const defs=STATUS_TASKS[u.status]; if(!defs) return;
      (Array.isArray(defs)?defs:[defs]).forEach(rule=>{
        const mine=rule.cft ? isCFT(roleId,db) : inRole(rule.roles||[],roleId);
        if(!mine) return;
        const np=u.g?partsInGroup(db.parts,p.id,u.g).length:0;
        out.push({pid:p.id,group:u.g,title:rule.title+(u.g?" \u00b7 "+u.g:""),
          phase:rule.phase,act:rule.act,form:rule.form,h:6+((i*17)%136),
          meta:[p.title+" · "+plantLine(p),u.g?(u.g+" \u00b7 "+np+" part(s)"):(p.supplier!=="\u2014"?p.supplier:"")]});
      });
    });
  });
  if(inRole(["PLANNER","PLAN_LEAD"],roleId))
    db.pilots.filter(x=>x.iqc==="Pending").forEach(x=>out.push({pid:x.pid,title:"Confirm delivery + IQC ("+x.lot+")",phase:"Pilot",act:"Open",h:x.h,meta:[lotPart(x),"PR "+x.pr]}));
  if(inRole(["BUYER","BUYER_LEAD"],roleId))
    db.pilots.filter(x=>x.delivery==="—").forEach(x=>out.push({pid:x.pid,title:"Raise PR - "+x.lot+" (F-11/12/13)",phase:"Pilot",act:"Raise PR",h:x.h,meta:[lotPart(x),"Qty "+x.qty]}));
  if(roleId==="SQE_HEAD")
    db.pilots.filter(x=>x.iqc==="Not OK").forEach(x=>out.push({pid:x.pid,title:"IQC disposition - "+x.lot,phase:"Pilot",act:"Open",h:x.h,meta:[lotPart(x),"Accept / Return / Rework"]}));
  if(inRole(["FIN_ANALYST"],roleId))
    db.approvals.filter(x=>x.type==="Capex"||x.type==="Opex").forEach(x=>out.push({pid:x.pid,title:"Cost validation - "+x.type+" (F-03)",phase:"Approval",act:"Open",h:x.h,meta:["Part "+x.part,x.amount]}));
  return out;
}
function scopeProjects(roleId,rows,me){
  const sc=permOf(roleId).scope;
  if(sc==="capex") return rows.filter(p=>p.status.indexOf("Capex")>=0);
  if(sc==="own") return rows.filter(p=>p.owner===me);
  return rows; /* "all", "plant" and "assigned" all resolve to the Pune data set today */
}
/* ---------- phase form specs ----------
   One declarative spec per form; PhaseForm renders them and the status machine
   applies the decision. Field ids match the adaptive cards in the flows. */
/* FORM_SPECS' computed/summary functions are pure and have no access to app state, so the
   rate table is mirrored here and refreshed whenever db.rates changes. One writer, in the
   provider - nothing else assigns to it. */
let FX_RATES=[];
const setFxRates=r=>{FX_RATES=r||[];};
const fxRateFor=code=>FX_RATES.find(r=>(r.code||"").toUpperCase()===String(code||"").toUpperCase());
/* Legacy amounts carry no currency of their own. They were captured against Pune quotes, so
   INR is the assumption - stated here once rather than defaulted silently at ten call sites. */
const DEFAULT_QUOTE_CCY="INR";
/* F-02's quote totals, in USD, each row converted on its own currency so a quote mixing INR
   and EUR still totals correctly. The one implementation: the on-screen summary, the project
   record and the figure sent to Teams cards all read it, so they cannot disagree. */
function f02Totals(v){
  let spend=null,nspend=null,qty=null;
  quoteToRows(v&&v.partsPricing).forEach(r=>{
    const q=parseFloat(r[2]), a=usdOf(r[3],r[4]), b=usdOf(r[5],r[6]);
    if(isFinite(q)&&a!=null&&b!=null){ spend=(spend||0)+q*a; nspend=(nspend||0)+q*b; qty=(qty||0)+q; }
  });
  return {spend:spend,nspend:nspend,qty:qty,save:(spend!=null&&nspend!=null)?spend-nspend:null};
}
/* The other direction, for the backend's INR columns: the plant reads rupees, and the card
   formats them in lakhs. Null when there is no INR rate, rather than a rupee figure that is
   really dollars. */
const inrOfUsd=(usd)=>{
  const r=fxRateFor("INR"), f=r&&parseFloat(r.fx);
  return (usd!=null&&isFinite(usd)&&f&&f>0)?Math.round(usd/f):null;
};
const usdOf=(amount,code)=>{
  const a=parseFloat(amount);
  if(amount==null||amount===""||!isFinite(a)) return null;
  const r=fxRateFor(code||DEFAULT_QUOTE_CCY);
  const f=r&&parseFloat(r.fx);
  return (f&&f>0)?a*f:null;
};
/* Money, always in USD. A missing rate returns the marker rather than the unconverted figure:
   showing a rupee amount under a dollar sign is worse than showing nothing. */
/* Payback: the investment divided by what it saves in a year, in years. The two figures
   only have to be in the same currency - the ratio is unit-free - but they must not be mixed,
   which is why each caller converts before it asks. Nothing to show when there is no saving:
   an investment that saves nothing is never paid back, and "0.0 Yr" would read as instant. */
const paybackYears=(invest,save)=>
  (invest!=null&&save!=null&&isFinite(invest)&&isFinite(save)&&save>0&&invest>0)?invest/save:null;
const paybackLabel=(invest,save)=>{
  const y=paybackYears(invest,save);
  return y==null?"—":(y<0.1?"under 0.1 Yr":y.toFixed(1)+" Yr");
};

function money(n,code){
  const v=usdOf(n,code);
  if(v==null) return "—";
  return "$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
const num=x=>(x===""||x==null||isNaN(+x))?null:+x;
const personFor=roleId=>(ROLE[roleId]||{}).person||"";
const ov=(val,roleId)=>String(val||"").trim()||personFor(roleId);

/* The Buyer's step is a continuation of the Planner's, not a fresh sheet: it opens on the
   rows the Planner submitted. Three places hold them - this session's form store, the last
   command's fields on a project read back from SharePoint, and the array F-04 left on the
   project row - because a Teams-era project may have any one of them and none of the others. */
const prSeed=(p)=>{
  if(!p) return "";
  const stored=(p.form&&p.form["F-04"]&&p.form["F-04"].sapLines)||(p.hubForm||{}).sapLines||"";
  if(String(stored).trim()) return String(stored);
  const arr=p.sapLines;
  return (Array.isArray(arr)&&arr.length)
    ? rowsToSap(arr.map(x=>[x.part||"",x.desc||"",x.pr||"",x.trun==null?"":String(x.trun),x.po||""]))
    : "";
};

/* the approval chain, in the order the flows actually run it:
   F-02d Sourcing Head -> F-02e Business Head -> F-02c Finance routing -> F-02f Finance Head.
   Any reject returns the project to Sourcing for revision. */
const APPROVAL_STEPS=[
  {id:"F-02d",label:"Sourcing Head approval",role:"SRC_HEAD",who:"sourcingHead",at:"Sourcing Head Approval Pending",ok:()=>"Business Head Approval Pending"},
  {id:"F-02e",label:"Business Head approval",role:"BU_HEAD",who:"buHead",at:"Business Head Approval Pending",ok:()=>"Finance Head Approval Pending"},
  /* The funding decision belongs to the Finance Head, who now takes it at the same moment as
     the approval - one gate, not an analyst's classification waiting on a head to confirm it.
     `route` is what makes the approval ask Capex or Opex. */
  {id:"F-02f",label:"Finance Head approval",role:"FIN_HEAD",who:"financeHead",at:"Finance Head Approval Pending",route:true,ok:()=>"Finance Routing Decision Pending"},
  /* What is left for the Finance team is bookkeeping, not a decision: the account coding the
     Buyer raises the PR against. It still gates the move into approval, because a PR cannot
     be raised without it. */
  {id:"F-02c",label:"Finance account coding",role:"FIN_ANALYST",who:"financeAnalyst",at:"Finance Routing Decision Pending",ok:p=>(projRoute(p)==="Opex"?"Approval Pending - Opex":"Approval Pending - Capex"),form:"F-02c",formOnly:true},
];
/* The chain used to be the four F-02 gates only, so everything after approval - sampling,
   engineering, trial, PSW - had no chain representation at all. The full chain adds the
   recommend-then-decide gates and the PSW sign-off, built from GATE_LEADER and FORM_SPECS
   rather than retyped, so it cannot describe different gates from the ones that run.

   Lazily, not at module scope: GATE_LEADER and FORM_SPECS are declared further down the
   file and a const evaluated at load would hit their temporal dead zone. */
let _fullChain=null;
function fullChain(){
  if(_fullChain) return _fullChain;
  const base=APPROVAL_STEPS.map(x=>({...x, ats:[x.at]}));
  const extra=[];
  Object.keys(GATE_LEADER).forEach(fid=>{
    const spec=FORM_SPECS[fid]; if(!spec) return;
    const froms=spec.from||[];
    const at=froms[0]; if(!at) return;
    const task=STATUS_TASKS[at];
    const rule=Array.isArray(task)?task[0]:task;
    extra.push({id:fid, label:spec.name, form:fid, at:at, ats:froms,
                role:(rule&&rule.roles&&rule.roles[0])||GATE_LEADER[fid],
                approver:GATE_LEADER[fid], who:""});
  });
  /* PSW is a sign-off by the cross-functional team rather than one named head, so it has no
     single approver - but it is still a gate the project has to pass. */
  const psw=FORM_SPECS["F-10"];
  if(psw&&(psw.from||[]).length){
    const rule=STATUS_TASKS[psw.from[0]];
    const r=Array.isArray(rule)?rule[0]:rule;
    extra.push({id:"F-10", label:psw.name, form:"F-10", at:psw.from[0], ats:psw.from,
                role:(r&&r.roles&&r.roles[0])||"SRC_MEMBER", cft:true, who:""});
  }
  const order=["F-07","F-08","F-09","F-10"];
  extra.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  _fullChain=base.concat(extra);
  return _fullChain;
}
const CHAIN_AT=APPROVAL_STEPS.map(x=>x.at);
const POST_CHAIN=["Approval Pending - Capex","Approval Pending - Opex","Development Approved","Opex - PR Pending","PO Pending","In Development","Sample Under Inspection","SQE Conditional","PSW Pending Sign-off","Pilot Lots In Progress","All Lots Delivered","Project Completed"];
/* -1 before the chain, -2 returned, n inside it, length when past it */
/* -2 returned, the gate's index when the project sits on one, -1 otherwise. Deliberately
   no inference about how far along a project between gates is: the chain reports what was
   decided, not what it guesses must have been. */
const chainPos=p=>{
  if(p.status==="Returned to Sourcing")return -2;
  return fullChain().findIndex(s=>s.ats.indexOf(p.status)>=0);
};

/* pilot lots: three sequential lots, each PR -> delivery + IQC -> disposition if NOK.
   Lot n+1 opens only when lot n closes OK; lot 3 closing OK ends the pilot phase. */
const LOT_FORMS={1:"F-11",2:"F-12",3:"F-13"};
const lotNum=x=>parseInt(String(x.lot||"").replace(/[^0-9]/g,""),10)||1;
const lotState=x=>!x.pr?"Awaiting PR":x.delivery==="\u2014"?"Ordered":x.iqc==="Pending"?"Delivered":x.iqc==="Not OK"?"Quarantine":"Closed";
const lotPill=st=>st==="Closed"?"p-green":st==="Quarantine"?"p-red":st==="Awaiting PR"?"p-gray":"p-amber";

/* status machine - only these moves are legal, mirroring what the flows write */
const TRANSITIONS={
  "Feasibility Review":["Sourcing Head Approval Pending","Held","Dropped"],
  "Held":["Feasibility Review","Sourcing Head Approval Pending","Dropped"],
  "Returned to Sourcing":["Sourcing Head Approval Pending","Held","Dropped"],
  /* No gate currently rejects INTO this status - the chain returns to "Returned to
     Sourcing" instead - so it is only reachable on seeded/legacy rows. It still needs
     an entry here: canTransition treats a missing key as "any move is legal", so
     without this a project parked here could jump to any status at all. Same exits as
     a return to sourcing. Whether the process still uses this status, or whether it
     was superseded by "Returned to Sourcing", is a question for the plant. */
  "Rejected - Approval":["Sourcing Head Approval Pending","Held","Dropped"],
  "Sourcing Head Approval Pending":["Business Head Approval Pending","Returned to Sourcing","Held"],
  "Business Head Approval Pending":["Finance Head Approval Pending","Returned to Sourcing"],
  "Finance Head Approval Pending":["Finance Routing Decision Pending","Returned to Sourcing"],
  "Finance Routing Decision Pending":["Approval Pending - Capex","Approval Pending - Opex","Returned to Sourcing"],
  "Approval Pending - Capex":["Development Approved","Returned to Sourcing"],
  "Approval Pending - Opex":["Opex - PR Pending","Returned to Sourcing"],
  "Development Approved":["PO Creation Pending"],
  "PO Creation Pending":["PO Pending"],
  "Opex - PR Pending":["Opex - PO Pending"],
  "Opex - PO Pending":["PO Pending"],
  "PO Pending":["In Development","Held"],
  "In Development":["Sample Under Inspection","Held"],
  "Sample Rejected":["Re-sample Requested","Dropped"],
  "Re-sample Requested":["Sample Under Inspection","Sample Rejected","Dropped"],
  "Sample Under Inspection":["SQE Approved","SQE Conditional","Sample Rejected"],
  "SQE Approved":["Engineering Approved","Sample Rejected","SQE Approved"],
  "SQE Conditional":["Engineering Approved","Sample Rejected","SQE Approved"],
  "Production Rejected":["Engineering Approved","Sample Rejected","SQE Approved"],
  "Engineering Approved":["PSW Pending Sign-off","Trial Repeat Required","Production Rejected"],
  "PSW Pending Sign-off":["PSW Sign-off Pending","Held"],
  "PSW Sign-off Pending":["FAIR Released","PSW Rejected"],
  "PSW Rejected":["PSW Pending Sign-off","Dropped"],
  "FAIR Released":["Pilot Lots In Progress"],
  "Pilot Lots In Progress":["All Lots Delivered","Pilot Lots Failed - Hold"],
  /* Declared as a legal target above but nothing writes it yet. It still needs a key:
     without one the app treats every move from here as legal while the router treats
     none of them as legal, so a project that ever lands here is either unguarded or
     stuck, depending on which engine you ask. Exits confirmed against the live N22
     resolver, which offers exactly Restart (-> back into the pilot cycle) and Abort
     (-> Dropped, terminal). No longer provisional. */
  "Pilot Lots Failed - Hold":["Pilot Lots In Progress","Dropped"],
  "All Lots Delivered":["Project Completed","All Lots Delivered"],
  "Trial Repeat Required":["PSW Pending Sign-off","Trial Repeat Required","Production Rejected"],
};
const canTransition=(from,to)=>from===to||!TRANSITIONS[from]||TRANSITIONS[from].indexOf(to)>=0;
const formsFor=roleId=>Object.keys(FORM_SPECS).filter(k=>hasCap(roleId,FORM_SPECS[k].cap));
const eligibleProjects=(spec,rows)=>rows.filter(p=>spec.from.indexOf(p.status)>=0);
/* STATUS_TASKS names the form for a status explicitly; scanning FORM_SPECS.from is
   only the fallback. Without that precedence a status listed by two specs resolves to
   whichever was declared first: "Opex - PO Pending" is claimed by both F-04 and
   F-04o-PO, so the board offered F-04 (needs pr.create) instead of F-04o-PO (needs
   po.confirm) - handing Sourcing a form the capability guard then refuses. */
const formForStatus=st=>{
  const t=STATUS_TASKS[st], defs=Array.isArray(t)?t:(t?[t]:[]);
  const named=defs.find(d=>d.form&&FORM_SPECS[d.form]);
  if(named) return FORM_SPECS[named.form];
  const k=Object.keys(FORM_SPECS).find(k=>FORM_SPECS[k].from.indexOf(st)>=0);
  return k?FORM_SPECS[k]:null;
};

function DataTable({columns, rows, pageSize, onAct, onRowClick}){
  const toggleable=columns.filter(c=>!c.always);
  const [visible,setVisible]=useState(()=>columns.filter(c=>!c.always&&!c.hidden).map(c=>c.key));
  const [showCols,setShowCols]=useState(false);
  const [showFilters,setShowFilters]=useState(false);
  const [fvals,setFvals]=useState({});
  const [q,setQ]=useState("");
  const [sort,setSort]=useState({key:null,dir:"asc"});
  const [ps,setPs]=useState(pageSize||10);
  const [page,setPage]=useState(0);
  const valOf=(c,row)=>c.val?c.val(row):row[c.key];
  const setF=(k,v)=>{setFvals(o=>({...o,[k]:v}));setPage(0);};
  const visCols=columns.filter(c=>c.always||visible.includes(c.key));

  let data=rows.filter(row=>{
    if(q){const hay=columns.map(c=>c.filterType?valOf(c,row):"").join(" ").toLowerCase(); if(!hay.includes(q.toLowerCase()))return false;}
    for(const c of columns){
      const fv=fvals[c.key]; if(fv==null||fv===""||fv==="All"||fv==="Any")continue;
      if(c.filterTest){if(!c.filterTest(row,fv))return false;}
      else if(c.filterType==="select"){if(String(valOf(c,row))!==String(fv))return false;}
      else if(c.filterType==="text"){if(!String(valOf(c,row)).toLowerCase().includes(String(fv).toLowerCase()))return false;}
    }
    return true;
  });
  if(sort.key){const col=columns.find(c=>c.key===sort.key); if(col){data=[...data].sort((a,b)=>{const av=col.sortVal?col.sortVal(a):valOf(col,a),bv=col.sortVal?col.sortVal(b):valOf(col,b); return (av<bv?-1:av>bv?1:0)*(sort.dir==="asc"?1:-1);});}}
  const total=data.length, pages=Math.max(1,Math.ceil(total/ps)), cur=Math.min(page,pages-1);
  const slice=data.slice(cur*ps,cur*ps+ps);
  const toggleSort=k=>{const col=columns.find(c=>c.key===k); if(col&&col.sortable===false)return; setSort(s=>s.key===k?{key:k,dir:s.dir==="asc"?"desc":"asc"}:{key:k,dir:"asc"});};
  const toggleCol=k=>setVisible(v=>v.includes(k)?v.filter(x=>x!==k):v.concat(k));

  return <div className="mdg">
    <div className="mdg-toolbar">
      <button className="mdg-tbtn" onClick={()=>{setShowCols(s=>!s);setShowFilters(false);}}><Icon n="columns" cls=""/>Columns</button>
      <button className={"mdg-tbtn"+(showFilters?" on":"")} onClick={()=>{setShowFilters(s=>!s);setShowCols(false);}}><Icon n="filter" cls=""/>Filters</button>
      <div className="mdg-quick"><Icon n="search" cls=""/><input placeholder="Search…" value={q} onChange={e=>{setQ(e.target.value);setPage(0);}}/></div>
    </div>
    {showCols? <div className="colpanel">
      <div className="cp-h">Show columns</div>
      {toggleable.map(c=><label key={c.key}><input type="checkbox" checked={visible.includes(c.key)} onChange={()=>toggleCol(c.key)}/>{c.label||c.key}</label>)}
    </div>:null}
    <div className="mdg-wrap">
      <table className="mdg-table">
        <thead>
          <tr>{visCols.map(c=><th key={c.key} className={c.sortable===false?"":"sortable"} onClick={()=>toggleSort(c.key)} style={c.w?{width:c.w}:null}>
            {c.label}{c.sortable===false?null:<span className={"arr "+(sort.key===c.key?"":"dim")}>{sort.key===c.key?(sort.dir==="asc"?"▲":"▼"):"▲"}</span>}</th>)}</tr>
          {showFilters? <tr className="filter-row">{visCols.map(c=><th key={c.key}>
            {!c.filterType?null: c.filterType==="select"
              ? <select value={fvals[c.key]||c.options[0]} onChange={e=>setF(c.key,e.target.value)}>{c.options.map(o=><option key={o} value={o}>{o}</option>)}</select>
              : <input placeholder="Filter" value={fvals[c.key]||""} onChange={e=>setF(c.key,e.target.value)}/>}
          </th>)}</tr>:null}
        </thead>
        <tbody>
          {slice.length? slice.map((row,i)=><tr key={i} className={onRowClick?"mdg-click":""} onClick={onRowClick?()=>onRowClick(row):undefined}>{visCols.map(c=><td key={c.key} data-label={c.label||""}>{c.render(row,onAct)}</td>)}</tr>)
            : <tr><td colSpan={visCols.length} className="mdg-empty">No matching rows.</td></tr>}
        </tbody>
      </table>
    </div>
    <div className="mdg-footer">
      <div className="mdg-rpp">Rows per page:<select value={ps} onChange={e=>{setPs(+e.target.value);setPage(0);}}>{[10,20,50].map(n=><option key={n} value={n}>{n}</option>)}</select></div>
      <div className="mdg-range">{total?cur*ps+1:0}–{Math.min(cur*ps+ps,total)} of {total}</div>
      <div className="mdg-arrows"><button disabled={cur===0} onClick={()=>setPage(cur-1)}>‹</button><button disabled={cur>=pages-1} onClick={()=>setPage(cur+1)}>›</button></div>
    </div>
  </div>;
}

   drag a part between columns - but nothing moved them when the PROJECT moved. A project at
   FAIR Released still listed every part as "Feasibility Review", which is the first thing
   anyone opening the Parts tab reads. `group` empty means the whole project: every move
   before the tracks split, and every move after they re-converge. */

    return {...x,status:status,...(stage?{stage:stage}:{})};

};

/* What Sourcing quoted, per part. The localized price lives in the F-02 quote and nowhere
   else - NPIParts carries the volume and the existing cost, but has no column for the new
   one - so a project read back from SharePoint after some later command shows it as not
   quoted yet rather than inventing a figure. */
const quotedPrices=(p)=>{
  const tsv=(p&&p.form&&p.form["F-02"]&&p.form["F-02"].partsPricing)||(p&&p.hubForm||{}).partsPricing||"";
  const by={};
  quoteToRows(tsv).forEach(r=>{ if(r[0]) by[String(r[0]).trim().toUpperCase()]=r; });
  return by;
};

/* A part's own economics, in dollars: what it costs today, what it will cost, and what the
   difference is worth over a year. Null unless both prices AND the volume are known - a
   saving computed from a missing price is a made-up number, and this one is read as money. */
const partEconomics=(x,quoted)=>{
  const q=quoted[String((x&&x.part)||"").trim().toUpperCase()];
  const ex=usdOf(x&&x.cost,x&&x.currency), nw=q?usdOf(q[5],q[6]):null, vol=num(x&&x.vol);
  return {ex:ex,nw:nw,vol:vol,save:(ex!=null&&nw!=null&&vol!=null)?(ex-nw)*vol:null};
};

     quoted in euros can be read against each other in the same column. */
  const econ=(x)=>partEconomics(x,quoted);

  const openPart=(x)=>onOpen?onOpen(x.part):openModal(<InfoModal title={x.part} onClose={closeModal} pairs={[["Description",x.desc],["Annual quantity",x.vol==null?"—":String(x.vol)],["Existing price",money(usdOf(x.cost,x.currency),"USD")]]}/>);
  const cols=[
    {key:"part",label:"Part number",w:"150px",filterType:"text",val:x=>x.part,render:x=><span className="tpid">{x.part}</span>},
    {key:"desc",label:"Description",filterType:"text",val:x=>x.desc,render:x=><span className="tcell">{x.desc}</span>},
    /* The project has one vendor, so a supplier per part repeated the same name down every

    {key:"vol",label:"Annual quantity",w:"122px",sortVal:x=>num(x.vol)||0,filterType:"text",

    {key:"unit",label:"Existing price (USD)",w:"150px",sortVal:x=>usdOf(x.cost,x.currency)||0,filterType:"text",
     val:x=>{const u=usdOf(x.cost,x.currency);return u==null?"":u.toFixed(2);},
     render:x=>{const u=usdOf(x.cost,x.currency);
       return u==null?<span className="tmeta">—</span>:<span>{money(u,"USD")}</span>;}},
    {key:"newunit",label:"New price (USD)",w:"140px",sortVal:x=>newPrice(x)||0,filterType:"text",
     val:x=>{const u=newPrice(x);return u==null?"":u.toFixed(2);},

    /* (existing - new) x annual quantity. Negative where the localisation costs more, which
       is worth seeing rather than hiding. */
    {key:"save",label:"Annual saving (USD)",w:"156px",sortVal:x=>econ(x).save||0,filterType:"text",
     val:x=>{const v=econ(x).save;return v==null?"":v.toFixed(2);},
     render:x=>{const v=econ(x).save;

    {key:"stage",label:"Stage",w:"128px",filterType:"select",options:["All"].concat(STAGES),val:x=>x.stage,render:x=><span className="mchip">{x.stage}</span>},
    {key:"status",label:"Status",w:"186px",filterType:"text",val:x=>statusLabel(x.status),render:x=><span className={"pill "+statusClass(x.status)}>{statusLabel(x.status)}</span>},
    {key:"h",label:"SLA",w:"104px",sortVal:x=>x.h,filterType:"select",options:["Any","Breaching","Due soon","On track"],filterTest:(x,v)=>v==="Breaching"?x.h<=12:v==="Due soon"?(x.h>12&&x.h<24):v==="On track"?x.h>=24:true,render:x=><span className={"sla "+slaColor(x.h)}>{slaLabel(x.h)}</span>},
    {key:"act",label:"",w:"84px",always:true,sortable:false,render:(x)=><button className="btn primary sm" onClick={e=>{e.stopPropagation();openPart(x);}}>Open</button>},
