<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>NPI Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#202020; --ink-soft:#3A3A3A; --muted:#707070; --faint:#909090;
  --teal:#E1261C; --teal-d:#A81610; --teal-l:#C21B12; --teal-wash:#FBEAE8;
  --red:#C4281C; --red-wash:#FBEAE8;
  --gold:#D9A63C;
  --amber:#B4740E; --amber-wash:#FBF1DF;
  --green:#1E7E45; --green-wash:#E4F2EA;
  --blue:#215E9E; --blue-wash:#E6EEF6;
  --ground:#F4F4F4; --surface:#FFFFFF; --panel:#F7F7F7; --panel2:#EFEFEF;
  --border:#E2E2E2; --border2:#ECECEC;
  --sidebar:#0E1C1B; --sidebar-2:#152826; --sidebar-tx:#B7C6C2; --sidebar-tx2:#7C8F8A;
  --shadow:none;
  --shadow-l:0 2px 10px rgba(16,40,38,.16);
  --sans:"Honeywell Sans","Inter","Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E8EDEB; --ink-soft:#C4CFCB; --muted:#94A29E; --faint:#6F7E7A;
  --teal:#F0645B; --teal-l:#F27A72; --teal-wash:#3A1F1D;
  --red:#F08B80; --red-wash:#3A211E; --amber:#E0A94A; --amber-wash:#33280F;
  --green:#5FC888; --green-wash:#12301E; --blue:#7FB0DE; --blue-wash:#142634;
  --ground:#0C1514; --surface:#141F1D; --panel:#111A19; --panel2:#0F1817;
  --border:#26332F; --border2:#1E2A28;
  --sidebar:#0A1413; --sidebar-2:#111F1D;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.3);
  --shadow-l:0 6px 22px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --ink:#E8EDEB; --ink-soft:#C4CFCB; --muted:#94A29E; --faint:#6F7E7A;
  --teal:#F0645B; --teal-l:#F27A72; --teal-wash:#3A1F1D;
  --red:#F08B80; --red-wash:#3A211E; --amber:#E0A94A; --amber-wash:#33280F;
  --green:#5FC888; --green-wash:#12301E; --blue:#7FB0DE; --blue-wash:#142634;
  --ground:#0C1514; --surface:#141F1D; --panel:#111A19; --panel2:#0F1817;
  --border:#26332F; --border2:#1E2A28;
  --sidebar:#0A1413; --sidebar-2:#111F1D;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.3);
  --shadow-l:0 6px 22px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
*,*::before,*::after{border-radius:0 !important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
#root{min-height:100vh}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

/* shell */
.shell{display:flex;flex-direction:column;min-height:100vh}
.appheader{display:flex;align-items:center;height:58px;background:var(--surface);border-bottom:1px solid var(--border);color:var(--ink);position:sticky;top:0;z-index:10;padding:0 20px}
.brandwrap{display:flex;align-items:center;gap:11px;min-width:0}
.wordmark{font-weight:700;font-size:19px;color:var(--teal);letter-spacing:-.4px}
.hdiv{width:1px;height:22px;background:var(--border);margin:0 6px;flex:none}
.apptitle{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap}
.crumb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.hicon{width:36px;height:36px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:grid;place-items:center;position:relative;font-size:15px}
.hicon:hover{background:var(--panel);color:var(--ink)}
.hicon .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;background:var(--teal);border:1.5px solid var(--surface)}
.hamburger{display:none;width:38px;height:38px;flex:none;align-items:center;justify-content:center;background:none;border:1px solid var(--border);color:var(--ink);cursor:pointer;padding:0}
.hamburger svg{width:20px;height:20px}
.nav-backdrop{display:none}
.demoTag{font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--teal);background:var(--teal-wash);padding:3px 7px;text-transform:uppercase}
.roleSel{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--border);padding:4px 10px 4px 5px}
.roleSel .av{width:28px;height:28px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11.5px}
.roleSel .who{line-height:1.12;color:var(--ink)}
.roleSel .who b{font-size:12.5px}
.roleSel .who span{font-size:10.5px;color:var(--muted)}
.roleSel select{border:none;background:none;font-family:inherit;font-size:12px;color:var(--ink);font-weight:600;outline:none;cursor:pointer}
.roleSel select option{color:var(--ink)}

.body{display:grid;grid-template-columns:224px 1fr;flex:1;min-height:0}
.sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:58px;height:calc(100vh - 58px)}
.sb-nav{padding:14px 12px;overflow-y:auto;flex:1}
.sb-sec{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);padding:14px 10px 6px;font-weight:700}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;color:var(--ink-soft);padding:9px 11px;border-radius:8px;font-size:13px;font-weight:500;text-align:left;transition:background .12s,color .12s}
.sb-item svg{width:17px;height:17px;flex:none;opacity:.9}
.sb-item:hover{background:var(--teal-wash);color:var(--teal)}
.sb-item.active{background:var(--teal);color:#fff}
.sb-badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--red);color:#fff;border-radius:20px;padding:1px 7px;min-width:18px;text-align:center}
.sb-item.active .sb-badge{background:rgba(255,255,255,.28)}
.sb-foot{padding:12px 16px;border-top:1px solid var(--border);font-size:10.5px;color:var(--faint)}
.appfooter{background:var(--panel);border-top:1px solid var(--border);color:var(--muted);font-size:11.5px;text-align:center;padding:11px 20px}
.appfooter u{color:var(--teal);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--teal) 40%,transparent)}
.main{display:contents}

/* content */
.content{padding:24px 26px 60px;overflow-y:auto;min-width:0}
.pagehead{margin-bottom:20px}
.pagehead h1{font-size:23px;margin:0 0 3px;letter-spacing:-.3px;font-weight:600}
.pagehead p{margin:0;color:var(--muted);font-size:14px}
.pagehead .hi{color:var(--teal)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .k{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.tile .k .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.tile .v{font-size:30px;font-weight:700;margin-top:8px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:1px}
.tile.warn .v{color:var(--red)}
.ic-teal{background:var(--teal-wash);color:var(--teal)}
.ic-amber{background:var(--amber-wash);color:var(--amber)}
.ic-red{background:var(--red-wash);color:var(--red)}
.ic-green{background:var(--green-wash);color:var(--green)}
.ic-blue{background:var(--blue-wash);color:var(--blue)}

.cols{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.block{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.block-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border2)}
.block-h h2{font-size:14px;margin:0;display:flex;align-items:center;gap:9px;font-weight:600}
.block-h .cnt{font-size:11px;color:var(--muted);font-weight:600;background:var(--panel2);padding:2px 8px;border-radius:20px}
.block-h .link{font-size:12px;color:var(--teal);font-weight:600;background:none;border:none}

/* task rows */
.task{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid var(--border2)}
.task:last-child{border-bottom:none}
.task:hover{background:var(--panel)}
.task .stripe{width:3px;align-self:stretch;border-radius:3px;flex:none}
.task .body{flex:1;min-width:0}
.task .t1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.task .pid{font-family:var(--mono);font-size:11.5px;color:var(--teal);font-weight:600}
.task .ttl{font-size:13.5px;font-weight:600}
.task .t2{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.task .act{flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.p-teal{background:var(--teal-wash);color:var(--teal)} .p-red{background:var(--red-wash);color:var(--red)}
.p-amber{background:var(--amber-wash);color:var(--amber)} .p-green{background:var(--green-wash);color:var(--green)}
.p-blue{background:var(--blue-wash);color:var(--blue)} .p-gray{background:var(--panel2);color:var(--muted)}
.sla{font-family:var(--mono);font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.sla.g{color:var(--green)} .sla.a{color:var(--amber)} .sla.r{color:var(--red)}
.btn{font-size:12.5px;font-weight:600;border-radius:8px;padding:7px 14px;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft)}
.btn:hover{background:var(--panel)}
.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.primary:hover{background:var(--teal-l)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
.btn.no{background:var(--surface);color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--border))}

/* data table */
.dt{background:var(--surface)}
.dt-tools{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border2);flex-wrap:wrap}
.dt-search{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--panel);padding:7px 10px;color:var(--muted);min-width:180px;flex:1}
.dt-search input{border:none;background:none;outline:none;font-family:inherit;font-size:13px;color:var(--ink);width:100%}
.dt-filter{font-family:inherit;font-size:12.5px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--border);padding:7px 9px;font-weight:500;cursor:pointer}
.dt-count{font-size:11.5px;color:var(--muted);margin-left:auto;font-weight:600;white-space:nowrap}
.dt-wrap{overflow-x:auto}
.dt-table{width:100%;border-collapse:collapse;font-size:13px}
.dt-table th{text-align:left;padding:9px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);background:var(--panel);white-space:nowrap}
.dt-table th.sortable{cursor:pointer;user-select:none}
.dt-table th.sortable:hover{color:var(--teal)}
.dt-table th .arr{margin-left:5px;font-size:9px}
.dt-table th .arr.dim{opacity:.32}
.dt-table td{padding:9px 12px;border-bottom:1px solid var(--border2);vertical-align:middle}
.dt-table tbody tr:hover{background:var(--panel)}
.dt-empty{text-align:center;color:var(--muted);padding:26px}
.tpid{font-family:var(--mono);font-size:11.5px;color:var(--teal);font-weight:600;white-space:nowrap}
.tcell{font-weight:500}
.tmeta{color:var(--muted);font-size:12px}
.dt-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--border2);font-size:12px;color:var(--muted);flex-wrap:wrap}
.dt-pager{display:flex;align-items:center;gap:10px}
.dt-page{font-size:12px;color:var(--ink-soft);font-weight:600}
.btn[disabled]{opacity:.45;cursor:default}

/* material data grid */
.mdg{background:var(--surface);position:relative}
.mdg-toolbar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border2)}
.mdg-tbtn{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--teal);font-family:inherit;font-size:12px;font-weight:500;letter-spacing:.4px;padding:7px 10px;text-transform:uppercase}
.mdg-tbtn:hover,.mdg-tbtn.on{background:var(--teal-wash)}
.mdg-tbtn svg{width:16px;height:16px}
.mdg-quick{margin-left:auto;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding:6px 4px;min-width:180px}
.mdg-quick input{border:none;background:none;outline:none;font-family:inherit;font-size:13px;color:var(--ink);width:100%}
.mdg-quick svg{width:16px;height:16px;color:var(--muted);flex:none}
.colpanel{position:absolute;z-index:15;top:46px;left:8px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-l);padding:8px 6px;min-width:200px}
.colpanel .cp-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:4px 10px 8px}
.colpanel label{display:flex;align-items:center;gap:10px;padding:7px 10px;font-size:13px;cursor:pointer}
.colpanel label:hover{background:var(--panel)}
.colpanel input{accent-color:var(--teal);width:15px;height:15px}
.mdg-wrap{overflow-x:auto}
.mdg-table{width:100%;border-collapse:collapse;font-size:13px}
.mdg-table th{text-align:left;padding:11px 12px;font-size:12.5px;color:var(--ink-soft);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
.mdg-table th.sortable{cursor:pointer;user-select:none}
.mdg-table th.sortable:hover{color:var(--teal)}
.mdg-table th .arr{margin-left:6px;font-size:10px;color:var(--teal)}
.mdg-table th .arr.dim{opacity:0}
.mdg-table th.sortable:hover .arr.dim{opacity:.4}
.filter-row th{padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border2)}
.filter-row input,.filter-row select{width:100%;font-family:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);outline:none}
.filter-row input:focus,.filter-row select:focus{border-color:var(--teal)}
.mdg-table td{padding:11px 12px;border-bottom:1px solid var(--border2);vertical-align:middle;color:var(--ink)}
.mdg-table tbody tr:hover{background:var(--panel)}
.mdg-empty{text-align:center;color:var(--muted);padding:28px}
.mchip{display:inline-block;font-size:11px;padding:3px 9px;border:1px solid var(--border);color:var(--ink-soft);background:var(--panel)}
.mdg-footer{display:flex;align-items:center;justify-content:flex-end;gap:26px;padding:6px 14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.mdg-rpp{display:flex;align-items:center;gap:8px}
.mdg-rpp select{font-family:inherit;font-size:12.5px;border:none;background:none;color:var(--ink);font-weight:500;outline:none;cursor:pointer}
.mdg-arrows{display:flex;align-items:center;gap:2px}
.mdg-arrows button{width:32px;height:32px;border:none;background:none;color:var(--ink-soft);font-size:20px;line-height:1;cursor:pointer}
.mdg-arrows button:hover:not([disabled]){background:var(--panel);color:var(--teal)}
.mdg-arrows button[disabled]{opacity:.32;cursor:default}
.mdg-click{cursor:pointer}
/* datatable responsive */
@media (max-width:680px){
  .mdg-toolbar{flex-wrap:wrap}
  .mdg-quick{margin-left:0;order:3;flex:1 1 100%;min-width:0;margin-top:2px}
  .mdg-footer{flex-wrap:wrap;gap:12px 18px;justify-content:space-between}
  .colpanel{left:8px;right:8px;min-width:0}
}
@media (max-width:560px){
  .mdg-wrap{overflow-x:visible}
  .mdg-table,.mdg-table tbody,.mdg-table tr,.mdg-table td{display:block;width:auto}
  .mdg-table thead{display:none}
  .mdg-table tr{border:1px solid var(--border);margin:10px;background:var(--surface)}
  .mdg-table tbody tr:hover{background:var(--surface)}
  .mdg-table td{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 12px;border:none;border-bottom:1px solid var(--border2);text-align:right}
  .mdg-table td:last-child{border-bottom:none}
  .mdg-table td::before{content:attr(data-label);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;text-align:left;flex:0 0 38%;white-space:nowrap}
  .mdg-table td[data-label=""]{justify-content:flex-end}
  .mdg-table td[data-label=""]::before{display:none}
  .mdg-table td.mdg-empty{justify-content:center;text-align:center;padding:22px}
  .mdg-table td.mdg-empty::before{content:none}
}
.backlink{background:none;border:none;color:var(--teal);font-family:inherit;font-size:13px;font-weight:600;padding:2px 0;margin-bottom:8px;cursor:pointer}
.backlink:hover{text-decoration:underline}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.dcard{background:var(--surface);border:1px solid var(--border);padding:12px 14px;box-shadow:var(--shadow)}
.dcard .dk{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.dcard .dv{font-size:14px;font-weight:500;margin-top:6px;color:var(--ink)}
@media (max-width:1080px){ .detail-grid{grid-template-columns:1fr 1fr} }

/* ppap request form */
.ppap-grid{display:grid;grid-template-columns:196px 1fr 282px;gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.panel-pad{padding:16px}
.eyebrow2{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;margin-bottom:12px}
.step{display:flex;gap:11px;padding-bottom:16px;position:relative}
.step:last-child{padding-bottom:0}
.step .sdot{width:26px;height:26px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--border);color:var(--muted);background:var(--panel);z-index:1}
.step.done .sdot{background:var(--teal);color:#fff;border-color:var(--teal)}
.step.current .sdot{border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 3px var(--teal-wash)}
.step .sline{position:absolute;left:12.5px;top:26px;bottom:0;width:1.5px;background:var(--border)}
.step.done .sline{background:var(--teal)}
.step .sl{font-size:13px;font-weight:500;line-height:1.2}
.step.current .sl{color:var(--teal);font-weight:600}
.step .ss{font-size:11px;color:var(--muted);margin-top:2px}
.step .ss.amber{color:var(--amber);font-weight:600}
.step.skip{opacity:.5}
.rtag{font-size:9px;text-transform:uppercase;letter-spacing:.3px;font-weight:700;padding:2px 7px;align-self:flex-start}
.rtag.conditional{background:var(--amber-wash);color:var(--amber)}
.rtag.skipped{background:var(--panel2);color:var(--faint)}
.formhead{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;padding:15px 18px;border-bottom:1px solid var(--border2)}
.formhead h2{font-size:17px;margin:0;font-weight:600}
.formhead .rid{font-size:12px;color:var(--muted)}
.formbody{padding:18px}
.catrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 14px;background:var(--panel);border:1px solid var(--border2);margin-bottom:18px}
.radio2{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.radio2 input{accent-color:var(--teal);width:15px;height:15px}
.flabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.flabel i{color:var(--red);font-style:normal}
.fsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--teal);font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--border2);margin:22px 0 14px}
.fsec-row{display:flex;justify-content:space-between;align-items:center}
.fsec .inv{display:inline-flex;gap:12px;align-items:center}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.imp-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}

function DataTable({columns, rows, pageSize, onAct, onRowClick}){
  const toggleable=columns.filter(c=>!c.always);
  const [visible,setVisible]=useState(()=>columns.filter(c=>!c.always&&!c.hidden).map(c=>c.key));
  const [showCols,setShowCols]=useState(false);
  const [showFilters,setShowFilters]=useState(false);
  const [fvals,setFvals]=useState({});
  const [q,setQ]=useState("");
  const [sort,setSort]=useState({key:null,dir:"asc"});
  const [ps,setPs]=useState(pageSize||10);
  const [page,setPage]=useState(0);
  const valOf=(c,row)=>c.val?c.val(row):row[c.key];
  const setF=(k,v)=>{setFvals(o=>({...o,[k]:v}));setPage(0);};
  const visCols=columns.filter(c=>c.always||visible.includes(c.key));

  let data=rows.filter(row=>{
    if(q){const hay=columns.map(c=>c.filterType?valOf(c,row):"").join(" ").toLowerCase(); if(!hay.includes(q.toLowerCase()))return false;}
    for(const c of columns){
      const fv=fvals[c.key]; if(fv==null||fv===""||fv==="All"||fv==="Any")continue;
      if(c.filterTest){if(!c.filterTest(row,fv))return false;}
      else if(c.filterType==="select"){if(String(valOf(c,row))!==String(fv))return false;}
      else if(c.filterType==="text"){if(!String(valOf(c,row)).toLowerCase().includes(String(fv).toLowerCase()))return false;}
    }
    return true;
  });
  if(sort.key){const col=columns.find(c=>c.key===sort.key); if(col){data=[...data].sort((a,b)=>{const av=col.sortVal?col.sortVal(a):valOf(col,a),bv=col.sortVal?col.sortVal(b):valOf(col,b); return (av<bv?-1:av>bv?1:0)*(sort.dir==="asc"?1:-1);});}}
  const total=data.length, pages=Math.max(1,Math.ceil(total/ps)), cur=Math.min(page,pages-1);
  const slice=data.slice(cur*ps,cur*ps+ps);
  const toggleSort=k=>{const col=columns.find(c=>c.key===k); if(col&&col.sortable===false)return; setSort(s=>s.key===k?{key:k,dir:s.dir==="asc"?"desc":"asc"}:{key:k,dir:"asc"});};
  const toggleCol=k=>setVisible(v=>v.includes(k)?v.filter(x=>x!==k):v.concat(k));

  return <div className="mdg">
    <div className="mdg-toolbar">
      <button className="mdg-tbtn" onClick={()=>{setShowCols(s=>!s);setShowFilters(false);}}><Icon n="columns" cls=""/>Columns</button>
      <button className={"mdg-tbtn"+(showFilters?" on":"")} onClick={()=>{setShowFilters(s=>!s);setShowCols(false);}}><Icon n="filter" cls=""/>Filters</button>
      <div className="mdg-quick"><Icon n="search" cls=""/><input placeholder="Search…" value={q} onChange={e=>{setQ(e.target.value);setPage(0);}}/></div>
    </div>
    {showCols? <div className="colpanel">
      <div className="cp-h">Show columns</div>
      {toggleable.map(c=><label key={c.key}><input type="checkbox" checked={visible.includes(c.key)} onChange={()=>toggleCol(c.key)}/>{c.label||c.key}</label>)}
    </div>:null}
    <div className="mdg-wrap">
      <table className="mdg-table">
        <thead>
          <tr>{visCols.map(c=><th key={c.key} className={c.sortable===false?"":"sortable"} onClick={()=>toggleSort(c.key)} style={c.w?{width:c.w}:null}>
            {c.label}{c.sortable===false?null:<span className={"arr "+(sort.key===c.key?"":"dim")}>{sort.key===c.key?(sort.dir==="asc"?"▲":"▼"):"▲"}</span>}</th>)}</tr>
          {showFilters? <tr className="filter-row">{visCols.map(c=><th key={c.key}>
            {!c.filterType?null: c.filterType==="select"
              ? <select value={fvals[c.key]||c.options[0]} onChange={e=>setF(c.key,e.target.value)}>{c.options.map(o=><option key={o} value={o}>{o}</option>)}</select>
              : <input placeholder="Filter" value={fvals[c.key]||""} onChange={e=>setF(c.key,e.target.value)}/>}
          </th>)}</tr>:null}
        </thead>
        <tbody>
          {slice.length? slice.map((row,i)=><tr key={i} className={onRowClick?"mdg-click":""} onClick={onRowClick?()=>onRowClick(row):undefined}>{visCols.map(c=><td key={c.key} data-label={c.label||""}>{c.render(row,onAct)}</td>)}</tr>)
            : <tr><td colSpan={visCols.length} className="mdg-empty">No matching rows.</td></tr>}
        </tbody>
      </table>
    </div>
    <div className="mdg-footer">
      <div className="mdg-rpp">Rows per page:<select value={ps} onChange={e=>{setPs(+e.target.value);setPage(0);}}>{[10,20,50].map(n=><option key={n} value={n}>{n}</option>)}</select></div>
      <div className="mdg-range">{total?cur*ps+1:0}–{Math.min(cur*ps+ps,total)} of {total}</div>
      <div className="mdg-arrows"><button disabled={cur===0} onClick={()=>setPage(cur-1)}>‹</button><button disabled={cur>=pages-1} onClick={()=>setPage(cur+1)}>›</button></div>
    </div>
  </div>;
}

/* ---------- new request (NPI intake stepper) ---------- */
const WIZ_STEPS=["Project","4-Blocker","Parts & Groups","Review"];
const NPI_CATS=["New Product Development","Localization","Resourcing","ECN Driven","Cost Reduction"];
const NPI_SITES=["Pune","Bangalore","Chennai","Mumbai"];
const NPI_COMMOD=["Mechanical","Electronic","Plastic","Metal","Composite","Other"];
const SAMPLE_PARTS_TSV="PartNumber\tPartDescription\tCommodity\tVendorCode\tIncumbentSupplier\tNewSupplier\tEstimatedAnnualVolume\tEstimatedUnitCost\n"+
"AL-CP-001\tAluminum cooling plate top\tAluminum Casting\tACME001\tAcme Precision Industries\tBharat MetalWorks Pune\t12000\t42\n"+
"AL-CP-002\tAluminum cooling plate bottom\tAluminum Casting\tACME002\tAcme Precision Industries\t\t12000\t38\n"+
"RB-GS-001\tEPDM rubber gasket 220x180x3mm\tRubber Sealing\tSEALCO\tSealco Rubber Industries\t\t12000\t8.5\n"+
"SS-BL-001\tStainless steel bolt M6x20\tHardware\t1234567\tBolt Group Pune\t\t48000\t2.1\n"+
"PL-LB-001\tPE label sticker 50x30mm\tLabels\tLABEL01\tLabelTech Industries\tLabelMaster Mumbai\t12000\t0.5\n"+
"CU-WR-001\tCopper wire harness 12-gauge\tWiring\tCUWIRE1\tHarnessCorp Chennai\t\t24000\t15.75\n"+
"PB-FL-001\tPolymer foam insulation block\tFoam Inserts\tFOAMP01\tPolyFoam Bengaluru\t\t12000\t3.25";
function Intake(){
  const {act,flash,go}=useApp();
  const [step,setStep]=useState(0);
  const [proj,setProj]=useState({title:"Aluminium cooling assembly localization",category:"Localization",site:"Pune",ecn:"",scope:"Localize the aluminium cooling plate assembly and associated hardware to India-based suppliers to reduce landed cost and lead time."});
  const [fb,setFb]=useState({q:"Maintain Cpk ≥ 1.33 on critical dims; PPAP Level 3.",c:"Target 18% landed-cost reduction vs incumbent.",d:"Mass production ready by Q4 2026.",r:"New-supplier ramp risk; dual-source critical parts."});
  const [groups,setGroups]=useState(["Aluminium castings","Hardware & seals"]);
  const [newGroup,setNewGroup]=useState("");
  const blankDraft={part:"",desc:"",commodity:"Mechanical",vendor:"",vendorEmail:"",vol:"",cost:"",mpd:"",group:"Aluminium castings"};
  const [draft,setDraft]=useState(blankDraft);
  const [parts,setParts]=useState([
    {part:"AL-CP-001",desc:"Aluminum cooling plate top",commodity:"Metal",vendor:"Bharat MetalWorks Pune",vendorEmail:"rfq@bharatmetal.in",vol:"12000",cost:"42",mpd:"2026-12-31",group:"Aluminium castings"},
    {part:"AL-CP-002",desc:"Aluminum cooling plate bottom",commodity:"Metal",vendor:"Bharat MetalWorks Pune",vendorEmail:"",vol:"12000",cost:"38",mpd:"2026-12-31",group:"Aluminium castings"},
    {part:"SS-BL-001",desc:"Stainless steel bolt M6x20",commodity:"Metal",vendor:"Bolt Group Pune",vendorEmail:"",vol:"48000",cost:"2.1",mpd:"2026-12-31",group:"Hardware & seals"},
  ]);
  const [importOpen,setImportOpen]=useState(false);
  const [impText,setImpText]=useState("");
  const [impGroup,setImpGroup]=useState("__commodity");
  const [submitted,setSubmitted]=useState(false);
  const [createdId,setCreatedId]=useState(null);
  const setP=k=>e=>setProj(o=>({...o,[k]:e.target.value}));
  const setF=k=>e=>setFb(o=>({...o,[k]:e.target.value}));
  const setD=k=>e=>setDraft(o=>({...o,[k]:e.target.value}));
  const addGroup=()=>{const g=newGroup.trim(); if(!g)return; if(groups.includes(g)){flash("Group already exists");return;} setGroups(a=>a.concat([g])); setDraft(d=>({...d,group:g})); setNewGroup("");};
  const rmGroup=(g)=>{ if(parts.some(p=>p.group===g)){flash("Group has parts — remove them first");return;} setGroups(a=>{const n=a.filter(x=>x!==g); setDraft(d=>d.group===g?{...d,group:n[0]||""}:d); return n;}); };
  const addPart=()=>{
    if(!draft.part.trim()||!draft.desc.trim()){flash("Part number and description are required.");return;}
    const g=draft.group||groups[0]||"Group 1";
    if(!groups.includes(g)) setGroups(a=>a.concat([g]));
    setParts(a=>a.concat([{...draft,group:g}]));
    setDraft(d=>({...blankDraft,commodity:d.commodity,vendorEmail:d.vendorEmail,group:d.group}));
    flash("Part added. Total: "+(parts.length+1));
  };
  const rmPart=(i)=>setParts(a=>a.filter((p,j)=>j!==i));
  const clearParts=()=>{setParts([]);flash("All parts cleared");};
  const parseRows=(text)=>{
    const lines=text.split(/\r?\n/).map(l=>l.replace(/\s+$/,"")).filter(l=>l.trim());
    const out=[];
    lines.forEach((ln,idx)=>{
      const sep=ln.indexOf("\t")>=0?"\t":",";
      const c=ln.split(sep).map(x=>x.trim());
      if(idx===0 && /part\s*number|partnumber/i.test(c[0])) return;
      if(c.length>=8) out.push({part:c[0],desc:c[1],commodity:c[2],vendor:c[5]||c[4]||"",vendorEmail:"",vol:c[6]||"",cost:c[7]||""});
      else if(c.length>=6) out.push({part:c[0],desc:c[1],commodity:c[2],vendor:c[3]||"",vendorEmail:"",vol:c[4]||"",cost:c[5]||""});
      else if(c.length>=2) out.push({part:c[0],desc:c[1],commodity:"Other",vendor:"",vendorEmail:"",vol:"",cost:""});
    });
    return out;
  };
  const doImport=()=>{
    const rows=parseRows(impText);
    if(!rows.length){flash("Nothing to import — paste rows or load the sample file.");return;}
    let gs=[...groups];
    const mapped=rows.map(r=>{
      let g = impGroup==="__commodity" ? (r.commodity||"Other") : impGroup==="__vendor" ? (r.vendor||"Unassigned") : impGroup;
      if(!gs.includes(g)) gs.push(g);
      return {...r,mpd:"2026-12-31",group:g};
    });
    setGroups(gs); setParts(a=>a.concat(mapped)); setImportOpen(false); setImpText("");
    flash("Imported "+mapped.length+" part(s) into "+(impGroup==="__commodity"?"commodity groups":impGroup==="__vendor"?"vendor groups":"\""+impGroup+"\""));
  };
  const usedGroups=Array.from(new Set(parts.map(p=>p.group)));
  const allGroups=groups.concat(usedGroups.filter(g=>!groups.includes(g)));
  const grpCount=(g)=>parts.filter(p=>p.group===g).length;
  const readyToSubmit=parts.length>0&&proj.title.trim()&&proj.category&&proj.site&&proj.scope.trim();
  const validStep=()=>{
    if(step===0) return proj.title.trim()&&proj.category&&proj.site&&proj.scope.trim();
    if(step===2) return parts.length>0;
    return true;
  };
  const next=()=>{ if(!validStep()){flash("Complete the required fields on this step.");return;} setStep(s=>Math.min(s+1,3)); };
  const back=()=>setStep(s=>Math.max(s-1,0));
  const submit=()=>{
    if(!readyToSubmit){flash("Add at least one part and complete the required project fields.");return;}
    const firstMpd=(parts.find(p=>p.mpd&&p.mpd.trim())||{}).mpd||"—";
    const id=act.submitIntake({title:proj.title,category:proj.category,site:proj.site,ecn:proj.ecn,scope:proj.scope,fb,parts,groups:usedGroups.length,target:firstMpd});
    setCreatedId(id); setSubmitted(true);
  };
  if(submitted) return <>
    <div className="pagehead"><h1>Honeywell NPI Intake</h1><p>Multi-part project submission.</p></div>
    <div className="wiz"><div className="block"><div className="panel-pad">
      <div className="ready2 ok"><div className="rk2">NPI Project Created Successfully</div><div className="rv2">{createdId} created — {parts.length} part(s) across {usedGroups.length} group(s). Status: Feasibility Review.</div></div>
      <div className="modal-note" style={{marginTop:14}}>The Sourcing team has been notified. The project proceeds through Phase 1 Feasibility per group; each group runs the feasibility → approval → sampling flow together.</div>
      <div className="det-actions" style={{marginTop:14}}><button className="btn primary" onClick={()=>go("projects")}>Open in Projects</button><button className="btn" onClick={()=>go("phases")}>Go to Phase Workspaces</button><button className="btn" onClick={()=>{setSubmitted(false);setStep(0);}}>+ Submit Another NPI</button></div>
    </div></div></div>
  </>;
  return <>
    <div className="pagehead"><h1>Honeywell NPI Intake</h1><p>Multi-part project submission — project details, 4-Blocker, then add or bulk-import parts and organise them into groups that move through the workflow together.</p></div>
    <div className="wiz">
      <div className="wiz-steps">
        {WIZ_STEPS.map((s,i)=><React.Fragment key={i}>
          <div className={"wiz-step "+(i<step?"done":i===step?"current":"")} onClick={()=>{if(i<step)setStep(i);}}>
            <span className="wn">{i<step?"✓":i+1}</span><span className="wl">{s}</span>
          </div>
          {i<WIZ_STEPS.length-1?<span className={"wiz-line"+(i<step?" on":"")}/>:null}
        </React.Fragment>)}
      </div>
      <div className="block"><div className="panel-pad">
        {step===0?<div>
          <div className="fsec" style={{marginTop:0}}>Project information</div>
          <div className="fgrid2">
            <div className="field2 wcol2"><div className="flabel">Project title <i>*</i></div><input value={proj.title} onChange={setP("title")} placeholder="e.g. New Mounting Bracket NPI"/></div>
            <div className="field2"><div className="flabel">Project category <i>*</i></div><select value={proj.category} onChange={setP("category")}>{NPI_CATS.map(o=><option key={o}>{o}</option>)}</select></div>
            <div className="field2"><div className="flabel">Project site <i>*</i></div><select value={proj.site} onChange={setP("site")}>{NPI_SITES.map(o=><option key={o}>{o}</option>)}</select></div>
            <div className="field2"><div className="flabel">ECN number</div><input value={proj.ecn} onChange={setP("ecn")} placeholder="optional"/></div>
            <div className="field2"/>
            <div className="field2 wcol2"><div className="flabel">Project scope <i>*</i></div><textarea rows={3} value={proj.scope} onChange={setP("scope")} placeholder="Describe the scope of this NPI project..."/></div>
          </div>
        </div>:null}
        {step===1?<div>
          <div className="fsec" style={{marginTop:0}}>4-Blocker</div>
          <div className="fgrid2">
            <div className="field2"><div className="flabel">Quality</div><textarea rows={3} value={fb.q} onChange={setF("q")} placeholder="Key quality considerations..."/></div>
            <div className="field2"><div className="flabel">Cost</div><textarea rows={3} value={fb.c} onChange={setF("c")} placeholder="Cost considerations..."/></div>
            <div className="field2"><div className="flabel">Delivery</div><textarea rows={3} value={fb.d} onChange={setF("d")} placeholder="Delivery / timeline considerations..."/></div>
            <div className="field2"><div className="flabel">Risk</div><textarea rows={3} value={fb.r} onChange={setF("r")} placeholder="Risk factors..."/></div>
          </div>
        </div>:null}
        {step===2?<div>
          <div className="fsec fsec-row" style={{marginTop:0}}><span>Groups</span><span style={{textTransform:"none",fontWeight:400,letterSpacing:0,color:"var(--muted)",fontSize:11.5}}>Feasibility, approval &amp; sampling run once per group — not per part.</span></div>
          <div className="grp-bar">
            {allGroups.map(g=><span className="grp-chip" key={g}>{g} <b>{grpCount(g)}</b>{grpCount(g)===0?<span className="x" title="Remove group" onClick={()=>rmGroup(g)}>×</span>:null}</span>)}
            <span className="grp-add"><input value={newGroup} placeholder="New group name" onChange={e=>setNewGroup(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addGroup();}}/><button className="btn sm" onClick={addGroup}>+ Group</button></span>
          </div>
          <div className="fsec fsec-row"><span>Add part</span><button className="btn sm" onClick={()=>{setImpText("");setImportOpen(true);}}>Import Parts from Excel</button></div>
          <div className="fgrid2">
            <div className="field2"><div className="flabel">Part number <i>*</i></div><input value={draft.part} onChange={setD("part")}/></div>
            <div className="field2"><div className="flabel">Description <i>*</i></div><input value={draft.desc} onChange={setD("desc")}/></div>
            <div className="field2"><div className="flabel">Commodity</div><select value={draft.commodity} onChange={setD("commodity")}>{NPI_COMMOD.map(o=><option key={o}>{o}</option>)}</select></div>
            <div className="field2"><div className="flabel">Group</div><select value={draft.group} onChange={setD("group")}>{allGroups.map(o=><option key={o}>{o}</option>)}</select></div>
            <div className="field2"><div className="flabel">Target vendor</div><input value={draft.vendor} onChange={setD("vendor")}/></div>
            <div className="field2"><div className="flabel">Vendor email</div><input value={draft.vendorEmail} onChange={setD("vendorEmail")}/></div>
            <div className="field2"><div className="flabel">Est. annual volume</div><input inputMode="numeric" value={draft.vol} onChange={setD("vol")}/></div>
            <div className="field2"><div className="flabel">Est. unit cost</div><input inputMode="numeric" value={draft.cost} onChange={setD("cost")}/></div>
            <div className="field2"><div className="flabel">Target mass production date</div><input value={draft.mpd} onChange={setD("mpd")} placeholder="2026-12-31"/></div>
          </div>
          <div className="partbtns"><button className="btn primary" onClick={addPart}>+ Add Part</button><button className="btn no" onClick={clearParts} disabled={!parts.length}>Clear All Parts</button></div>
          <div className="fsec fsec-row"><span>Parts in this submission</span><span style={{textTransform:"none",fontWeight:400,letterSpacing:0,color:"var(--teal)",fontSize:12}}>{parts.length} {parts.length===1?"part":"parts"} loaded · {usedGroups.length} group(s)</span></div>
          {parts.length===0?<div className="emptyparts">No parts added yet. Fill the fields above and click <b>+ Add Part</b>, or import a batch from Excel.</div>:
            allGroups.filter(g=>grpCount(g)>0).map(g=><div className="pgroup" key={g}>
              <div className="pgroup-head">{g} <span className="cnt">· {grpCount(g)} part(s)</span><span className="note">runs the feasibility → approval → sampling flow as one group</span></div>
              {parts.map((pt,i)=>pt.group===g?<div className="pcard" key={i}>
                <span className="pn">{pt.part}</span>
                <span>{pt.desc}<div className="meta">Commodity: {pt.commodity||"—"}</div></span>
                <span className="meta">{pt.vendor||"—"}{pt.vol?" · Vol "+pt.vol:""}{pt.cost?" · ₹"+pt.cost:""}{pt.mpd?" · MPD "+pt.mpd:""}</span>
                <button className="btn no sm" onClick={()=>rmPart(i)}>Remove</button>
              </div>:null)}
            </div>)}
        </div>:null}
        {step===3?<div>

function ApprovalDetail({a,onBack}){

    const what=decision==="Approved"?"route it to the next gate":decision==="Rejected"?"return it to the requester":"reassign it to the role group";
    confirm({title:decision+" — "+a.pid,message:"Record "+decision.toLowerCase()+" for "+a.gate+"? This writes an audit entry and will "+what+".",confirmLabel:decision,tone:tone,onConfirm:()=>{act.resolveApproval(a,decision,comment);onBack();}});
  };
  return <>

/* ---------- reports ---------- */
function HBar({data}){
  const max=Math.max.apply(null,data.map(d=>d.v).concat([1]));
  return <div className="hbar">{data.map((d,i)=><div key={i} className="hbar-row">
    <div className="hbar-lbl">{d.label}</div>
    <div className="hbar-track"><div className="hbar-fill" style={{width:(d.v/max*100)+"%"}}/></div>
    <div className="hbar-val">{d.v}</div>
  </div>)}</div>;
}
function Donut({data}){
  const total=data.reduce((s,d)=>s+d.v,0)||1, R=54, C=2*Math.PI*R; let acc=0;
  return <div className="donut-wrap">
    <svg viewBox="0 0 140 140" width="140" height="140">
      <g transform="translate(70,70) rotate(-90)">
        <circle r={R} fill="none" stroke="var(--border2)" strokeWidth="16"/>
        {data.map((d,i)=>{const frac=d.v/total, dash=frac*C, off=acc*C; acc+=frac; return <circle key={i} r={R} fill="none" stroke={d.color} strokeWidth="16" strokeDasharray={dash+" "+(C-dash)} strokeDashoffset={-off}/>;})}
      </g>
      <text x="70" y="67" textAnchor="middle" fontSize="24" fontWeight="700" fill="var(--ink)">{total}</text>
      <text x="70" y="85" textAnchor="middle" fontSize="10" fill="var(--muted)">projects</text>
    </svg>
    <div className="donut-legend">{data.map((d,i)=><div key={i} className="dl"><span className="dlc" style={{background:d.color}}/>{d.label} <b>{d.v}</b></div>)}</div>
  </div>;
}
function VBars({data}){
  const max=Math.max.apply(null,data.map(d=>d.v).concat([1]));
  return <div className="vbars">{data.map((d,i)=><div key={i} className="vbar-col">
    <div className="vbar-num">{d.v}</div>
    <div className="vbar-track"><div className="vbar-fill" style={{height:(d.v/max*100)+"%"}}/></div>
    <div className="vbar-lbl">{d.label}</div>
  </div>)}</div>;
}

  {ts:"2026-09-08 14:28:07Z",actor:"Meera Iyer",role:"Engineering",action:"Engineering approved",entity:"NPI-2026-0116 / 1120-SHF-04",detail:"F-08",comment:"—"},

];
function Audit(){
  const {db,openModal,closeModal,flash}=useApp();
  const exportCsv=()=>{
    const head=["Timestamp","Actor","Role","Action","Entity","Detail","Comment"];
    const rows=db.audit.map(a=>[a.ts,a.actor,a.role,a.action,a.entity,a.detail,a.comment]);
    const csv=[head].concat(rows).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
    openModal(<Modal title="Export audit log (CSV)" onClose={closeModal} wide={true}>
      <div className="modal-note">Direct download is blocked in this demo sandbox — copy the CSV below, or in production this exports a file.</div>
      <textarea readOnly rows={12} style={{width:"100%",fontFamily:"var(--mono)",fontSize:11.5,border:"1px solid var(--border)",padding:10}} value={csv}/>
      <div className="modal-f"><button className="btn" onClick={closeModal}>Close</button><button className="btn primary" onClick={()=>{try{navigator.clipboard.writeText(csv);flash("Copied CSV to clipboard");}catch(e){flash("Copy from the box above");}}}>Copy to clipboard</button></div>
    </Modal>);
  };
  const cols=[
    {key:"ts",label:"Timestamp (UTC)",w:"162px",filterType:"text",val:x=>x.ts,render:x=><span className="mono" style={{fontSize:11.5,color:"var(--muted)"}}>{x.ts}</span>},
    {key:"actor",label:"Actor",w:"150px",filterType:"text",val:x=>x.actor,render:x=><span className="tcell">{x.actor}</span>},
    {key:"role",label:"Role",w:"140px",filterType:"select",options:["All","Sourcing","Buyer","Finance","BU Head","Controllership","SQE","Engineering","System"],val:x=>x.role,render:x=><span className="mchip">{x.role}</span>},
    {key:"action",label:"Action",filterType:"text",val:x=>x.action,render:x=><span>{x.action}</span>},
    {key:"entity",label:"Entity",w:"200px",filterType:"text",val:x=>x.entity,render:x=><span className="tpid">{x.entity}</span>},
    {key:"detail",label:"Detail",w:"170px",hidden:true,filterType:"text",val:x=>x.detail,render:x=><span className="tmeta">{x.detail}</span>},
    {key:"comment",label:"Comment",w:"180px",filterType:"text",val:x=>x.comment,render:x=><span className="tmeta">{x.comment}</span>},
  ];
  return <>
    <div className="pagehead"><h1>Audit trail</h1><p>Immutable, read-only record of every action — actor, role, UTC timestamp, before/after and comment. Exportable as CSV (admin only).</p></div>
    <div className="block">
      <div className="block-h"><h2><Icon n="audit" cls="" style={{width:16,height:16,color:"var(--teal)"}}/> Activity log <span className="cnt">{db.audit.length}</span></h2><button className="admin-add" onClick={exportCsv}>Export CSV</button></div>
      <DataTable columns={cols} rows={db.audit} pageSize={10}/>
    </div>
  </>;
}

/* ---------- store + modal infrastructure ---------- */
const AppCtx = React.createContext(null);
const useApp = () => useContext(AppCtx);
function stampNow(){const d=new Date(),p=x=>String(x).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())+"Z";}
function todayStr(){const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],d=new Date();return String(d.getDate()).padStart(2,"0")+" "+m[d.getMonth()]+" "+d.getFullYear();}
const SEED_NOTIFS=[
  {id:1,text:"PPAP request NPI-2026-0126 routed to you for approval",time:"9 min ago",read:false},
  {id:2,text:"SLA breach escalation raised on NPI-2026-0117",time:"2h ago",read:false},
  {id:3,text:"Sample NPI-2026-0122 awaiting SQE validation",time:"3h ago",read:false},
  {id:4,text:"Anita Desai approved Capex sign-off · NPI-2026-0119",time:"5h ago",read:true},
];

function Modal({title,onClose,children,wide}){
  return <div className="modal-back" onClick={onClose}>
    <div className={"modal"+(wide?" wide":"")} onClick={e=>e.stopPropagation()}>
      <div className="modal-h"><h3>{title}</h3><button className="modal-x" onClick={onClose}>×</button></div>
      <div className="modal-b">{children}</div>
    </div>
  </div>;
}
function FormModal({title,fields,initial,submitLabel,onSubmit,onClose}){
  const [v,setV]=useState(()=>{const o={};fields.forEach(f=>o[f.key]=(initial&&initial[f.key]!=null)?initial[f.key]:(f.def||(f.type==="select"?f.options[0]:"")));return o;});
  const [err,setErr]=useState("");
  const set=k=>e=>setV(s=>({...s,[k]:e.target.value}));
  const submit=()=>{const miss=fields.filter(f=>f.req&&!String(v[f.key]).trim());if(miss.length){setErr("Please complete: "+miss.map(f=>f.label).join(", "));return;}onSubmit(v);};
  return <Modal title={title} onClose={onClose}>
    <div className="form-grid">
      {fields.map(f=><div className={"field2"+(f.full?" full":"")} key={f.key}>
        <div className="flabel">{f.label} {f.req?<i>*</i>:null}</div>
        {f.type==="select"
          ? <select value={v[f.key]} onChange={set(f.key)}>{f.options.map(o=><option key={o} value={o}>{o}</option>)}</select>
          : f.type==="textarea"
          ? <textarea rows={3} value={v[f.key]} onChange={set(f.key)} placeholder={f.ph||""}/>
          : <input value={v[f.key]} onChange={set(f.key)} placeholder={f.ph||""}/>}
      </div>)}
    </div>
    {err?<div className="form-err">{err}</div>:null}
    <div className="modal-f"><button className="btn" onClick={onClose}>Cancel</button><button className="btn primary" onClick={submit}>{submitLabel||"Save"}</button></div>
  </Modal>;
}
function ConfirmDialog({opts,onClose}){
  return <Modal title={opts.title} onClose={onClose}>
    <p className="confirm-msg">{opts.message}</p>
    <div className="modal-f"><button className="btn" onClick={onClose}>Cancel</button>
      <button className={"btn "+(opts.tone==="danger"?"no":opts.tone==="ok"?"ok":"primary")} onClick={()=>{opts.onConfirm();onClose();}}>{opts.confirmLabel||"Confirm"}</button></div>
  </Modal>;
}
function NotifPanel({notifs,onReadAll}){
  return <div className="pop">
    <div className="pop-h"><b>Notifications</b><button onClick={onReadAll}>Mark all read</button></div>
    <div style={{maxHeight:320,overflowY:"auto"}}>
      {notifs.length?notifs.map(n=><div key={n.id} className={"notif"+(n.read?" read":"")}><span className="nd"/><div>{n.text}<div style={{color:"var(--faint)",fontSize:11,marginTop:2}}>{n.time}</div></div></div>):<div className="notif">No notifications.</div>}
    </div>
  </div>;
}

/* ---------- app ---------- */
function App(){
  const [page,setPage]=useState("home");
  const [roleKey,setRole]=useState("Sourcing");
  const [toast,setToast]=useState("");
  const flash=m=>{setToast(m);clearTimeout(window.__t);window.__t=setTimeout(()=>setToast(""),2800);};
  const [modal,setModal]=useState(null);
  const [confirmO,setConfirmO]=useState(null);
  const [notifOpen,setNotifOpen]=useState(false);
  const [userMenu,setUserMenu]=useState(false);
  const [navOpen,setNavOpen]=useState(false);
  const [db,setDb]=useState(()=>({
    projects:PROJECTS.map(p=>({...p})),
    approvals:APPROVALS.map(a=>({...a})),
    samples:SAMPLES.map((s,i)=>({...s,_i:i})),
    pilots:PILOTLOTS.map((p,i)=>({...p,_i:i})),
    suppliers:VENDORS_SUP.map(v=>({...v})),
    comms:VENDOR_COMMS.map((c,i)=>({...c,_i:i})),
    docs:DOCS.map(d=>({...d})),
    audit:AUDIT.map(a=>({...a})),
    admin:Object.keys(ADMIN_CFG).reduce((o,k)=>{o[k]=ADMIN_CFG[k].rows.map(x=>({...x}));return o;},{}),
    roleAppr:ROLE_KEYS.reduce((o,k)=>{o[k]=ROLES[k].approvals.map(a=>({...a}));return o;},{}),
    notifs:SEED_NOTIFS.map(n=>({...n})),
    seq:132,
  }));
  const r=ROLES[roleKey];
  const me=r.name;
  const withAudit=(d,entry)=>[{ts:stampNow(),actor:me,role:roleKey,detail:"—",comment:"—",...entry},...d.audit];
  const withNotif=(d,text)=>[{id:Date.now()+Math.random(),text,time:"just now",read:false},...d.notifs];
  const act={
    resolveApproval:(a,decision,comment)=>{setDb(d=>({...d,approvals:d.approvals.filter(x=>x.id!==a.id),audit:withAudit(d,{action:decision,entity:a.pid,detail:a.gate,comment:comment||"—"}),notifs:withNotif(d,decision+" — "+a.gate+" · "+a.pid)}));flash(decision+" — "+a.pid+" recorded");},
    resolveRoleAppr:(role,pid,decision)=>{setDb(d=>({...d,roleAppr:{...d.roleAppr,[role]:d.roleAppr[role].filter(x=>x.pid!==pid)},audit:withAudit(d,{action:decision,entity:pid,detail:"Home approval queue"})}));flash(decision+" — "+pid);},
    submitIntake:(p)=>{let id;setDb(d=>{const num=d.seq+1;id="NPI-2026-0"+num;const proj={id,title:p.title,phase:"Initiation",status:"Feasibility Review",plant:p.site,owner:me,supplier:(p.parts[0]&&p.parts[0].vendor)||"—",parts:String(p.parts.length),target:p.target||"—",updated:todayStr()};return {...d,seq:num,projects:[proj,...d.projects],audit:withAudit(d,{action:"NPI intake submitted",entity:id,detail:p.category+" · "+p.groups+" group(s) · "+p.parts.length+" part(s)",comment:p.title}),notifs:withNotif(d,"New NPI project "+id+" — Feasibility Review ("+p.groups+" group(s), "+p.parts.length+" part(s))")};});return id;},
    validateSample:(row,result,comment)=>{setDb(d=>({...d,samples:d.samples.map(s=>s._i===row._i?{...s,result,stage:result==="Approved"?"Trial":result==="Rejected"?"Re-sample":"Engineering"}:s),audit:withAudit(d,{action:"SQE sample "+result,entity:row.pid+" / "+row.part,detail:"F-07",comment:comment||"—"})}));flash("Sample "+row.part+" — "+result);},
    dispositionPilot:(row,disp)=>{setDb(d=>({...d,pilots:d.pilots.map(p=>p._i===row._i?{...p,iqc:disp==="Accept as-is"?"OK":p.iqc}:p),audit:withAudit(d,{action:"Pilot disposition: "+disp,entity:row.pid+" / "+row.part,detail:row.lot})}));flash(row.lot+" — "+disp);},
    markCommReplied:(row)=>{setDb(d=>({...d,comms:d.comms.map(c=>c._i===row._i?{...c,status:"Acknowledged"}:c),audit:withAudit(d,{action:"Vendor reply logged",entity:row.pid,detail:row.type})}));flash("Marked replied — "+row.pid);},
    uploadDoc:(doc)=>{setDb(d=>({...d,docs:[{...doc,by:me,date:todayStr(),size:(Math.floor(Math.random()*900)+100)+" KB"},...d.docs],audit:withAudit(d,{action:"Document uploaded",entity:doc.pid,detail:doc.name})}));flash("Uploaded "+doc.name);},
    addSupplier:(s)=>{setDb(d=>({...d,suppliers:[{...s,projects:"0"},...d.suppliers]}));flash("Added supplier "+s.name);},
    addProject:(p)=>{let id;setDb(d=>{const num=d.seq+1;id="NPI-2026-0"+num;return {...d,seq:num,projects:[{...p,id,parts:p.parts||"1",plant:p.plant||"Pune",updated:todayStr()},...d.projects],audit:withAudit(d,{action:"Project created",entity:id,detail:p.title})};});flash("Project "+id+" created");return id;},
    addAdmin:(sec,row)=>{setDb(d=>({...d,admin:{...d.admin,[sec]:[row,...d.admin[sec]]}}));flash("Added");},
    updateAdmin:(sec,idx,row)=>{setDb(d=>({...d,admin:{...d.admin,[sec]:d.admin[sec].map((x,i)=>i===idx?row:x)}}));flash("Saved");},
    deleteAdmin:(sec,idx)=>{setDb(d=>({...d,admin:{...d.admin,[sec]:d.admin[sec].filter((x,i)=>i!==idx)}}));flash("Deleted");},
    markAllRead:()=>setDb(d=>{return {...d,notifs:d.notifs.map(n=>({...n,read:true}))};}),
  };
  const ctx={db,act,openModal:setModal,closeModal:()=>setModal(null),confirm:setConfirmO,go:setPage,roleKey,me,flash};
  const crumb=page==="home"?"Home / My Work":LABELS[page];
  const unread=db.notifs.filter(n=>!n.read).length;
  const themeToggle=()=>{const el=document.documentElement,c=el.getAttribute('data-theme');el.setAttribute('data-theme',c==='dark'?'light':c==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark'));};
  return <AppCtx.Provider value={ctx}><div className="shell">
    <header className="appheader">
      <button className="hamburger" onClick={()=>setNavOpen(o=>!o)} title="Menu" aria-label="Toggle navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div className="brandwrap">
        <HoneywellMark size={26}/>
        <span className="wordmark">Honeywell</span>
        <span className="hdiv"/>
        <span className="apptitle">NPI Operations Hub</span>
        <span className="hdiv"/>
        <span className="crumb">{crumb}</span>
      </div>
      <div className="hdr-right">
        <button className="hicon" onClick={themeToggle} title="Theme">◐</button>
        <div className="hicon-wrap">
          <button className="hicon" title="Notifications" onClick={()=>{setNotifOpen(o=>!o);setUserMenu(false);}}><Icon n="bell" cls="" style={{width:17,height:17}}/>{unread?<span className="dot"/>:null}</button>
          {notifOpen?<NotifPanel notifs={db.notifs} onReadAll={act.markAllRead}/>:null}
        </div>
        <span className="demoTag">demo · view as</span>
        <div className="hicon-wrap">
          <div className="roleSel">
            <span className="av chipbtn" onClick={()=>{setUserMenu(o=>!o);setNotifOpen(false);}}>{r.init}</span>
            <div className="who"><b>{r.name}</b><span> · {roleKey}</span></div>
            <select value={roleKey} onChange={e=>{setRole(e.target.value);setPage("home");}}>
              {ROLE_KEYS.map(k=><option key={k} value={k}>{k}</option>)}
            </select>
          </div>
          {userMenu?<div className="usermenu">
            <button onClick={()=>{setPage("home");setUserMenu(false);}}>My work</button>
            <button onClick={()=>{flash("Profile & settings (demo)");setUserMenu(false);}}>Profile &amp; settings</button>
            <button onClick={()=>{flash("Help (demo)");setUserMenu(false);}}>Help</button>
            <button onClick={()=>{flash("Sign out (demo)");setUserMenu(false);}}>Sign out</button>
          </div>:null}
        </div>
      </div>
    </header>
    <div className="body">
      <aside className={"sidebar"+(navOpen?" open":"")}>
        <nav className="sb-nav">
          <div className="sb-sec">Workspace</div>
          {NAV.map(n=><button key={n.id} className={"sb-item"+(page===n.id?" active":"")} onClick={()=>{setPage(n.id);setNavOpen(false);}}>
            <Icon n={n.icon} cls=""/>{n.label}{n.id==="approvals"&&db.approvals.length?<span className="sb-badge">{db.approvals.length}</span>:null}</button>)}
          <div className="sb-sec">Administration</div>
          {ADMINNAV.map(n=><button key={n.id} className={"sb-item"+(page===n.id?" active":"")} onClick={()=>{setPage(n.id);setNavOpen(false);}}><Icon n={n.icon} cls=""/>{n.label}</button>)}
        </nav>
        <div className="sb-foot">v0.1 demo · role-based · Teams-ready</div>
      </aside>
      {navOpen?<div className="nav-backdrop" onClick={()=>setNavOpen(false)}/>:null}
      <main className="content">
        {page==="home" ? <Home roleKey={roleKey} onAct={flash} go={setPage}/> : page==="projects" ? <Projects onAct={flash}/> : page==="intake" ? <Intake onAct={flash}/> : page==="approvals" ? <Approvals onAct={flash}/> : page==="admin" ? <Admin onAct={flash}/> : page==="reports" ? <Reports onAct={flash}/> : page==="samples" ? <Samples onAct={flash}/> : page==="vendors" ? <Vendors onAct={flash}/> : page==="docs" ? <Documents onAct={flash}/> : page==="audit" ? <Audit onAct={flash}/> : page==="phases" ? <Phases/> : <Placeholder id={page}/>}

    {toast?<div className="toast"><span className="cbadge">✓</span>{toast}</div>:null}
    {modal}
    {confirmO?<ConfirmDialog opts={confirmO} onClose={()=>setConfirmO(null)}/>:null}
  </div></AppCtx.Provider>;
}
document.documentElement.setAttribute("data-theme","light");
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
