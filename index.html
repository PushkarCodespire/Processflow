function Intake(){
  const {act,flash,go,confirm,db}=useApp();
  /* The plants the platform is configured for, in the order Admin lists them. A site that
     is not in the table can still be typed - the code is then simply unknown, which is
     honest - but the four that are configured should not have to be. */
  const plantOpts=((db.admin&&db.admin.plants)||[])
    .filter(x=>String(x.status||"Active")!=="Inactive").map(x=>x.name).filter(Boolean);
  const [showErr,setShowErr]=useState(false);
  const [showPErr,setShowPErr]=useState(false);
  const [dupAck,setDupAck]=useState(false);
  const [step,setStep]=useState(0);
  const [proj,setProj]=useState({name:"",category:"",ecn:"",plant:"",plantCode:"",timeline:"",scope:"",incumbent:"",vendorCode:""});
  /* Who will run this project, role by role. Seeded from the plant's configured team the
     moment a plant is chosen, then editable here - the plant's table is the default, not a
     rule, because a project can be handed to someone else without re-configuring the plant. */
  const [team,setTeam]=useState({});
  const [teamTouched,setTeamTouched]=useState(false);
  const [fb,setFb]=useState({q:"",c:"",d:"",r:""});
  const [groups,setGroups]=useState([]);
  const [newGroup,setNewGroup]=useState("");
  const blankDraft={part:"",desc:"",commodity:"",uom:"EA",currency:"USD",vol:"",cost:"",group:""};
  const [draft,setDraft]=useState(blankDraft);
  /* Rates come from the CurrencyConversions list. Empty until they load, which only means the
     USD preview holds off - it never blocks adding a part. */
  const rates=(useApp().db.rates)||[];
  const draftUsd=toUsd(draft.cost,draft.currency,rates);
  const [attachments,setAttachments]=useState([]);
  const [parts,setParts]=useState([]);
  const [groupBy,setGroupBy]=useState("commodity");
  const [tplOpen,setTplOpen]=useState(false);
  const [impFile,setImpFile]=useState("");
  const [importOpen,setImportOpen]=useState(false);
  const [impText,setImpText]=useState("");
  const [impGroup,setImpGroup]=useState("__commodity");
  const [submitted,setSubmitted]=useState(false);
  const [createdId,setCreatedId]=useState(null);
  const setP=k=>e=>setProj(o=>({...o,[k]:e.target.value}));
  const setF=k=>e=>setFb(o=>({...o,[k]:e.target.value}));
  const setD=k=>e=>setDraft(o=>({...o,[k]:e.target.value}));
  const addGroup=()=>{const g=newGroup.trim(); if(!g)return; if(groups.includes(g)){flash("Group already exists");return;} setGroups(a=>a.concat([g])); setDraft(d=>({...d,group:g})); setNewGroup("");};
  const rmGroup=(g)=>{ if(parts.some(p=>p.group===g)){flash("Group has parts — remove them first");return;} setGroups(a=>{const n=a.filter(x=>x!==g); setDraft(d=>d.group===g?{...d,group:n[0]||""}:d); return n;}); };
  const projErr=(()=>{
    const e={};
    if(!proj.name.trim()) e.name="Project name is required";
    if(!proj.category.trim()) e.category="Project category is required";
    if(!proj.plant.trim()) e.plant="Plant is required";
    /* Derived from the plant, so there is nothing here for the requester to get wrong. A
       plant that is not in the configuration simply has no code yet. */
    if(!proj.scope.trim()) e.scope="Project scope is required";
    Object.entries(catProjReq(proj.category)).forEach(([k,msg])=>{
      if(!String(proj[k]||"").trim()) e[k]=msg;
    });
    /* SAP's own shape for a supplier code: 4-7 characters with a letter in them, or a
       7-digit number. Checked even where the category leaves the field optional, because a
       code that is typed at all has to be one SAP will recognise. */
    if(!e.vendorCode&&proj.vendorCode.trim()&&!VENDOR_CODE_RE.test(proj.vendorCode.trim()))
      e.vendorCode="Current supplier code must be 4-7 letters and numbers, or exactly 7 digits";
    return e;
  })();
  const isDup=!!draft.part.trim()&&parts.some(p=>(p.part||"").trim().toLowerCase()===draft.part.trim().toLowerCase());
  const draftErr=(()=>{
    const e={};
    if(!draft.part.trim()) e.part="Part Number is required";
    else if(isDup&&!dupAck) e.part="Duplicate part number — click + Add Part again to add it anyway";
    if(!draft.desc.trim()) e.desc="Description is required";
    if(String(draft.vol).trim()!==""&&(!isFinite(+draft.vol)||+draft.vol<0)) e.vol="Must be a positive number";
    if(String(draft.cost).trim()!==""&&(!isFinite(+draft.cost)||+draft.cost<0)) e.cost="Must be a positive number";
    /* Category-driven, so the rule lives in CAT_RULES rather than being spelled out here.
       Only fills a slot that is not already reporting a worse problem. */
    Object.entries(catPartReq(proj.category)).forEach(([k,msg])=>{
      if(!e[k]&&!String(draft[k]||"").trim()) e[k]=msg;
    });
    return e;
  })();
  const resetForm=()=>confirm({title:"Reset form?",message:"This clears all project details, the 4-Blocker, every part and any attachments.",confirmLabel:"Reset form",tone:"danger",onConfirm:()=>{
    setProj({name:"",category:"",ecn:"",plant:"",plantCode:"",timeline:"",scope:""});
    setFb({q:"",c:"",d:"",r:""}); setGroups([]); setParts([]); setDraft(blankDraft);
    setAttachments([]); setNewGroup(""); setStep(0); setShowErr(false); setShowPErr(false); setDupAck(false);
    flash("Form reset");
  }});
  const addPart=()=>{
    const keys=Object.keys(draftErr);
    if(keys.length){
      setShowPErr(true);
      if(draftErr.part&&draftErr.part.indexOf("Duplicate")===0) setDupAck(true);
      flash(draftErr[keys[0]]);
      return;
    }
    const g=(draft.group||"").trim()||groups[0]||"Group 1";
    if(!groups.includes(g)) setGroups(a=>a.concat([g]));
    setParts(a=>a.concat([{...draft,commodity:(draft.commodity||"").trim()||"Other",group:g}]));
    setDraft(d=>({...blankDraft,commodity:d.commodity,group:d.group}));
    setShowPErr(false); setDupAck(false);
    flash("Part added. Total: "+(parts.length+1));
  };
  const rmPart=(i)=>setParts(a=>a.filter((p,j)=>j!==i));
  const clearParts=()=>{setParts([]);flash("All parts cleared");};
  const applyGroupBy=()=>{
    if(!parts.length){flash("No parts to group yet — add or import parts first.");return;}
    const next=parts.map(p=>({...p,group:(p[groupBy]||"").trim()||"Unassigned"}));
    const gs=Array.from(new Set(next.map(p=>p.group)));
    setParts(next); setGroups(gs); setDraft(d=>({...d,group:""}));
    flash("Grouped "+next.length+" part(s) by "+(GROUP_BY_OPTS.find(o=>o[0]===groupBy)||["",""])[1]+" — "+gs.length+" group(s)");
  };
  const addAttach=()=>{const n="Attachment_"+(attachments.length+1)+".pdf";setAttachments(a=>a.concat([n]));flash("Attached "+n+" (demo)");};
  const rmAttach=(i)=>setAttachments(a=>a.filter((x,j)=>j!==i));
  const parseRows=(text)=>{
    const lines=text.split(/\r?\n/).map(l=>l.replace(/\s+$/,"")).filter(l=>l.trim());
    const out=[];
    lines.forEach((ln,idx)=>{
      const sep=ln.indexOf("\t")>=0?"\t":",";
      const c=ln.split(sep).map(x=>x.trim());
      if(idx===0 && /part\s*number|partnumber/i.test(c[0])) return;
      if(!(c[0]||"").trim()) return;
      /* 10 columns is the current template. 8 is the previous one, which had no UOM or
         Currency - those rows are read with the old offsets and defaulted, so a spreadsheet
         someone saved before this change still imports instead of silently shifting the
         volume into the UOM column. */
      /* 7 columns is the current template. Older sheets carried vendor columns per part; their
         vendor cells are skipped, since the vendor is now one field on the project. */
      if(c.length>=10) out.push({part:c[0],desc:c[1],commodity:c[2],uom:c[6]||"EA",currency:(c[7]||"USD").toUpperCase(),vol:c[8]||"",cost:c[9]||""});
      else if(c.length>=8) out.push({part:c[0],desc:c[1],commodity:c[2],uom:"EA",currency:"USD",vol:c[6]||"",cost:c[7]||""});
      else if(c.length===7) out.push({part:c[0],desc:c[1],commodity:c[2],uom:c[3]||"EA",currency:(c[4]||"USD").toUpperCase(),vol:c[5]||"",cost:c[6]||""});
      else if(c.length>=6) out.push({part:c[0],desc:c[1],commodity:c[2],uom:"EA",currency:"USD",vol:c[4]||"",cost:c[5]||""});
      else if(c.length>=2) out.push({part:c[0],desc:c[1],commodity:"Other",uom:"EA",currency:"USD",vol:"",cost:""});
    });
    return out;
  };
  const onExcelFile=async(e)=>{
    const f=e.target.files&&e.target.files[0]; if(!f)return;
    /* A CSV is just text - reading it needs no library, so it works even where the CDN is
       blocked. Only a real workbook needs SheetJS. */
    if(/\.csv$/i.test(f.name)){
      const rd0=new FileReader();
      rd0.onload=(ev)=>{
        setImpText(String(ev.target.result||""));
        setImpFile(f.name);
        flash("Loaded "+f.name+" \u2014 review, then Import parts.");
      };
      rd0.readAsText(f);
      return;
    }
    if(!(await ensureXlsx())){
      flash("Could not load the Excel reader. Save the file as .csv and try again.");
      return;
    }
    const rd=new FileReader();
    rd.onload=(ev)=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:""});
        if(!rows.length){flash("That sheet is empty.");return;}
        setImpText(rows.map(r=>r.map(c=>String(c==null?"":c)).join("\t")).join("\n"));
        setImpFile(f.name);
        flash("Loaded "+f.name+" — "+Math.max(0,rows.length-1)+" data row(s). Review, then Import parts.");
      }catch(err){ flash("Could not read that file — please use a valid .xlsx/.csv."); }
    };
    rd.readAsArrayBuffer(f);
  };
  /* A real workbook where SheetJS is reachable, a CSV where it is not. Both open in Excel
     and both import back through the same parser. */
  const downloadTemplate=async()=>{
    const rows=[PARTS_COLS].concat(tsvToGrid(SAMPLE_PARTS_TSV));
    const ok=await ensureXlsx();
    if(ok){
      try{
        const ws=XLSX.utils.aoa_to_sheet(rows);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,"Parts");
        XLSX.writeFile(wb,"NPI_Parts_Import_Template.xlsx");
        flash("Downloaded NPI_Parts_Import_Template.xlsx");
        return;
      }catch(e){ /* fall through to CSV */ }
    }
    const csv=rows.map(r=>r.map(c=>{
      const v=String(c==null?"":c);
      return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
    }).join(",")).join("\r\n");
    saveBlob(new Blob([csv],{type:"text/csv;charset=utf-8;"}),"NPI_Parts_Import_Template.csv");
    flash("Downloaded NPI_Parts_Import_Template.csv \u2014 opens in Excel");
  };
  const copyTemplate=()=>{
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(SAMPLE_PARTS_TSV).then(()=>flash("Template copied — paste it into Import Parts from Excel"),()=>flash("Copy blocked — select the text and copy manually"));
    else flash("Copy blocked — select the text and copy manually");
  };
  const doImport=()=>{
    const rows=parseRows(impText);
    if(!rows.length){flash("Nothing to import — paste rows or load the sample file.");return;}
    let gs=[...groups];
    const mapped=rows.map(r=>{
      let g = impGroup==="__commodity" ? (r.commodity||"Other") : impGroup;
      if(!gs.includes(g)) gs.push(g);
      return {...r,group:g};
    });
    setGroups(gs); setParts(a=>a.concat(mapped)); setImportOpen(false); setImpText("");
    flash("Imported "+mapped.length+" part(s) into "+(impGroup==="__commodity"?"commodity groups":"\""+impGroup+"\""));
  };
  const usedGroups=Array.from(new Set(parts.map(p=>p.group)));
  const allGroups=groups.concat(usedGroups.filter(g=>!groups.includes(g)));
  const grpCount=(g)=>parts.filter(p=>p.group===g).length;
  const readyToSubmit=parts.length>0&&Object.keys(projErr).length===0;
  const next=()=>{
    if(step===0&&Object.keys(projErr).length){ setShowErr(true); flash(projErr[Object.keys(projErr)[0]]); return; }
    if(step===3&&!parts.length){ flash("Add at least one part before continuing."); return; }
    setShowErr(false); setStep(s=>Math.min(s+1,4));
  };
  const back=()=>setStep(s=>Math.max(s-1,0));
  const [sending,setSending]=useState(false);
  const sendingRef=useRef(false);
  const submit=()=>{
    if(sendingRef.current) return;
    if(!readyToSubmit){flash("Add at least one part and complete the required project fields.");return;}
    sendingRef.current=true; setSending(true);
    /* groups is the list of group NAMES, not a count - SharePoint needs the names
       to create the PartGroups rows, and every part carries its group as a string.
       vol/cost are coerced to number-or-null and target is sent raw: the inputs are
       already typed (number / date) and validated, but the DOM hands back strings, and
       a flow writing a typed column has no try-parse - an unparseable value there fails
       the whole intake. Coercing at the boundary keeps UI state as strings, which is
       what the inputs need, and hands the backend clean types. Never default target to
       a dash: it is aimed at a DateTime column, and the display fallback lives in the
       store, not here. */
    const id=act.submitIntake({title:proj.name,category:proj.category,plant:proj.plant,plantCode:proj.plantCode,ecn:proj.ecn,scope:proj.scope,fb,
      incumbent:proj.incumbent.trim(),vendorCode:proj.vendorCode.trim(),
      /* Blank rows are dropped rather than stored as empty names: a role nobody was named for
         falls back to the registry, and an empty string would shadow that. */
      team:Object.keys(team).reduce((o,k)=>{const m=team[k]||{};
        if(String(m.n||"").trim()) o[k]={n:m.n.trim(),e:String(m.e||"").trim()}; return o;},{}),
      parts:parts.map(p=>({...p,vol:num(p.vol),cost:num(p.cost)})),groups:usedGroups,target:proj.timeline||""});
    if(!id){ sendingRef.current=false; setSending(false); return; } /* refused by role guard */
    if(id&&typeof id.then==="function"){
      setCreatedId(null); setSubmitted(true);
      id.then(real=>setCreatedId(real||"")); 
    } else { setCreatedId(id); setSubmitted(true); }
  };
  if(submitted) return <>
    <div className="pagehead"><h1>Honeywell NPI Intake</h1><p>Multi-part project submission.</p></div>
    <div className="wiz"><div className="block"><div className="panel-pad">
      <div className="ready2 ok"><div className="rk2">{createdId===null?"Submitting":createdId?"NPI Project Created Successfully":"Not Created"}</div><div className="rv2">{createdId===null
        ? "Submitted — waiting for the router to create the project and assign its number…"
        : createdId
        ? createdId+" created — "+parts.length+" part(s) across "+usedGroups.length+" group(s). Status: Feasibility Review."
        : "The router did not accept the submission. Check the toast for the reason — nothing was created."}</div></div>
      <div className="modal-note" style={{marginTop:14}}>The Sourcing team has been notified. The project proceeds through Phase 1 Feasibility per group; each group runs the feasibility → approval → sampling flow together.</div>
      <div className="det-actions" style={{marginTop:14}}><button className="btn primary" onClick={()=>go("projects")}>Open in Projects</button><button className="btn" onClick={()=>go("phases")}>Go to Phase Workspaces</button><button className="btn" onClick={()=>{setSubmitted(false);setStep(0);}}>+ Submit Another NPI</button></div>
    </div></div></div>
  </>;
  return <>
    <div className="pagehead"><h1>Honeywell NPI Intake</h1><p>Multi-part project submission — project details, 4-Blocker, then add or bulk-import parts and organise them into groups that move through the workflow together.</p></div>
    <div className="wiz">
      <div className="wiz-steps">
        {WIZ_STEPS.map((s,i)=><React.Fragment key={i}>
          <div className={"wiz-step "+(i<step?"done":i===step?"current":"")} onClick={()=>{if(i<step)setStep(i);}}>
            <span className="wn">{i<step?"✓":i+1}</span><span className="wl">{s}</span>
          </div>
          {i<WIZ_STEPS.length-1?<span className={"wiz-line"+(i<step?" on":"")}/>:null}
        </React.Fragment>)}
      </div>
      <div className="block"><div className="panel-pad">
        {step===0?<div>
          <div className="fsec" style={{marginTop:0}}>Project information</div>
          <div className="fgrid2">
            <div className={"field2"+(showErr&&projErr.name?" invalid":"")}><div className="flabel">Project name <i>*</i></div><input value={proj.name} onChange={setP("name")} placeholder="e.g. New Mounting Bracket NPI"/>{showErr&&projErr.name?<div className="ferr">{projErr.name}</div>:null}</div>
            <div className={"field2"+(showErr&&projErr.category?" invalid":"")}><div className="flabel">Project category <i>*</i></div><Combo value={proj.category} onChange={setP("category")} options={NPI_CATS} allowNew/>{showErr&&projErr.category?<div className="ferr">{projErr.category}</div>:null}</div>
            <div className="field2"><div className="flabel">ECN number {catProjReq(proj.category).ecn?<i>*</i>:null}</div><input value={proj.ecn} onChange={setP("ecn")} placeholder="optional"/></div>
            <div className={"field2"+(showErr&&projErr.plant?" invalid":"")}><div className="flabel">Plant <i>*</i></div><Combo value={proj.plant} onChange={e=>{const v=(e&&e.target)?e.target.value:e;/* Combo hands back an event, the way an input does */
              setProj(o=>({...o,plant:v,plantCode:plantCodeOf({plant:v})}));
              if(!teamTouched) setTeam(teamForPlant(v));}} options={plantOpts.length?plantOpts:NPI_SITES} allowNew/>{showErr&&projErr.plant?<div className="ferr">{projErr.plant}</div>:null}</div>
            <div className="field2"><div className="flabel">Plant code</div><div className="rovalue">{proj.plantCode||(proj.plant?"Not configured for "+proj.plant:"Choose a plant first")}</div></div>
            <div className={"field2"+(showErr&&projErr.incumbent?" invalid":"")}><div className="flabel">Current supplier {catProjReq(proj.category).incumbent?<i>*</i>:null}</div><input value={proj.incumbent} onChange={setP("incumbent")} placeholder="Who supplies these parts today"/>{showErr&&projErr.incumbent?<div className="ferr">{projErr.incumbent}</div>:null}</div>
            <div className={"field2"+(showErr&&projErr.vendorCode?" invalid":"")}><div className="flabel">Current supplier code {catProjReq(proj.category).vendorCode?<i>*</i>:null}</div><input maxLength={7} value={proj.vendorCode} onChange={setP("vendorCode")} placeholder="4-7 alphanumeric, or 7 digits"/>{showErr&&projErr.vendorCode?<div className="ferr">{projErr.vendorCode}</div>:null}</div>
            <div className="field2"><div className="flabel">Estimated completion timeline</div><input type="date" value={proj.timeline} onChange={setP("timeline")}/></div>
            <div className={"field2 wcol2"+(showErr&&projErr.scope?" invalid":"")}><div className="flabel">Project scope <i>*</i></div><textarea rows={3} value={proj.scope} onChange={setP("scope")} placeholder="Describe the scope of this NPI project..."/>{showErr&&projErr.scope?<div className="ferr">{projErr.scope}</div>:null}</div>
          </div>
        </div>:null}
        {/* The team, role by role. One person each: every approval, every task and every
            notification in this project goes to exactly one of these names, and a role left
            unassigned falls back to whoever the role registry names. */}
        {step===1?<div>
          <div className="fsec" style={{marginTop:0}}>Project team</div>
          <div className="modal-note" style={{marginBottom:12}}>
            {proj.plant
              ? <>Defaults come from <b>{proj.plant}</b> in Team by plant. Change anyone here and only this project is affected.</>
              : <>Choose a plant on the previous step and its configured team appears here.</>}
          </div>
          <div className="fgrid2">
            {TEAM_ROLES.map(id=>{const r=ROLE[id]||{}; const m=team[id]||{};
              return <div className="field2" key={id}>
                <div className="flabel">{r.label||id}</div>
                <input value={m.n||""} placeholder={personFor(id)||"Unassigned"}
                  onChange={e=>{const v=e.target.value; setTeamTouched(true);
                    setTeam(t=>({...t,[id]:{...(t[id]||{}),n:v}}));}}/>
                <input className="teammail" value={m.e||""} placeholder="email"
                  onChange={e=>{const v=e.target.value; setTeamTouched(true);
                    setTeam(t=>({...t,[id]:{...(t[id]||{}),e:v}}));}}/>
              </div>;})}
          </div>
          <div className="det-actions" style={{marginTop:14}}>
            <button className="btn" onClick={()=>{setTeam(teamForPlant(proj.plant));setTeamTouched(false);}}
              disabled={!proj.plant}>Reset to the plant’s team</button>
          </div>
        </div>:null}
        {step===2?<div>
          <div className="fsec" style={{marginTop:0}}>4-Blocker</div>
          <div className="fgrid2">
            <div className="field2"><div className="flabel">Quality</div><textarea rows={3} value={fb.q} onChange={setF("q")} placeholder="Key quality considerations..."/></div>
            <div className="field2"><div className="flabel">Cost</div><textarea rows={3} value={fb.c} onChange={setF("c")} placeholder="Cost considerations..."/></div>
            <div className="field2"><div className="flabel">Delivery</div><textarea rows={3} value={fb.d} onChange={setF("d")} placeholder="Delivery / timeline considerations..."/></div>
            <div className="field2"><div className="flabel">Risk</div><textarea rows={3} value={fb.r} onChange={setF("r")} placeholder="Risk factors..."/></div>
          </div>
        </div>:null}
        {step===3?<div>
          <div className="fsec fsec-row" style={{marginTop:0}}><span>Groups</span><span style={{textTransform:"none",fontWeight:400,letterSpacing:0,color:"var(--muted)",fontSize:11.5}}>Feasibility, approval &amp; sampling run once per group — not per part.</span></div>
          <div className="grp-bar">
            {allGroups.map(g=><span className="grp-chip" key={g}>{g} <b>{grpCount(g)}</b>{grpCount(g)===0?<span className="x" title="Remove group" onClick={()=>rmGroup(g)}>×</span>:null}</span>)}
            <span className="grp-add"><input value={newGroup} placeholder="New group name" onChange={e=>setNewGroup(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addGroup();}}/><button className="btn sm" onClick={addGroup}>+ Group</button></span>
          </div>
          <div className="groupby-row">
            <span className="gb-label">Group all parts by</span>
            <select value={groupBy} onChange={e=>setGroupBy(e.target.value)}>{GROUP_BY_OPTS.map(o=><option key={o[0]} value={o[0]}>{o[1]}</option>)}</select>
            <button className="btn sm" onClick={applyGroupBy} disabled={!parts.length}>Apply grouping</button>
            <span className="gb-note">Re-groups every loaded part by that column — use after a bulk Excel import.</span>
          </div>
          <div className="fsec fsec-row"><span>Add part</span><span className="fsec-btns"><button className="btn sm" onClick={()=>setTplOpen(true)}>Excel template</button><button className="btn sm" onClick={()=>{setImpText("");setImportOpen(true);}}>Import Parts from Excel</button></span></div>
          <div className="partnote">Add each part one at a time. Fill the fields below and click <b>+ Add Part</b>. All parts will be submitted together with the project.</div>
          <div className="fgrid2">
            <div className={"field2"+(showPErr&&draftErr.part?" invalid":"")}><div className="flabel">Part number <i>*</i></div><input value={draft.part} onChange={e=>{setDupAck(false);setD("part")(e);}}/>{showPErr&&draftErr.part?<div className="ferr">{draftErr.part}</div>:isDup?<div className="fwarn">{dupAck?"Duplicate part number — it will be added as a separate line.":"Duplicate part number — click + Add Part again to add it anyway."}</div>:null}</div>
            <div className={"field2"+(showPErr&&draftErr.desc?" invalid":"")}><div className="flabel">Description <i>*</i></div><input value={draft.desc} onChange={setD("desc")}/>{showPErr&&draftErr.desc?<div className="ferr">{draftErr.desc}</div>:null}</div>

function ApprovalDetail({a,onBack}){
  const {act,confirm,roleKey,cost,can,db,openForm}=useApp();
  const mayDecide=approvalsFor(roleKey,[a],db).length>0;
  /* A derived gate with no chain step is owned by a phase form - find it from the project's
     status, and only offer it if this role can actually submit it. */
  const proj=db.projects.find(x=>x.id===a.pid);
  const spec=proj?formForStatus(proj.status):null;
  const formFor=(spec&&hasCap(roleKey,spec.cap))?spec:null;
  const [comment,setComment]=useState("");
  const decide=(decision,tone)=>{
    const what=decision==="Approved"?"route it to the next gate":decision==="Rejected"?"return it to the requester":"reassign it to the role group";
    confirm({title:decision+" — "+a.pid,message:"Record "+decision.toLowerCase()+" for "+a.gate+"? This writes an audit entry and will "+what+".",confirmLabel:decision,tone:tone,onConfirm:()=>{
      /* A derived row that carries a chain step is a real gate: decideGate validates the move
         and posts the command. Without the step there is nothing to advance, so it stays an
         audited acknowledgement. */
      const proj=a.step?db.projects.find(x=>x.id===a.pid):null;
      if(a.step&&proj) act.decideGate(proj,a.step,decision==="Approved"?"Approved":"Returned",comment);
      else act.resolveApproval(a,decision,comment);
      onBack();}});
  };
  return <>
    <button className="backlink" onClick={onBack}>‹ Back to approvals</button>
    <div className="pagehead"><h1>{a.gate}</h1><p><span className="mono" style={{color:"var(--teal)",fontWeight:600}}>{a.pid}</span> · Part {a.part} · Requested by {a.by}</p></div>
    <div className="detail-grid five">
      <div className="dcard"><div className="dk">Type</div><div className="dv">{a.type}</div></div>
      <div className="dcard"><div className="dk">Plant</div><div className="dv">{plantLine(proj||{})}</div></div>
      <div className="dcard"><div className="dk">Amount</div><div className="dv">{cost?a.amount:<span className="tmeta">restricted</span>}</div></div>
      <div className="dcard"><div className="dk">Requested by</div><div className="dv">{a.by}</div></div>
      <div className="dcard"><div className="dk">SLA remaining</div><div className="dv"><span className={"sla "+slaColor(a.h)}>{slaLabel(a.h)}</span></div></div>
    </div>
    <div className="panel panel-pad" style={{maxWidth:680}}>
      <div className="teams-note"><span>🔔</span><div><b>Also in Teams.</b> This request was delivered to your Teams as an approval card — act here or there, and Power Automate records the single decision.</div></div>
      <div className="field2"><div className="flabel">Approver comments</div><textarea rows={3} value={comment} onChange={e=>setComment(e.target.value)} placeholder="Add a comment (optional)…"/></div>
      {mayDecide&&!a.step&&formFor? <div>
        {/* This gate is decided on its form, not here: the form captures the evidence the
            decision has to rest on, and it is the path that reaches the router. Offering an
            Approve button beside it would be a second way to decide that quietly persists
            nothing. */}
        <div className="modal-note">This gate is recorded on <b>{formFor.id} · {formFor.name}</b>, which captures the evidence behind the decision.</div>
        <div className="det-actions"><button className="btn primary" onClick={()=>openForm(formFor.id,a.pid,a.group)}>Open {formFor.id}</button></div>
      </div> :
      mayDecide? <div className="det-actions">
        <button className="btn ok" onClick={()=>decide("Approved","ok")}>Approve</button>
        <button className="btn no" onClick={()=>decide("Rejected","danger")}>Reject</button>
        {can("approval.reassign")?<button className="btn" onClick={()=>decide("Reassigned")}>Reassign</button>:null}
      </div> :
      <div className="modal-note" style={{marginTop:14}}>This gate is not routed to <b>{ROLE[roleKey].label}</b>. You can read it and add a comment, but the decision belongs to {(a.cft?["__CFT__"]:(a.roles||GATE_ROLES[a.type]||[])).map(x=>x==="__CFT__"?"the CFT signatories":(ROLE[x]||{label:x}).label).join(", ")||"another role"}.</div>}
    </div>
  </>;
}

  const sel=selId!=null?db.approvals.find(x=>x.id===selId):null;

    {key:"gate",label:"Gate",filterType:"text",val:x=>x.gate,render:x=><span className="tcell">{x.gate}</span>},
    {key:"type",label:"Type",w:"124px",filterType:"select",options:["All"].concat(Array.from(new Set(db.approvals.map(x=>x.type).filter(Boolean))).sort()),val:x=>x.type,render:x=><span className="mchip">{x.type}</span>},

    {key:"part",label:"Part",w:"140px",hidden:true,filterType:"text",val:x=>x.part,render:x=><span className="tmeta">{x.part}</span>},
    {key:"act",label:"",w:"98px",always:true,sortable:false,render:(x)=><button className="btn primary sm" onClick={e=>{e.stopPropagation();setSelId(x.id);}}>Review</button>},
  ];
  return <>

      <DataTable columns={cols} rows={mine} pageSize={10} onRowClick={x=>setSelId(x.id)}/>
    </div>
  </>;
}

/* ---------------------------------------------------------------- reporting analytics

   Every figure on the Reports page is computed here, from the audit trail and the submitted
   forms. Nothing is a constant. The page used to carry four: "On-time PPAP 92%", "Avg cycle
   time 47d", "Cost savings Rs 42L" and a hardcoded month-by-month bar chart - numbers that
   survive any amount of real data because nothing produces them. On a screen whose whole
   claim is that it reports what happened, an invented number is worse than an empty chart,
   so where there is not enough history these return null and the UI says so.

   The audit trail is the source because it is the only record of WHEN things moved. Every
   decision writes one row: ts, actor, role, action, entity, detail. `detail` carries the move
   as "From -> To" (and a group prefix when the project has split), `entity` carries
   "NPI-xxxx" or "NPI-xxxx / Group". That is enough to reconstruct the whole timeline. */

const RPT_ARROW = "\u2192";
/* One parsed transition per audit row that actually moved something. */
function rptTx(db){
  const out=[];
  (db.audit||[]).forEach(a=>{
    const ent=String(a.entity||"").trim();
    const em=ent.match(/^(NPI-[A-Za-z0-9-]+)(?:\s*\/\s*(.+))?$/);
    if(!em) return;
    const d=String(a.detail||"");
    if(d.indexOf(RPT_ARROW)<0) return;               /* recommendations and "recorded" rows move nothing */
    const parts=d.split(RPT_ARROW);
    if(parts.length!==2) return;
    let from=parts[0].trim(), to=parts[1].trim();
    /* a group move reads "Castings: Sample Under Inspection -> SQE Approved" */
    const group=(em[2]||"").trim();
    if(group){
      const gm=from.match(/^(.+?):\s*(.+)$/);
      if(gm) from=gm[2].trim();
    }
    out.push({pid:em[1],group:group,from:from,to:to,at:evWhen(a.ts),
              actor:a.actor||"",role:a.role||"",action:a.action||""});
  });
  return out.sort((x,y)=>x.at-y.at);
}
/* Recommendation rows carry no arrow, so they are collected separately - they are what the
   approver-turnaround figure measures from. */
function rptRecs(db){
  const out=[];
  (db.audit||[]).forEach(a=>{
    const ent=String(a.entity||"").trim();
    const em=ent.match(/^(NPI-[A-Za-z0-9-]+)(?:\s*\/\s*(.+))?$/);
    if(!em||!/recommends /.test(String(a.detail||""))) return;
    const who=String(a.detail).match(/awaiting (.+)$/);
    out.push({pid:em[1],group:(em[2]||"").trim(),at:evWhen(a.ts),actor:a.actor||"",
              form:String(a.action||"").split(" ")[0],awaiting:who?who[1].trim():""});
  });
  return out.sort((x,y)=>x.at-y.at);
}

const RPT_DAY=86400000;
const rptDays=(ms)=>ms/RPT_DAY;
const rptMed=(xs)=>{if(!xs.length)return null;const a=xs.slice().sort((p,q)=>p-q),m=a.length>>1;
  return a.length%2?a[m]:(a[m-1]+a[m])/2;};
const rptAvg=(xs)=>xs.length?xs.reduce((s,x)=>s+x,0)/xs.length:null;

/* A status that means something went backwards. Used for yield and rework alike, so the two
   can never disagree about what counts as a failure. */
const RPT_REWORK={"Sample Rejected":"Sample rejected (SQE/Eng)","Production Rejected":"Trial failed - back to Engineering",
  "Trial Repeat Required":"Trial repeat","PSW Rejected":"PSW rejected","Returned to Sourcing":"Returned to Sourcing",
  "Re-sample Requested":null};   /* the recovery step itself is not a second failure */
const rptIsRework=(st)=>Object.prototype.hasOwnProperty.call(RPT_REWORK,st)&&RPT_REWORK[st]!==null;

/* Intake to FAIR, in days, for every project that actually got there. */
function rptCycle(tx){
  const first={},done={};
  tx.forEach(t=>{
    if(first[t.pid]==null||t.at<first[t.pid]) first[t.pid]=t.at;
    if(t.to==="FAIR Released"&&(done[t.pid]==null||t.at>done[t.pid])) done[t.pid]=t.at;
  });
  return Object.keys(done).map(pid=>({pid:pid,days:rptDays(done[pid]-first[pid]),at:done[pid]}))
    .filter(x=>x.days>=0);
}

/* How long work sat at each status. Arriving at S is a transition whose `to` is S; leaving is
   the next transition on the same project+group. The last leg is still open, so it is measured
   to now and flagged rather than dropped - an item stuck for three weeks is the finding. */
function rptDwell(tx,now){
  const lanes={};
  tx.forEach(t=>{const k=t.pid+"|"+t.group; (lanes[k]=lanes[k]||[]).push(t);});
  const spans=[];
  Object.keys(lanes).forEach(k=>{
    const L=lanes[k];
    for(let i=0;i<L.length;i++){
      const end=(i+1<L.length)?L[i+1].at:now;
      spans.push({status:L[i].to,pid:L[i].pid,group:L[i].group,
                  days:rptDays(end-L[i].at),open:i+1>=L.length});
    }
  });
  return spans;
}

/* From the member's recommendation to the head's decision - the wait that is a person, not a
   process. Matched on project+group+form so two groups in flight cannot be confused. */
function rptTurnaround(db,tx){
  const recs=rptRecs(db), out=[];
  recs.forEach(r=>{
    const hit=tx.find(t=>t.pid===r.pid&&(t.group||"")===(r.group||"")
      &&t.at>=r.at&&String(t.action||"").indexOf(r.form)===0);
    if(hit) out.push({form:r.form,by:r.awaiting,hours:(hit.at-r.at)/3600000,pid:r.pid,group:r.group});
  });
  return out;
}

/* A lane that reached the trial without ever going backwards. Measured per group, because a
   group is the unit that passes or fails from F-07 on. */
function rptYield(tx){
  const lanes={};
  tx.forEach(t=>{const k=t.pid+"|"+t.group; const L=lanes[k]=lanes[k]||{bad:0,got:false};
    if(rptIsRework(t.to)) L.bad++;
    if(t.to==="Engineering Approved"||t.to==="PSW Pending Sign-off"||t.to==="FAIR Released") L.got=true;});
  const reached=Object.keys(lanes).filter(k=>lanes[k].got);
  if(!reached.length) return {pct:null,n:0,clean:0};
  const clean=reached.filter(k=>lanes[k].bad===0).length;
  return {pct:clean/reached.length*100,n:reached.length,clean:clean};
}

/* Savings are the point of a localisation programme, so they come from the approved quote
   rather than a headline: (existing - localized) x annual volume, each row converted on its
   own currency. A project whose F-02 was never filled contributes nothing instead of zero. */
function rptSavings(projects){
  let cur=0,nw=0,priced=0;
  (projects||[]).forEach(p=>{
    const v=p.form&&p.form["F-02"]&&p.form["F-02"].partsPricing;
    if(!v) return;
    let any=false;
    quoteToRows(v).forEach(r=>{
      const qty=parseFloat(r[2]),ex=parseFloat(r[3]),lo=parseFloat(r[5]);
      if(!isFinite(qty)||!isFinite(ex)||!isFinite(lo)) return;
      const a=usdOf(ex*qty,r[4]||"USD"),b=usdOf(lo*qty,r[6]||"USD");
      if(a==null||b==null) return;
      cur+=a; nw+=b; any=true;
    });
    if(any) priced++;
  });
  return priced?{current:cur,proposed:nw,saving:cur-nw,projects:priced}:null;
}

/* Committed spend is what F-04 actually raised in SAP, which is the only number that can be
   compared with what was approved. */
function rptCommitted(projects){
  let amt=0,n=0;
  (projects||[]).forEach(p=>{
    const v=p.form&&p.form["F-04"]&&p.form["F-04"].sapLines;
    if(!v) return;
    let any=false;
    sapRows(v).forEach(r=>{const a=parseFloat(r[4]); if(isFinite(a)&&r[2]){amt+=a;any=true;}});
    if(any) n++;
  });
  return n?{amount:amt,projects:n}:null;
}

/* Vendors are scored on what the record shows they did: how many parts they hold, whether
   their samples came back, and how many times work on their parts went backwards. */
function rptSuppliers(db,projects){
  const pids={}; (projects||[]).forEach(p=>{pids[p.id]=p;});
  const by={};
  const get=(nm)=>(by[nm]=by[nm]||{vendor:nm,parts:0,projects:{},groups:{},samples:0,passed:0,rejected:0,rework:0});
  (db.parts||[]).forEach(x=>{
    const nm=(x.supplier||"").trim(); if(!nm||nm==="\u2014"||!pids[x.pid]) return;
    const r=get(nm); r.parts++; r.projects[x.pid]=1;
    if(x.group) r.groups[x.pid+"|"+x.group]=1;
  });
  (db.samples||[]).forEach(x=>{
    const nm=(x.supplier||"").trim(); if(!nm||!by[nm]) return;
    const r=by[nm]; r.samples++;
    if(x.result==="Approved"||x.result==="Conditional") r.passed++;
    if(x.result==="Rejected") r.rejected++;
  });
  /* a rework on a group is attributed to the vendors holding that group's parts */
  rptTx(db).forEach(t=>{
    if(!rptIsRework(t.to)||!pids[t.pid]) return;
    Object.keys(by).forEach(nm=>{
      if(t.group?by[nm].groups[t.pid+"|"+t.group]:by[nm].projects[t.pid]) by[nm].rework++;
    });
  });
  return Object.keys(by).map(nm=>{const r=by[nm];
    /* Over DECIDED samples only. Counting a pending inspection as a failure showed a vendor
       whose one sample had not been looked at yet as 0%, which reads as a bad supplier. */
    const decided=r.passed+r.rejected;
    return {vendor:nm,parts:r.parts,projects:Object.keys(r.projects).length,
            samples:r.samples,passed:r.passed,rejected:r.rejected,rework:r.rework,
            pending:r.samples-decided,decided:decided,
            passRate:decided?r.passed/decided*100:null};
  }).sort((a,b)=>b.parts-a.parts);
}

/* ---------------------------------------------------------------- report primitives */
/* Chart.js, loaded the same way SheetJS is: lazily, pinned, and failing soft. The CSS bars it
   replaces were readable but obviously hand-made - no axes, no tooltips, no scale - which is
   the wrong impression for a plant review. If the CDN is blocked the components fall back to
   the bar markup rather than rendering an empty box. */
let _chartPromise=null;
function ensureCharts(){
  if(typeof Chart!=="undefined") return Promise.resolve(true);
  if(_chartPromise) return _chartPromise;
  _chartPromise=new Promise(resolve=>{
    const el=document.createElement("script");
    el.src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js";
    el.onload=()=>resolve(typeof Chart!=="undefined");
    el.onerror=()=>resolve(false);
    document.head.appendChild(el);
  });
  return _chartPromise;
}
/* Colours come from the stylesheet, not from Chart.js defaults, so the charts follow the
   theme the rest of the app uses instead of introducing a second palette. */
const cssVar=(n2,fb)=>{try{const v=getComputedStyle(document.documentElement).getPropertyValue(n2).trim();return v||fb;}catch(e){return fb;}};
/* Canvas cannot read a CSS custom property - "var(--blue)" reaches it as an unparseable string
   and Chart.js silently paints black. Every colour is resolved here instead, so a caller can
   keep using the same token names the rest of the app uses. */
const chartColor=(c)=>{
  if(typeof c!=="string") return c;
  const m=c.match(/^var\(\s*(--[\w-]+)\s*\)$/);
  return m?cssVar(m[1],"#888"):c;
};
/* A categorical palette, NOT the brand accent repeated. --teal in this theme resolves to
   Honeywell red, so using it as the default series colour painted every chart in warning red -
   which reads as "everything is on fire" on a portfolio screen. Status colours (red = bad) are
   still passed explicitly where they carry meaning. */
const CHART_OK="#0E7C86", CHART_WARN=()=>cssVar("--amber","#B4740E"),
      CHART_BAD=()=>cssVar("--red","#C4281C"), CHART_GOOD=()=>cssVar("--green","#1E7E45");
const CHART_PALETTE=()=>[cssVar("--blue","#215E9E"),"#0E7C86",cssVar("--amber","#B4740E"),
  "#6B4FA8",cssVar("--green","#1E7E45"),"#B4506B",cssVar("--red","#C4281C"),"#5B7085"];

/* One canvas, one Chart instance, destroyed on unmount or on a data change that alters the
   shape. Not memoised on the data object: the parent rebuilds it every render, so comparing
   by reference would redraw constantly and comparing deeply costs more than the redraw. */
function Chart2({type,labels,series,height,horizontal,onPick,stacked,money:asMoney,unit}){
  const ref=useRef(null), inst=useRef(null);
  const [ready,setReady]=useState(typeof Chart!=="undefined");
  const [failed,setFailed]=useState(false);
  useEffect(()=>{ let dead=false;
    ensureCharts().then(okc=>{ if(dead) return; if(okc) setReady(true); else setFailed(true); });
    return()=>{dead=true;}; },[]);
  const sig=JSON.stringify([type,labels,series.map(x=>x.data),horizontal,stacked]);
  useEffect(()=>{
    if(!ready||!ref.current||typeof Chart==="undefined") return;
    if(inst.current){ inst.current.destroy(); inst.current=null; }
    const pal=CHART_PALETTE(), ink=cssVar("--ink","#1b1b1b"), muted=cssVar("--muted","#6b7280"),
          grid=cssVar("--border","#e3e3e3"), surf=cssVar("--surface","#fff");
    const pie=(type==="doughnut"||type==="pie");
    const ds=series.map((sx,i)=>({
      label:sx.label||"",
      data:sx.data,
      /* one colour per category when the caller expressed no preference: a single flat block
         of the brand accent is what made these look like a placeholder. */
      backgroundColor:sx.colors?sx.colors.map(chartColor)
        :(pie||(type==="bar"&&series.length===1&&!sx.color)
            ?labels.map((_,k)=>pal[k%pal.length])
            :chartColor(sx.color||pal[i%pal.length])),
      borderColor:pie?surf:chartColor(sx.color||pal[i%pal.length]),
      borderWidth:pie?2:0,
      borderRadius:pie?0:6,
      maxBarThickness:34,
      fill:type==="line",
      tension:0.35,
      pointRadius:type==="line"?4:0,
      pointHoverRadius:type==="line"?6:0,
      borderWidth:type==="line"?2.5:(pie?2:0),
      pointBackgroundColor:chartColor(sx.color||pal[i%pal.length]),
    }));
    const fmt=(v)=>asMoney?money(v,"USD"):(unit?(Math.round(v*10)/10)+unit:v);
    inst.current=new Chart(ref.current.getContext("2d"),{
      type:type==="hbar"?"bar":type,
      data:{labels:labels,datasets:ds},
      options:{
        responsive:true,maintainAspectRatio:false,
        indexAxis:horizontal?"y":"x",
        animation:{duration:420},
        layout:{padding:{top:6,right:8}},
        onClick:onPick?(e,els)=>{ if(els&&els.length) onPick(els[0].index); }:undefined,
        onHover:onPick?(e,els)=>{ e.native.target.style.cursor=els.length?"pointer":"default"; }:undefined,
        plugins:{
          legend:{display:pie||series.length>1,position:pie?"right":"top",
            labels:{color:muted,boxWidth:10,boxHeight:10,usePointStyle:true,pointStyle:"circle",
                    font:{size:11.5,family:"inherit"},padding:14}},
          tooltip:{backgroundColor:ink,titleColor:surf,bodyColor:surf,padding:10,cornerRadius:8,
            displayColors:!pie,titleFont:{size:12},bodyFont:{size:12},
            callbacks:{label:(c)=>{const v=pie?c.parsed:(horizontal?c.parsed.x:c.parsed.y);
              return " "+(c.dataset.label?c.dataset.label+": ":"")+fmt(v);}}},
        },
        /* The value axis gets a formatter; the CATEGORY axis must not, because passing
           callback:undefined replaces Chart.js's own label lookup and the axis then prints
           the row index instead of the label. */
        scales:pie?{}:(()=>{
          /* Counts are whole things. Without this a chart of 1,2,3 projects draws ticks at
             0.5 and 1.5, which says "half a project". */
          const whole=series.every(sx=>sx.data.every(v=>v==null||Number.isInteger(v)));
          const base=(fmtIt)=>({color:muted,font:{size:11,family:"inherit"},
            ...(fmtIt?{callback:(v)=>fmt(v),...(whole?{precision:0,stepSize:1}:{})}:{})});
          return {
            x:{stacked:!!stacked,...(horizontal?{beginAtZero:true}:{}),
               grid:{display:!!horizontal,color:grid,drawBorder:false},
               ticks:base(!!horizontal)},
            y:{stacked:!!stacked,...(horizontal?{}:{beginAtZero:true}),
               grid:{display:!horizontal,color:grid,drawBorder:false},
               ticks:{...base(!horizontal),autoSkip:false}},
          };})(),
      },
    });
    return()=>{ if(inst.current){inst.current.destroy();inst.current=null;} };
  },[ready,sig]);
  /* A tenant that blocks the CDN must say so rather than sit on "Loading" forever - an
     indefinite spinner is indistinguishable from a hung page, and the numbers are still
     worth showing without the picture. */
  if(failed) return <div className="rchart-load" style={{height:"auto",padding:"14px",display:"block"}}>
    <div style={{textAlign:"center",marginBottom:10}}><b>Chart library unavailable.</b>{" "}
      <span className="tmeta">Same data, as a list:</span></div>
    <RBar data={labels.map((l,i)=>({label:l,v:series[0].data[i]||0}))} unit={unit}/>
  </div>;
  if(!ready) return <div className="rchart-load" style={{height:(height||250)+"px"}}>Loading chart…</div>;
  return <div className="rchart" style={{height:(height||250)+"px"}}><canvas ref={ref}/></div>;
}
/* The bar list stays for the cases a chart cannot beat it: a ranked list where the label is
   the point (ageing items, supplier names) reads better as text than as an axis. */
function RTile({k,v,s,ic,icon,delta,target,tone,onClick,hint}){
  /* A target turns a number into a judgement. Without one, 92% is just 92%. */
  const rag=target==null||v==null?null:(target.good(v)?"good":target.warn&&target.warn(v)?"warn":"bad");
  return <div className={"rtile"+(onClick?" clickable":"")+(rag?" rag-"+rag:"")} onClick={onClick} title={hint||""}>
    <div className="k"><span className={"ic "+ic}><Icon n={icon} cls=""/></span>{k}</div>
    <div className="v">{v==null?<span className="nodata">no data</span>:v}{tone?<span className={"tone "+tone}/>:null}</div>
    <div className="s">{s}{delta!=null&&isFinite(delta)?<span className={"delta "+(delta>=0?"up":"down")}>{delta>=0?"\u25b2":"\u25bc"} {Math.abs(delta).toFixed(0)}%</span>:null}</div>
  </div>;
}
/* Horizontal bar that can carry a second value (a target, or the same measure last period). */
function RBar({data,unit,onPick,marker}){
  const max=Math.max.apply(null,data.map(d=>d.v).concat([1]));
  if(!data.length) return <div className="rempty">Nothing to show for this filter.</div>;
  return <div className="hbar">{data.map((d,i)=><div key={i} className={"hbar-row"+(onPick?" pick":"")} onClick={onPick?()=>onPick(d):null}>
    <div className="hbar-lbl" title={d.label}>{d.label}</div>
    <div className="hbar-track">
      <div className="hbar-fill" style={{width:Math.max(2,d.v/max*100)+"%",background:d.color||"var(--teal)"}}/>
      {marker!=null?<div className="hbar-mark" style={{left:(marker/max*100)+"%"}}/>:null}
    </div>
    <div className="hbar-val">{d.t!=null?d.t:(unit?d.v.toFixed(1)+unit:d.v)}</div>
  </div>)}</div>;
}
/* One bar, many segments - the shape that answers "what is the mix" in a single line. */
function RStack({data,total}){
  const t=total||data.reduce((s,d)=>s+d.v,0);
  if(!t) return <div className="rempty">Nothing to show for this filter.</div>;
  return <div>
    <div className="rstack">{data.filter(d=>d.v>0).map((d,i)=>
      <div key={i} className="rstack-seg" style={{width:(d.v/t*100)+"%",background:d.color}}
           title={d.label+": "+d.v}/>)}</div>
    <div className="rlegend">{data.map((d,i)=><span key={i}><i style={{background:d.color}}/>{d.label} <b>{d.v}</b></span>)}</div>
  </div>;
}
function RSpark({data}){
  if(data.length<2) return null;
  const max=Math.max.apply(null,data.concat([1])), w=120, h=28;
  const pts=data.map((v,i)=>[(i/(data.length-1))*w,h-(v/max)*h].join(",")).join(" ");
  return <svg className="rspark" viewBox={"0 0 "+w+" "+h} width={w} height={h} preserveAspectRatio="none">
    <polyline points={pts} fill="none" stroke="var(--teal)" strokeWidth="2"/></svg>;
}
function RPanel({title,sub,children,right,wide}){
  return <div className={"block rpanel"+(wide?" wide":"")} style={{marginBottom:16}}>
    <div className="block-h"><h2>{title}</h2>{right||null}</div>
    {sub?<div className="rsub">{sub}</div>:null}
    <div className="chartbody">{children}</div>
  </div>;
}
const RNEED=(what)=><div className="rempty"><b>Not enough history yet.</b><br/>{what}</div>;

/* ---------------------------------------------------------------- Reports */
const RPT_TABS=[["portfolio","Portfolio"],["cycle","Cycle time"],["quality","Quality"],
                ["suppliers","Suppliers"],["financial","Financial"],["sla","SLA & workload"]];
const RPT_PERIODS=[["all","All time",0],["30","Last 30 days",30],["90","Last 90 days",90],["180","Last 6 months",180]];
/* Targets are declared once so a tile and the table under it cannot disagree about what good
   looks like. Provisional until the plant confirms them - they are not in the TPRD. */
const RPT_TARGETS={
  fpy:{good:v=>v>=85,warn:v=>v>=70},
  onTime:{good:v=>v>=95,warn:v=>v>=85},
  turnaround:{good:v=>v<=48,warn:v=>v<=96},
};

function Reports({onAct}){
  const {db,go,openProject}=useApp();
  const [tab,setTab]=useState("portfolio");
  const [period,setPeriod]=useState("all");
  const [fPlant,setPlant]=useState("All");
  const [fCat,setCat]=useState("All");
  const [fPhase,setPhase]=useState("All");
  const [fOwner,setOwner]=useState("All");
  const [drill,setDrill]=useState(null);

  const all=(db.projects&&db.projects.length)?db.projects:PROJECTS;
  const now=Date.now();
  const days=(RPT_PERIODS.find(p=>p[0]===period)||[])[2]||0;
  const since=days?now-days*RPT_DAY:0;

  const uniq=(xs)=>["All"].concat(Array.from(new Set(xs.filter(Boolean))).sort());
  const plants=uniq(all.map(p=>p.plant)), cats=uniq(all.map(p=>p.category)),
        phases=uniq(all.map(p=>p.phase)), owners=uniq(all.map(p=>p.owner));

  /* One predicate, applied once - every tile and chart below reads the same set, so the
     filter bar cannot mean different things in different panels. */
  const rows=all.filter(p=>
    (fPlant==="All"||p.plant===fPlant)&&(fCat==="All"||p.category===fCat)&&
    (fPhase==="All"||p.phase===fPhase)&&(fOwner==="All"||p.owner===fOwner));
  const ids={}; rows.forEach(p=>{ids[p.id]=p;});

  const txAll=rptTx(db).filter(t=>ids[t.pid]);
  const tx=txAll.filter(t=>!since||t.at>=since);
  const prevTx=since?txAll.filter(t=>t.at>=since-days*RPT_DAY&&t.at<since):[];

  const cyc=rptCycle(tx), cycPrev=rptCycle(prevTx);
  const medCycle=rptMed(cyc.map(c=>c.days));
  const medCyclePrev=rptMed(cycPrev.map(c=>c.days));
  const fpy=rptYield(tx);
  const sav=rptSavings(rows);
  const comm=rptCommitted(rows);
  const turn=rptTurnaround(db,txAll).filter(t=>ids[t.pid]);
  const medTurn=rptMed(turn.map(t=>t.hours));
  const dwell=rptDwell(tx,now);
  const sup=rptSuppliers(db,rows);

  /* On-time is against the date intake committed to, which is the only promise on record. */
  const onTime=(()=>{
    const done=cyc.map(c=>({c,p:ids[c.pid]})).filter(x=>x.p&&x.p.target&&x.p.target!=="\u2014");
    if(!done.length) return null;
    const hit=done.filter(x=>{const t=Date.parse(x.p.target); return isFinite(t)?x.c.at<=t+RPT_DAY:false;}).length;
    return {pct:hit/done.length*100,n:done.length};
  })();

  const slaOpen=(()=>{const seen={},out=[];ROLE_REGISTRY.forEach(r=>tasksFor(r.id,db).forEach(t=>{
    const k=(t.pid||"")+"|"+(t.title||""); if(seen[k]||!ids[t.pid])return; seen[k]=1;
    out.push({...t,role:r.label});}));return out;})();
  const breaching=slaOpen.filter(t=>t.h<=12);

  const pct=(a,b)=>(b==null||!b)?null:((a-b)/b*100);
  const delta=medCycle!=null&&medCyclePrev!=null?pct(medCyclePrev,medCycle):null; /* shorter is better */

  const phaseOrder=["Initiation","Approval","Vendor Dev","Sample Qual","PSW","Pilot","Closed"];
  const byPhase=phaseOrder.map(x=>({label:x,v:rows.filter(r=>r.phase===x).length,key:"phase",val:x}));
  const health=[
    {label:"In progress",v:rows.filter(x=>["p-blue","p-teal","p-gray"].indexOf(statusClass(x.status))>=0).length,color:"var(--blue)"},
    {label:"Pending",v:rows.filter(x=>statusClass(x.status)==="p-amber").length,color:"var(--amber)"},
    {label:"Blocked",v:rows.filter(x=>statusClass(x.status)==="p-red").length,color:"var(--red)"},
    {label:"Completed",v:rows.filter(x=>statusClass(x.status)==="p-green").length,color:"var(--green)"},
  ];
  /* Real launches per month, from the FAIR rows - not a constant. */
  const launches=(()=>{
    const m={},lbl=[];
    for(let i=5;i>=0;i--){const d=new Date(now-i*30*RPT_DAY);const k=d.toLocaleString("en",{month:"short"});lbl.push(k);m[k]=0;}
    cyc.forEach(c=>{const k=new Date(c.at).toLocaleString("en",{month:"short"}); if(m[k]!=null)m[k]++;});
    return lbl.map(k=>({label:k,v:m[k]}));
  })();

  const drillRows=drill?rows.filter(drill.test):[];
  const pick=(label,test)=>setDrill({label:label,test:test});

  const exportRows=async(name,aoa)=>{
    if(await ensureXlsx()){
      try{const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),"Report");
        XLSX.writeFile(wb,name+".xlsx"); return;}catch(e){}
    }
    const csv=aoa.map(r=>r.map(c=>{const v=String(c==null?"":c);
      return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\r\n");
    saveBlob(new Blob([csv],{type:"text/csv;charset=utf-8;"}),name+".csv");
  };
  const exportCurrent=()=>{
    if(tab==="suppliers") return exportRows("NPI_Supplier_Scorecard",
      [["Vendor","Parts","Projects","Samples","Passed","Rejected","Rework","Pass rate %"]]
      .concat(sup.map(v=>[v.vendor,v.parts,v.projects,v.samples,v.passed,v.rejected,v.rework,v.passRate==null?"":v.passRate.toFixed(0)])));
    if(tab==="cycle") return exportRows("NPI_Cycle_Time",
      [["Project","Days intake to FAIR"]].concat(cyc.map(c=>[c.pid,c.days.toFixed(1)])));
    if(tab==="sla") return exportRows("NPI_Open_Work",
      [["Project","Task","Owner role","Hours left"]].concat(slaOpen.map(t=>[t.pid,t.title,t.role,t.h])));
    return exportRows("NPI_Portfolio",
      [["Project","Title","Phase","Status","Plant","Owner","Target"]]
      .concat(rows.map(p=>[p.id,p.title,p.phase,p.status,p.plant,p.owner,p.target])));
  };

  const Sel=({v,set,opts,label})=><label className="rfilter"><span>{label}</span>
    <select value={v} onChange={e=>{set(e.target.value);setDrill(null);}}>
      {opts.map(o=><option key={o} value={o}>{o}</option>)}</select></label>;

  return <>
    <div className="pagehead"><h1>Reports</h1>
      <p>Every figure is derived from the audit trail and submitted forms &mdash; nothing here is a stored constant.</p></div>

    <div className="rbar">
      <label className="rfilter"><span>Period</span>
        <select value={period} onChange={e=>{setPeriod(e.target.value);setDrill(null);}}>
          {RPT_PERIODS.map(p=><option key={p[0]} value={p[0]}>{p[1]}</option>)}</select></label>
      <Sel label="Plant" v={fPlant} set={setPlant} opts={plants}/>
      <Sel label="Category" v={fCat} set={setCat} opts={cats}/>
      <Sel label="Phase" v={fPhase} set={setPhase} opts={phases}/>
      <Sel label="Owner" v={fOwner} set={setOwner} opts={owners}/>
      <button className="btn sm" onClick={()=>{setPeriod("all");setPlant("All");setCat("All");setPhase("All");setOwner("All");setDrill(null);}}>Reset</button>
      <span className="rspacer"/>
      <span className="rasat">{rows.length} of {all.length} projects &middot; as at {stampNow().slice(0,16).replace("T"," ")}</span>
      <button className="btn sm" onClick={exportCurrent}>Export</button>
    </div>

    <div className="rtabs">{RPT_TABS.map(t=>
      <button key={t[0]} className={"rtab"+(tab===t[0]?" on":"")} onClick={()=>{setTab(t[0]);setDrill(null);}}>{t[1]}</button>)}</div>

    {tab==="portfolio"?<>
      <div className="rtiles">
        <RTile k="Active projects" v={rows.filter(x=>x.phase!=="Closed").length} s={fPlant==="All"?"all plants":fPlant} ic="ic-teal" icon="projects"
          onClick={()=>pick("Active projects",x=>x.phase!=="Closed")}/>
        <RTile k="On-time vs target" v={onTime?onTime.pct.toFixed(0)+"%":null} target={RPT_TARGETS.onTime}
          s={onTime?onTime.n+" released against an intake date":"no project has reached FAIR yet"} ic="ic-green" icon="reports"/>
        <RTile k="Median cycle time" v={medCycle!=null?medCycle.toFixed(0)+"d":null} delta={delta}
          s={medCycle!=null?cyc.length+" intake \u2192 FAIR":"needs one completed project"} ic="ic-blue" icon="clock"/>
        <RTile k="Blocked / breaching" v={breaching.length} warn={breaching.length>0} ic="ic-red" icon="clock"
          s={breaching.length?"tasks under 12h":"nothing breaching"}
          onClick={()=>pick("Projects with a breaching task",x=>breaching.some(t=>t.pid===x.id))}/>
        <RTile k="Annualised saving" v={sav?money(sav.saving,"USD"):null} ic="ic-amber" icon="reports"
          s={sav?"from "+sav.projects+" priced quote(s)":"no F-02 quote submitted yet"}/>
      </div>
      <div className="chart-cols">
        <RPanel title="Projects by phase" sub="Click a bar to list the projects in it.">
          <Chart2 type="bar" height={260} labels={byPhase.map(d=>d.label)}
            series={[{label:"Projects",data:byPhase.map(d=>d.v)}]}
            onPick={i=>pick("Phase: "+byPhase[i].val,x=>x.phase===byPhase[i].val)}/></RPanel>
        <RPanel title="Portfolio health" sub="By the status each project is sitting at.">
          <Chart2 type="doughnut" height={260} labels={health.map(d=>d.label)}
            series={[{data:health.map(d=>d.v),colors:health.map(d=>d.color)}]}/></RPanel>
      </div>
      <RPanel title="Launches per month" sub="Counted from the FAIR Released rows in the audit trail."
        right={<RSpark data={launches.map(l=>l.v)}/>}>
        {cyc.length?<Chart2 type="line" height={240} labels={launches.map(l=>l.label)}
          series={[{label:"Released",data:launches.map(l=>l.v)}]}/>
          :RNEED("No project has reached FAIR Released yet, so there is nothing to count.")}
      </RPanel>
    </>:null}

    {tab==="cycle"?<>
      <div className="rtiles">
        <RTile k="Median cycle time" v={medCycle!=null?medCycle.toFixed(0)+"d":null} delta={delta}
          s={medCycle!=null?"across "+cyc.length+" project(s)":"needs one completed project"} ic="ic-blue" icon="clock"/>
        <RTile k="Fastest" v={cyc.length?Math.min.apply(null,cyc.map(c=>c.days)).toFixed(0)+"d":null} s="intake to FAIR" ic="ic-green" icon="clock"/>
        <RTile k="Slowest" v={cyc.length?Math.max.apply(null,cyc.map(c=>c.days)).toFixed(0)+"d":null} s="intake to FAIR" ic="ic-amber" icon="clock"/>
        <RTile k="Median approver wait" v={medTurn!=null?(medTurn<48?medTurn.toFixed(0)+"h":(medTurn/24).toFixed(1)+"d"):null}
          target={RPT_TARGETS.turnaround} s={medTurn!=null?turn.length+" recommendation(s)":"no recommendation decided yet"} ic="ic-teal" icon="approvals"/>
      </div>
      <RPanel title="Where the time goes" sub="Median days spent at each status, from the audit trail. Open items are measured to now.">
        {(()=>{const by={};dwell.forEach(d=>{(by[d.status]=by[d.status]||[]).push(d.days);});
          const data=Object.keys(by).map(k=>({label:k,v:rptMed(by[k]),n:by[k].length,
            color:rptIsRework(k)?CHART_BAD():CHART_OK})).sort((a,b)=>b.v-a.v).slice(0,12);
          return data.length?<Chart2 type="bar" horizontal height={Math.max(240,data.length*34)}
            unit="d" labels={data.map(d=>d.label)}
            series={[{label:"Median days",data:data.map(d=>d.v),colors:data.map(d=>d.color)}]}
            onPick={i=>pick("At "+data[i].label,x=>x.status===data[i].label)}/>
            :RNEED("No project has moved through a status inside this period.");})()}
      </RPanel>
      <RPanel title="Approver turnaround" sub="From the member's recommendation to the head's decision \u2014 the wait that is a person, not a process.">
        {(()=>{const by={};turn.forEach(t=>{const k=(t.by||"a head")+" \u00b7 "+t.form;(by[k]=by[k]||[]).push(t.hours);});
          const data=Object.keys(by).map(k=>({label:k,v:rptMed(by[k]),
            color:rptMed(by[k])>96?CHART_BAD():rptMed(by[k])>48?CHART_WARN():CHART_GOOD()}))
            .sort((a,b)=>b.v-a.v);
          return data.length?<Chart2 type="bar" horizontal height={Math.max(220,data.length*36)}
            unit="h" labels={data.map(d=>d.label)}
            series={[{label:"Median wait",data:data.map(d=>d.v),colors:data.map(d=>d.color)}]}/>
            :RNEED("No recommendation has been decided yet.");})()}
      </RPanel>
      <RPanel title="Ageing work in progress" sub="Open items, longest wait first.">
        {(()=>{const open=dwell.filter(d=>d.open).sort((a,b)=>b.days-a.days).slice(0,12)
            .map(d=>({label:d.pid+(d.group?" \u00b7 "+d.group:"")+" \u2014 "+d.status,v:d.days,
              color:d.days>21?CHART_BAD():d.days>7?CHART_WARN():CHART_OK}));
          return open.length?<Chart2 type="bar" horizontal unit="d" height={Math.max(220,open.length*32)}
            labels={open.map(d=>d.label)}
            series={[{label:"Days open",data:open.map(d=>d.v),colors:open.map(d=>d.color)}]}/>
            :RNEED("Nothing is open in this period.");})()}
      </RPanel>
    </>:null}

    {tab==="quality"?<>
      <div className="rtiles">
        <RTile k="First-pass yield" v={fpy.pct!=null?fpy.pct.toFixed(0)+"%":null} target={RPT_TARGETS.fpy}
          s={fpy.pct!=null?fpy.clean+" of "+fpy.n+" group(s) with no rework":"no group has reached the trial yet"} ic="ic-green" icon="samples"/>
        <RTile k="Rework events" v={tx.filter(t=>rptIsRework(t.to)).length} s="rejections, repeats and returns" ic="ic-red" icon="clock"/>
        <RTile k="Groups in flight" v={rows.reduce((a,p)=>a+liveTracks(p).length,0)} s="tracks currently open" ic="ic-teal" icon="samples"/>
        <RTile k="Projects with rework" v={Array.from(new Set(tx.filter(t=>rptIsRework(t.to)).map(t=>t.pid))).length}
          s={"of "+rows.length+" in view"} ic="ic-amber" icon="projects"
          onClick={()=>{const bad=new Set(tx.filter(t=>rptIsRework(t.to)).map(t=>t.pid));pick("Projects with rework",x=>bad.has(x.id));}}/>
      </div>
      <RPanel title="What went backwards" sub="Every reverse move in the period, by kind.">
        {(()=>{const by={};tx.filter(t=>rptIsRework(t.to)).forEach(t=>{const k=RPT_REWORK[t.to]||t.to;by[k]=(by[k]||0)+1;});
          const data=Object.keys(by).map(k=>({label:k,v:by[k]})).sort((a,b)=>b.v-a.v);
          return data.length?<Chart2 type="bar" horizontal height={Math.max(200,data.length*40)}
            labels={data.map(d=>d.label)}
            series={[{label:"Events",data:data.map(d=>d.v),color:CHART_BAD()}]}/>
            :<div className="rempty"><b>No rework recorded.</b><br/>Nothing has been rejected, repeated or returned in this period.</div>;})()}
      </RPanel>
      <div className="chart-cols">
        <RPanel title="Sample outcomes" sub="From the Samples list.">
          {(()=>{const s=db.samples||[];const g=(r)=>s.filter(x=>x.result===r&&ids[x.pid]).length;
            const data=[{label:"Approved",v:g("Approved"),color:"var(--green)"},{label:"Conditional",v:g("Conditional"),color:"var(--amber)"},
              {label:"Rejected",v:g("Rejected"),color:"var(--red)"},{label:"Pending",v:g("Pending"),color:"var(--panel2)"}];
            return data.some(d=>d.v)?<Chart2 type="doughnut" height={250} labels={data.map(d=>d.label)}
              series={[{data:data.map(d=>d.v),colors:data.map(d=>d.color)}]}/>
              :<div className="rempty">No samples recorded for this filter.</div>;})()}
        </RPanel>
        <RPanel title="PPAP submission level" sub="From the F-10 warrants raised.">
          {(()=>{const by={};rows.forEach(p=>{
              const one=(w)=>{const L=w&&w.ppapLevel; if(L)by[L]=(by[L]||0)+1;};
              one(p.psw); tracksOf(p).forEach(t=>one(t.psw));});
            const data=Object.keys(by).sort().map(k=>({label:k,v:by[k]}));
            return data.length?<Chart2 type="doughnut" height={250} labels={data.map(d=>d.label)}
              series={[{data:data.map(d=>d.v)}]}/>:RNEED("No warrant has been raised yet.");})()}
        </RPanel>
      </div>
    </>:null}

    {tab==="suppliers"?<>
      <div className="rtiles">
        <RTile k="Vendors in view" v={sup.length} s="holding at least one part" ic="ic-teal" icon="vendors"/>

/* The CurrencyConversions list, editable in place. Reference data with no state machine to
   satisfy, so it is written straight to the list rather than through the command bus - with an
   audit row, because a rate change re-prices every open business case and "who changed it" is
   the question that gets asked afterwards. */
function Currency({onAct}){
  const {db,act,can,roleKey,flash,confirm}=useApp();
  const rates=db.rates||[];
  const [q,setQ]=useState("");
  const [edit,setEdit]=useState(null);
  const [adding,setAdding]=useState(null);
  const [busy,setBusy]=useState(false);
  const writable=navMode(roleKey,"currency")==="w";
  const shown=rates.filter(r=>!q.trim()||(r.code+" "+r.name).toLowerCase().indexOf(q.trim().toLowerCase())>=0);
  const start=(r)=>setEdit({...r});
  /* FxMultiply and UsdRate are two views of one rate and the app converts on FxMultiply, so
     editing one without the other leaves a row whose displayed rate and applied rate disagree.
     Whichever is typed, the other is derived from the row's own convention. */
  const syncFrom=(field,val)=>{
    const v=parseFloat(val);
    setEdit(e=>{
      const nx={...e,[field]:val};
      if(!isFinite(v)||v<=0) return nx;
      if(field==="fx")      nx.usdRate = e.conv==="I" ? +(1/v).toFixed(6) : +v.toFixed(6);
      if(field==="usdRate") nx.fx      = e.conv==="I" ? +(1/v).toFixed(9) : +v.toFixed(9);
      return nx;
    });
  };
  const addSave=async()=>{
    setBusy(true);
    const r=await act.addRate(adding);
    setBusy(false);
    if(r&&r.ok){ flash("Added "+String(adding.code).toUpperCase()); setAdding(null); }
    else flash((r&&r.message)||"Could not add that currency");
  };
  const remove=(row)=>confirm({
    title:"Remove "+row.code+"?",
    message:"This deletes the row from CurrencyConversions. Parts already priced in "+row.code+" keep the USD figure and the rate they were converted at - only future conversions lose it.",
    confirmLabel:"Remove "+row.code, tone:"danger",
    onConfirm:async()=>{ const r=await act.deleteRate(row);
      flash(r&&r.ok?"Removed "+row.code:((r&&r.message)||"Could not remove that currency")); }});
  const RATE_COLS=["Code","Name","Convention","USD per unit","Quoted rate","INR per unit","As of"];
  /* The list as a workbook, and back again. The plant keeps rates in Excel and retyping six
     numbers by hand is where a decimal point goes missing. */
  const exportRates=async()=>{
    const aoa=[RATE_COLS].concat(rates.map(r=>[r.code,r.name,
      r.conv==="I"?"Indirect — units per USD":"Direct — USD per unit",
      r.fx,r.usdRate,r.inr,r.asOf||""]));
    if(await ensureXlsx()){
      try{
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),"Currency rates");
        XLSX.writeFile(wb,"NPI_Currency_Rates.xlsx");
        flash("Exported "+rates.length+" rate(s)");
        return;
      }catch(e){}
    }
    const csv=aoa.map(r=>r.map(c=>{const v=String(c==null?"":c);
      return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\r\n");
    saveBlob(new Blob([csv],{type:"text/csv;charset=utf-8;"}),"NPI_Currency_Rates.csv");
    flash("Exported "+rates.length+" rate(s) as CSV");
  };
  /* A row updates the currency with that code and adds it when there is none. Applied one at a
     time through the same saveRate/addRate the form uses, so the validation and the audit are
     identical whether a rate is typed or imported. */
  /* INR per unit is a derived figure that the sheet carries for reading. Someone who edits
     only USD per unit would otherwise import a row whose INR column still holds the old
     number, so it is recomputed unless the sheet itself changed it. */
  const inrPerUsd=()=>{const i=rates.find(x=>(x.code||"").toUpperCase()==="INR");
    return parseFloat(i&&i.usdRate)||88.728003;};
  const withInr=(row,cur)=>{
    const fx=parseFloat(row.fx), typed=parseFloat(row.inr);
    const kept=cur&&isFinite(typed)&&Math.abs(typed-(parseFloat(cur.inr)||0))>1e-9;
    if(kept||!isFinite(fx)) return row;
    return {...row,inr:row.code==="INR"?1:+(fx*inrPerUsd()).toFixed(6)};
  };
  const applyImport=async(rows)=>{
    setBusy(true);
    let saved=0,added=0,failed=[];
    for(const raw of rows){
      const cur=rates.find(x=>(x.code||"").toUpperCase()===raw.code);
      const row=withInr(raw,cur);
      const r=cur?await act.saveRate({...cur,...row}):await act.addRate(row);
      if(r&&r.ok){ cur?saved++:added++; } else failed.push(row.code+(r&&r.message?" ("+r.message+")":""));
    }
    setBusy(false);
    flash(saved+" updated, "+added+" added"+(failed.length?" · failed: "+failed.join(", "):""));
  };
  const importRates=async(e)=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    e.target.value="";
    const parse=(aoa)=>aoa.map(c=>c.map(x=>String(x==null?"":x).trim()))
      .filter((c,i)=>c[0]&&!(i===0&&/^code$/i.test(c[0])))
      .map(c=>({code:c[0].toUpperCase(),name:c[1]||"",
        conv:/^i/i.test(c[2]||"")?"I":"D",fx:c[3]||"",usdRate:c[4]||"",inr:c[5]||"",
        asOf:c[6]||new Date().toISOString().slice(0,10)}))
      .filter(r=>parseFloat(r.fx)>0)
      /* One code twice in a sheet is a copy-paste, not two currencies. The last row wins. */
      .filter((r,i,a)=>a.map(x=>x.code).lastIndexOf(r.code)===i);
    const rows=await new Promise((resolve)=>{
      const rd=new FileReader();
      if(/\.csv$/i.test(f.name)){
        rd.onload=ev=>resolve(parse(String(ev.target.result||"").split(/\r?\n/)
          .filter(l=>l.trim()).map(l=>l.split(l.indexOf("\t")>=0?"\t":","))));
        rd.readAsText(f);
      } else {
        rd.onload=async ev=>{
          if(!(await ensureXlsx())) { resolve([]); return; }
          try{
            const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
            resolve(parse(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false,defval:""})));
          }catch(err){ resolve([]); }
        };
        rd.readAsArrayBuffer(f);
      }
    });
    if(!rows.length){ flash("No usable rows in "+f.name+" — the file needs the exported columns with a positive USD per unit"); return; }
    /* A rate change re-prices every open business case, so an import is confirmed, never silent. */
    confirm({title:"Import "+rows.length+" rate(s)?",
      message:rows.map(r=>r.code+" "+r.fx).join(", ")+". Rates already on the list are updated and new codes are added. Every open business case is re-priced at the new rates.",
      confirmLabel:"Import "+rows.length+" rate(s)",tone:"",onConfirm:()=>applyImport(rows)});
  };
  const save=async()=>{
    const fx=parseFloat(edit.fx);
    if(!isFinite(fx)||fx<=0){flash("USD per unit must be a positive number");return;}
    setBusy(true);
    const r=await act.saveRate(edit);
    setBusy(false);
    if(r&&r.ok){ setEdit(null); flash("Saved "+edit.code+" \u2014 1 "+edit.code+" = "+fx+" USD"); }
    else flash((r&&r.message)||"Could not save that rate");
  };
  return <>
    <div className="pagehead"><h1>Currency Rates</h1>
      <p>The CurrencyConversions list. Every part price is stored in USD using <b>USD per unit</b>, so a change here re-prices every open business case.</p></div>
    <div className="block">
      <div className="block-h"><h2>Rates <span className="cnt">{shown.length}{q?" of "+rates.length:""}</span></h2>
        <span className="tmeta" style={{marginLeft:"auto",marginRight:14}}>{rates.length?"As of "+(rates[0].asOf||"\u2014"):"Loading\u2026"}</span>
        <button className="btn sm" style={{marginRight:8}} onClick={exportRates}>Export Excel</button>
        {writable?<label className="btn sm" style={{position:"relative",overflow:"hidden",cursor:"pointer",marginRight:8}}>Import Excel
          <input type="file" accept=".xlsx,.xls,.csv" onChange={importRates}
                 style={{position:"absolute",inset:0,opacity:0,cursor:"pointer"}}/></label>:null}
        {writable?<button className="admin-add" onClick={()=>setAdding({code:"",name:"",conv:"D",fx:"",usdRate:"",inr:"",asOf:new Date().toISOString().slice(0,10)})}>+ Add currency</button>:null}</div>
      {!spx()?<div className="modal-note" style={{margin:"0 14px 12px"}}>Running on sample data — {rates.length} rates. Against SharePoint this reads the whole CurrencyConversions list.</div>:null}
      <div className="dt-tools"><div className="dt-search"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Find a currency\u2026"/></div></div>
      <div className="dt-wrap"><table className="dt-table">
        <thead><tr><th>Code</th><th>Name</th><th>Convention</th><th>USD per unit</th><th>Quoted rate</th><th>INR per unit</th><th>As of</th>{writable?<th/>:null}</tr></thead>
        <tbody>
          {adding?<tr>
            <td><input className="rateinp" value={adding.code} maxLength={3} placeholder="SGD" onChange={e=>setAdding({...adding,code:e.target.value.toUpperCase()})}/></td>
            <td><input className="rateinp" value={adding.name} placeholder="Singapore Dollar" onChange={e=>setAdding({...adding,name:e.target.value})}/></td>
            <td><select className="rateinp" value={adding.conv} onChange={e=>setAdding({...adding,conv:e.target.value})}>
                  <option value="D">Direct — USD per unit</option>
                  <option value="I">Indirect — units per USD</option></select></td>
            <td><input className="rateinp" value={adding.fx} placeholder="0.78" onChange={e=>setAdding({...adding,fx:e.target.value})}/></td>
            {/* Left blank it is derived from the convention on save, so the two can never
                disagree just because someone filled in one box and not the other. */}
            <td><input className="rateinp" value={adding.usdRate} placeholder="derived" onChange={e=>setAdding({...adding,usdRate:e.target.value})}/></td>
            <td><input className="rateinp" value={adding.inr} placeholder="optional" onChange={e=>setAdding({...adding,inr:e.target.value})}/></td>
            <td><input className="rateinp" type="date" value={adding.asOf} onChange={e=>setAdding({...adding,asOf:e.target.value})}/></td>
            <td><span style={{display:"flex",gap:6}}>
              <button className="btn sm primary" disabled={busy} onClick={addSave}>{busy?"Adding\u2026":"Add"}</button>
              <button className="btn sm" disabled={busy} onClick={()=>setAdding(null)}>Cancel</button></span></td>
          </tr>:null}
          {shown.length?shown.map(r=>{
            const on=edit&&edit._id===r._id;
            return <tr key={r._id}>
              <td className="tpid">{r.code}</td>
              <td className="tcell">{r.name}</td>
              {/* D quotes USD per unit, I quotes units per USD - spelled out because the two
                  read identically as a bare number and mean opposite things. */}
              <td className="tmeta">{r.conv==="I"?"Indirect \u2014 units per USD":"Direct \u2014 USD per unit"}</td>
              <td>{on?<input className="rateinp" value={edit.fx} onChange={e=>syncFrom("fx",e.target.value)}/>:<b>{r.fx}</b>}</td>
              <td className="tmeta">{on?<input className="rateinp" value={edit.usdRate} onChange={e=>syncFrom("usdRate",e.target.value)}/>:r.usdRate}</td>
              <td className="tmeta">{on?<input className="rateinp" value={edit.inr} onChange={e=>setEdit({...edit,inr:e.target.value})}/>:r.inr}</td>
              <td className="tmeta">{on?<input className="rateinp" type="date" value={edit.asOf} onChange={e=>setEdit({...edit,asOf:e.target.value})}/>:(r.asOf||"\u2014")}</td>
              {writable?<td>{on
                ? <span style={{display:"flex",gap:6}}>
                    <button className="btn sm primary" disabled={busy} onClick={save}>{busy?"Saving\u2026":"Save"}</button>
                    <button className="btn sm" disabled={busy} onClick={()=>setEdit(null)}>Cancel</button></span>
                : <span style={{display:"flex",gap:6}}>
                    <button className="btn sm" onClick={()=>start(r)}>Edit</button>
                    <button className="btn sm no" title={"Remove "+r.code} onClick={()=>remove(r)}>Remove</button>
                  </span>}</td>:null}
            </tr>;
          }):<tr><td className="dt-empty" colSpan={writable?8:7}>{rates.length?"No currency matches that.":"Rates have not loaded."}</td></tr>}
        </tbody>
      </table></div>
    </div>
  </>;
}

/* FormModal cannot carry a file, and a document upload without one is the bug this replaces.
   The category list prefers what the library already uses: DocumentCategory is a Choice
   column, and offering a value it does not carry writes a file the metadata then bounces off. */
function UploadDocModal({projects,known,onClose,onSubmit}){
  const TYPES=known&&known.length?known:["AEF","Quote","Drawing","Feasibility","Sample receipt","SQE report","PSW","IQC"];
  const [file,setFile]=useState(null);
  const [pid,setPid]=useState("");
  const [type,setType]=useState(TYPES[0]);
  const [err,setErr]=useState("");
  const submit=()=>{
    if(!file){setErr("Choose a file to upload.");return;}
    if(!pid.trim()){setErr("Project ID is required - it decides the folder the file lands in.");return;}
    onSubmit({file:file,name:file.name,pid:pid.trim(),type:type,part:"—"});
  };
  return <Modal title="Upload document" onClose={onClose}>
    <div className="modal-note">The file is written to the site's <b>ProjectDocuments</b> library, into a folder named after the project. It appears in this list once SharePoint has it.</div>
    <div className="form-grid" style={{marginTop:14}}>
      <div className="field2 full"><div className="flabel">File <i>*</i></div>
        <input type="file" onChange={e=>{setFile((e.target.files||[])[0]||null);setErr("");}}/>
        {file?<div className="impfile">{file.name} · {Math.max(1,Math.round(file.size/1024))} KB</div>:null}</div>
      <div className="field2"><div className="flabel">Project ID <i>*</i></div>
        <input list="dl-upl-pid" value={pid} onChange={e=>setPid(e.target.value)} placeholder="NPI-2026-…"/>
        <datalist id="dl-upl-pid">{(projects||[]).map(p=><option key={p.id} value={p.id}/>)}</datalist></div>
      <div className="field2"><div className="flabel">Type <i>*</i></div>
        <select value={type} onChange={e=>setType(e.target.value)}>
          {TYPES.map(o=><option key={o} value={o}>{o}</option>)}</select></div>
    </div>
    {err?<div className="form-err">{err}</div>:null}
    <div className="modal-f"><button className="btn" onClick={onClose}>Cancel</button>
      <button className="btn primary" onClick={submit}>Upload</button></div>
  </Modal>;
}
