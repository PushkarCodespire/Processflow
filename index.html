/* ---------- project timeline ----------
   Every decision the platform records leaves an audit row; where that decision
   came from a form, the values behind it are still on the project. The timeline
   joins the two so a gate shows not just "approved" but who, when, why, and the
   numbers they were looking at. */
const evTone=a=>{const s=String(a||"").toLowerCase();
  if(/reject|return|no-go|denied|dropped|breach|not ok|failed|quarantine/.test(s))return "no";
  if(/hold|conditional|reminder|escalat/.test(s))return "wait";
  if(/approv|submitted|created|completed|raised|recorded|confirm|released|delivered|\bgo\b|logged|uploaded|replied|signed|closed/.test(s))return "ok";
  return "info";};
const evGlyph=t=>t==="ok"?"✓":t==="no"?"✕":t==="wait"?"!":"•";
const formIdOf=a=>{const m=String(a||"").match(/^F-[0-9A-Za-z]+(?:-[0-9A-Za-z]+)?/);return m&&FORM_SPECS[m[0]]?m[0]:null;};
/* the values captured on a form submission, labelled the way the form labelled them */
function capturedFields(p,formId){
  const spec=FORM_SPECS[formId],vals=p&&p.form&&p.form[formId];
  if(!spec||!vals)return [];
  const out=[];
  spec.sections.forEach(sec=>sec.fields.forEach(f=>{
    const v=vals[f.k];
    if(f.type==="file")return;   /* it appears as its own attachment event instead */
    if(f.type==="ref") return;
    if(f.type==="partsgrid"){ out.push([f.label,quoteToRows(v).length+" part(s) priced"]); return; }
    if(f.type==="samplegrid"){ const rr=sampleGridRows(v).filter(r=>r[3]);
      out.push([f.label,rr.map(r=>r[1]+" from "+r[0]+" on "+r[3]).join("; ")||"none received"]); return; }
    if(f.type==="notifygrid"){ const rr=notifyRows(v).filter(r=>r[0]);
      out.push([f.label,rr.map(r=>r[0]+" <"+r[3]+"> by "+r[4]).join("; ")||"none"]); return; }
    if(f.type==="sapgrid"){ const rr=sapRows(v);
      out.push([f.label,rr.filter(r=>r[2]).map(r=>r[0]+" PR "+r[2]+(r[3]?" x"+r[3]:"")+(r[4]?" / PO "+r[4]:"")).join("; ")||"none"]); return; }
    if(f.type==="vendorlist"){ out.push([f.label,vendorRows(v).filter(r=>r[0]).map(r=>r[0]+(r[1]?" ("+r[1]+")":"")+(r[2]?" <"+r[2]+">":"")).join("; ")||"none"]); return; }
    if(v==null||String(v).trim()==="")return;
    /* The form's own quote currency where it has one - a captured figure means nothing
       without the currency it was captured in. */
    out.push([f.label,f.type==="currency"?money(v,vals.currency):String(v)]);
  }));
  return out;
}
const auditOf=(audit,p)=>audit.filter(a=>{const e=String(a.entity||"");return e===p.id||e.indexOf(p.id+" /")===0;});

function FieldDrawer({label,fields}){

function GateItem({st,n,state,who,ev,fields,last,children,rec}){

/* The commercial case, straight off F-02: funding route, investment, the spend either side
   of the localisation, the saving and the vendor. Computed from the form rather than stored,
   so it cannot drift from what was actually submitted. */
/* The approval chain only ever covered the four F-02 gates, so a project past approval had
   nothing on screen saying where it actually was. This is the whole journey, in the same
   buckets Planner files the project into. The last three buckets are terminal or exception
   states rather than steps, so they are a destination, not part of the sequence. */
/* Computed inside the component, not at module scope: PLANNER_BUCKETS is declared further
   down the file, and a const evaluated at load time would hit its temporal dead zone and
   take the whole app down. */
const TERMINAL_BUCKETS=["Closed","Dropped","On Hold"];
function JourneyRail({p}){
  const [sel,setSel]=useState(null);
  const JOURNEY=PLANNER_BUCKETS.map(b=>b[0]).filter(b=>TERMINAL_BUCKETS.indexOf(b)<0);
  const here=bucketFor(p.status);
  const terminal=TERMINAL_BUCKETS.indexOf(here)>=0;
  const at=JOURNEY.indexOf(here);
  useEffect(()=>{setSel(here);},[here]);
  return <div className="block" style={{marginBottom:18}}>
    <div className="block-h"><h2>Project journey</h2>
      <span className="tmeta">{terminal?here:(at>=0?("step "+(at+1)+" of "+JOURNEY.length+" · "+here):here)}</span></div>
    <div className="panel-pad">
      <div className="jrail">
        {JOURNEY.map((b,i)=>{
          const st=terminal?(here==="Closed"?"done":"skip"):i<at?"done":i===at?"now":"next";
          return <div key={b} className={"jstep "+st+(sel===b?" open":"")} title={b}
                      onClick={()=>setSel(sel===b?null:b)}>
            <span className="jdot">{st==="done"?"✓":i+1}</span>
            <span className="jlab">{b}</span>
          </div>;
        })}
      </div>
      {/* A rail of names answers "where is it" and nothing else. Opening a stage answers the
         questions people actually have: who owns it, what they fill in, and whether it is an
         approval or a form. All of it read from the same tables that drive the work queues,
         so it cannot describe a process different from the one that runs. */}
      {sel?(()=>{
        const sts=(PLANNER_BUCKETS.find(x=>x[0]===sel)||[null,[]])[1];
        const rows=[];
        sts.forEach(stt=>{
          const defs=STATUS_TASKS[stt];
          const step=APPROVAL_STEPS.find(x=>x.at===stt);
          (defs?(Array.isArray(defs)?defs:[defs]):[]).forEach(r=>rows.push({stt,r,step}));
          if(!defs) rows.push({stt,r:null,step});
        });
        return <div className="jdetail">
          <div className="jdhead"><b>{sel}</b>
            <span className="tmeta">{sel===here?"current stage":sts.length+" status"+(sts.length===1?"":"es")}</span></div>
          <table className="dt-table"><thead><tr>
            <th>Status</th><th>What happens</th><th style={{width:"130px"}}>Form</th>
            <th style={{width:"150px"}}>Who</th><th style={{width:"110px"}}>Type</th>
          </tr></thead><tbody>
            {rows.length?rows.map((x,i)=><tr key={i} className={x.stt===p.status?"jnow":""}>
              <td className="tcell">{statusLabel(x.stt)}{x.stt===p.status?<span className="mchip" style={{marginLeft:6}}>here</span>:null}</td>
              <td>{x.r?x.r.title:"—"}</td>
              <td className="tmeta">{x.r&&x.r.form?x.r.form:(x.step&&x.step.form?x.step.form:"—")}</td>
              <td className="tmeta">{x.r&&x.r.roles?x.r.roles.map(rr=>(ROLE[rr]||{}).label||rr).join(", ")
                                      :(x.step?(ROLE[x.step.role]||{}).label:"—")}</td>
              <td className="tmeta">{x.step&&!x.step.formOnly?("Approval · "+((ROLE[x.step.role]||{}).label||""))
                                      :x.r&&x.r.form?"Form":x.r?(x.r.act||"Task"):"—"}</td>
            </tr>):<tr><td className="dt-empty" colSpan={5}>Nothing is modelled against this stage.</td></tr>}
          </tbody></table>
        </div>;
      })():null}
      {terminal?<div className="modal-note" style={{marginTop:12}}>This project is <b>{here}</b>.</div>:null}
    </div>
  </div>;
}

/* The commercial case, from whichever record holds it. Submitting F-02 in this session
   leaves the values on the project in memory; a reload has only what SharePoint stores, and
   that is HubSummaryJSON - so a project read back from the list has to be able to rebuild the
   case from its summary, or the whole block collapses to the vendor name after every refresh.
   Summary amounts are rupees, which is what money() assumes. */
function caseCellsFor(p){
  const f02=p&&p.form&&p.form["F-02"];
  const calc=f02&&FORM_SPECS["F-02"].computed?FORM_SPECS["F-02"].computed(f02):null;
  const s=(p&&p.summary)||{}, sf=s.f02||{}, sc=s.f02c||{};
  const decided=p.routingDecision||sc.route, route=decided||p.routingSuggestion||sf.route;
  const invest=p.totalInvestment!=null?p.totalInvestment:(sf.invest!=null?sf.invest:null);
  const tone=v=>v==null?"":v>=0?"good":"bad";
  const fromSummary=(sf.spend!=null||sf.nspend!=null||sf.save!=null)?[
    {k:"Current annual spend",v:money(sf.spend)},
    {k:"New annual spend",v:money(sf.nspend)},
    {k:"Annual saving",v:money(sf.save),tone:tone(sf.save)},
    {k:"Payback period",v:paybackLabel(sf.invest,sf.save),tone:tone(sf.save)}]:[];
  return [].concat(
    route?[{k:"Funding route",v:route+(decided?"":" (suggested)")}]:[],
    invest!=null?[{k:"Investment",v:money(invest)}]:[],
    calc||fromSummary,
    (p.supplier&&p.supplier!=="—")?[{k:"Recommended vendor",v:p.supplier}]:[]);
}

function ChainView({p}){
  const {db,roleKey,me,act,confirm,openForm,openModal,closeModal}=useApp();
  const pos=chainPos(p);
  const CH=fullChain();
  const returned=pos===-2;
  const preChain=["Feasibility Review","Held"].indexOf(p.status)>=0;
  /* Always rendered. A project between gates still has a chain worth seeing - hiding it was
     only tolerable while position was inferred and every project appeared to be on a gate. */
  /* One gate also classifies the funding. Asking for it here keeps the decision and the
     classification in the same act - the Finance Head cannot approve without saying which. */
  const decide=(st)=>openModal(<FormModal title={st.id+" — approve "+p.id}
    note={st.route?"The funding route decides what follows: F-03c for Capex, F-03o for Opex.":
      "Approving "+st.label.toLowerCase()+" writes an audit entry and moves the project on."}
    fields={(st.route?[{key:"route",label:"Approve as",type:"select",req:true,options:["Capex","Opex"]}]:[])
      .concat([{key:"comment",label:"Approval comments",type:"textarea",full:true,
                ph:"Why this is approved - the basis, any condition. Optional."}])}
    submitLabel="Approve" onClose={closeModal}
    onSubmit={v=>{act.decideGate(p,st,"Approved",v.comment||"",v.route||"");closeModal();}}/>);
  const ret=(st)=>openModal(<FormModal title={"Return "+p.id+" to Sourcing"}
    fields={[{key:"reason",label:"Reason for returning",req:true,type:"textarea",full:true,ph:"What has to change before this can be approved…"}]}
    submitLabel="Return to Sourcing" onClose={closeModal}
    onSubmit={v=>{act.decideGate(p,st,"Returned",v.reason);closeModal();}}/>);
  /* the gate's own audit row, if the decision has already been taken */
  const rows=auditOf(db.audit,p);
  const auditFor=id=>rows.find(a=>String(a.action||"").indexOf(id+" ")===0);
  /* Evidence, not position: a tick means this gate has an audit row of its own. */
  const doneCount=CH.filter(s=>auditFor(s.id)).length;
  const complete=doneCount===CH.length;
  return <div className="block" style={{marginBottom:18}}>
    <div className="block-h">
      <h2><Icon n="approvals" cls="" style={{width:16,height:16,color:"var(--teal)"}}/> Approval chain
        <span className="cnt">{complete?"complete":returned?"returned":doneCount?(doneCount+" of "+CH.length+" decided"):"not started"}</span></h2>
      {p.routingDecision?<span className="mchip">{p.routingDecision}</span>:null}
    </div>
    <div className="panel-pad">
      {returned?<div className="roform" style={{marginBottom:14}}><b>Returned to Sourcing.</b> The chain restarts at the Sourcing Head gate once F-02 is revised and resubmitted.</div>:null}
      <div className="tl">
        {CH.map((st,i)=>{
          /* ok only with an audit row; now only when the project is actually sitting on it. */
          const state=returned?"no":auditFor(st.id)?"ok":(st.ats.indexOf(p.status)>=0?"now":"next");
          const who=(p.approvers&&p.approvers[st.who])||personFor(st.role);
          const ev=state==="ok"?auditFor(st.id):null;
          const rec=(st.approver&&p.recommendation&&p.recommendation.form===st.id)?p.recommendation:null;
          const awaitingApprover=!!(st.approver&&rec);
          const mineMember=state==="now"&&!awaitingApprover&&(roleKey===st.role||who===me);
          const mineApprover=state==="now"&&awaitingApprover&&roleKey===st.approver;
          return <GateItem key={st.id} st={st} n={i+1} state={state} who={who} ev={ev}
            rec={state==="now"?rec:null}
            fields={st.form?capturedFields(p,st.form):[]} last={i===CH.length-1}>
            {mineMember&&st.ok? (st.form
              ? <div className="tl-actions"><button className="btn primary sm" onClick={()=>openForm(st.form,p.id)}>Open {st.id}</button></div>
              : <div className="tl-actions">
                  <button className="btn ok sm" onClick={()=>decide(st)}>Approve</button>
                  <button className="btn no sm" onClick={()=>ret(st)}>Return to Sourcing</button>
                </div>) : null}
            {mineMember&&!st.ok&&st.form?<div className="tl-actions">
              <button className="btn primary sm" onClick={()=>openForm(st.form,p.id)}>Open {st.id}</button>
            </div>:null}
            {mineApprover?<div className="tl-actions">
              <button className="btn ok sm" onClick={()=>decide(st)}>Approve recommendation</button>
              <button className="btn no sm" onClick={()=>ret(st)}>Return to Sourcing</button>
            </div>:null}
          </GateItem>;
        })}
      </div>
    </div>
  </div>;
}
/* A document row rendered as a timeline event. Sorting is on the same ts string the audit
   rows use, so the two interleave correctly instead of clumping at one end. */
/* The two sources stamp time differently - "2026-09-08 09:33:41Z" from the audit log and
   "06 Sep 2026" from the library - and comparing those as strings puts every document first
   regardless of its date. Date.parse reads both once the audit form is ISO-ified. */
const evWhen=t=>{const raw=String(t||"");
  const n=Date.parse(raw.replace(" ","T"));
  return isFinite(n)?n:(Date.parse(raw)||0);};
const docEvents=(docs,p)=>(docs||[])
  .filter(d=>d.pid===p.id)
  .map(d=>({ts:String(d.date||""), actor:d.by||"—", role:"Attachment",
             action:"Attachment \u00b7 "+(d.type||"Document"), entity:p.id,
             detail:d.size&&d.size!=="\u2014"?d.size:"", comment:"\u2014", _doc:d}));

const auditOfPart=(audit,pid,part)=>audit.filter(a=>String(a.entity||"")===pid+" / "+part);

/* A part's own history: its audit rows, plus any document filed against it. Project-level
   decisions are deliberately NOT folded in - a part page that repeats every project gate
   stops being a part page. The project timeline is one click away for that. */
function PartHistory({pid,part}){
  const {db}=useApp();
  const events=auditOfPart(db.audit,pid,part)
    .concat((db.docs||[]).filter(d=>d.pid===pid&&d.part===part)
      .map(d=>({ts:String(d.date||""),actor:d.by||"—",role:"Attachment",
                action:"Attachment · "+(d.type||"Document"),entity:pid+" / "+part,
                detail:d.size&&d.size!=="—"?d.size:"",comment:"—",_doc:d})))
    .slice()
    .sort((a,b)=>{const ka=evWhen(a.ts),kb=evWhen(b.ts);return ka===kb?(a._doc?1:-1):(ka-kb);});
  return <div className="block" style={{marginBottom:18}}>
    <div className="block-h">
      <h2><Icon n="audit" cls="" style={{width:16,height:16,color:"var(--teal)"}}/> Part history
        <span className="cnt">{events.length}</span></h2>
      <span className="tmeta">oldest first</span>
    </div>
    <div className="panel-pad">
      {events.length
        ? <div className="tl">{events.map((ev,i)=><TLEvent key={i} ev={ev} project={null} last={i===events.length-1}/>)}</div>
        : <div className="tl-empty">Nothing recorded against this part yet.<br/>Sampling, engineering and trial decisions taken per part land here.</div>}
    </div>
  </div>;
}

function PartDetail({pid,part,onBack}){
  const {db}=useApp();
  const x=db.parts.find(r=>r.pid===pid&&r.part===part);
  const proj=db.projects.find(r=>r.id===pid);
  if(!x) return <div className="tl-empty">That part is no longer on this project.</div>;
  /* A lot raised for the project covers this part too, so it belongs on this page as much
     as one named for it. */

function ProjectHistory({p}){
  const {db}=useApp();

    .concat(docEvents(db.docs,p))
    /* Audit rows carry a full timestamp and documents only a date, so compare on the leading
       10 characters both share; within a day the audit row wins, which keeps a decision above
       the file attached alongside it. */
    .slice()
    .sort((a,b)=>{const ka=evWhen(a.ts), kb=evWhen(b.ts);
                  /* same instant: the decision reads above the file attached alongside it */

    <div className="block-h">
      <h2><Icon n="audit" cls="" style={{width:16,height:16,color:"var(--teal)"}}/> Decisions &amp; history

    <div className="panel-pad">
      {events.length

}

/* PPAP is a warrant for a set of parts, so a project with three groups has three warrants -
   three TRUNs, three sets of six signatures - and a group that has cleared its trial can go
   for signature while another is still re-sampling. One board per group in the PSW stretch;
   a project with no groups gets the single project-wide board it always had. */
const PSW_STATES=["PSW Pending Sign-off","PSW Sign-off Pending","PSW Rejected","FAIR Released"];
function CFTBoard({p}){
  const tracks=liveTracks(p).filter(t=>PSW_STATES.indexOf(t.status)>=0);
  if(tracks.length) return <>{tracks.map(t=><CFTCard key={t.g} p={p} track={t}/>)}</>;
  return PSW_STATES.indexOf(p.status)>=0?<CFTCard p={p} track={null}/>:null;
}

          const parts=partsInGroup(db.parts,p.id,t.g);

             uses, so the two screens cannot disagree about whose turn it is. */
          const mine=rules.find(r=>r.cft?isCFT(roleKey,db):(r.roles||[]).indexOf(roleKey)>=0);
          return <div className={"trk-row"+(t.g===lead.g?" slow":"")} key={t.g}>
            <div className="trk-g">{t.g}
              {/* A group re-sourced to a vendor who was not in the approved quote no longer

/* ---------- new request (NPI intake stepper) ---------- */
const WIZ_STEPS=["Project","Team","4-Blocker","Parts & Groups","Review"];
const NPI_CATS=["New Product Development","Localization","Resourcing","ECN Driven","Cost Reduction"];
const NPI_SITES=["Pune","Bangalore","Chennai","Mumbai"];
const NPI_COMMOD=["Mechanical","Electronic","Plastic","Metal","Composite","Other"];
/* Vendors quote in whatever unit they sell in, so the unit travels with the part - a price
   without one is not comparable to anything. */
const NPI_UOM=["EA","KG","Liters","ml","Ft","Meters","Roll","Grams"];
/* CurrencyConversions carries BOTH quote conventions and they mean opposite things:
   MarketConvention "D" has UsdRate = USD per unit (EUR 1.1748), "I" has UsdRate = units per
   USD (INR 88.728). Multiplying by UsdRate is therefore right for EUR and wrong by a factor
   of ~7,800 for INR. FxMultiply is already normalised to "USD per 1 unit" for both, so it is
   the only column this app converts on. Do not "simplify" this to UsdRate. */
const fxOf=(rates,code)=>(rates||[]).find(r=>(r.code||"").toUpperCase()===String(code||"").toUpperCase());
const toUsd=(amount,code,rates)=>{
  const a=parseFloat(amount);
  if(!isFinite(a)) return null;
  const r=fxOf(rates,code);
  if(!r||!isFinite(parseFloat(r.fx))||parseFloat(r.fx)<=0) return null;
  return a*parseFloat(r.fx);
};
const usd=(v)=>v==null?"\u2014":"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
/* What a category REQUIRES of each part. The categories differ in what evidence the
   business case rests on, so the same form cannot ask the same things of all of them:
   a Localization with no incumbent price has no saving to compute, while a New Product
   Development has no incumbent at all and asking for one only invites invented data.
   Keys are part-draft fields; projReq entries are project-level. */
/* 4-7 alphanumeric with at least one letter, or exactly 7 digits - the plant's SAP
   supplier codes take one shape or the other and nothing in between. */
const VENDOR_CODE_RE=/^((?=.*[A-Za-z])[A-Za-z0-9]{4,7}|[0-9]{7})$/;
const CAT_RULES={
  "Localization":  {projReq:{incumbent:"Current supplier is required for a Localization",
                             vendorCode:"Current supplier code is required for a Localization"},
                    part:{cost:"Existing unit cost is required - the saving is measured against it",
                          vol:"Estimated annual volume is required - the saving is measured against it"}},
  "Resourcing":    {projReq:{incumbent:"Current supplier is required for a Resourcing",
                             vendorCode:"Current supplier code is required for a Resourcing"},
                    part:{cost:"Existing unit cost is required - the saving is measured against it",

  "Cost Reduction":{projReq:{incumbent:"Current supplier is required for a Cost Reduction",

  "ECN Driven":    {projReq:{ecn:"ECN number is required for an ECN Driven project",

  /* A new part has no incumbent and no current price. Volume is still required because
     nobody can quote without a schedule. */
  "New Product Development":{part:{vol:"Estimated annual volume is required so vendors can quote"}},
};
const catPartReq=(cat)=>(CAT_RULES[(cat||"").trim()]||{}).part||{};
const catProjReq=(cat)=>(CAT_RULES[(cat||"").trim()]||{}).projReq||{};

/* A native <input list> renders as a plain text box - no caret, no list until you guess
   that typing does something - which is why these read as prompts rather than dropdowns.
   This keeps the same contract (free text allowed, value/onChange) and adds the affordance:
   a caret that opens the full list, type-to-filter, arrow/enter/escape, click-away to close. */
function Combo({value,onChange,options,placeholder,allowNew}){
  const [open,setOpen]=useState(false);
  const [hi,setHi]=useState(-1);
  const box=useRef(null);
  const opts=options||[];
  const typed=String(value||"").trim().toLowerCase();
  /* Once a value is chosen it matches itself exactly, and filtering to that one entry would
     hide every alternative the moment you reopen the list. So an exact match shows everything. */
  const exact=opts.some(o=>o.toLowerCase()===typed);
  const list=(!typed||exact)?opts:opts.filter(o=>o.toLowerCase().indexOf(typed)>=0);
  useEffect(()=>{
    if(!open) return;
    const away=(e)=>{ if(box.current&&!box.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown",away);
    return ()=>document.removeEventListener("mousedown",away);
  },[open]);
  const pick=(o)=>{ onChange({target:{value:o}}); setOpen(false); setHi(-1); };
  const key=(e)=>{
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      if(!open){ setOpen(true); return; }
      setHi(h=>{ const d=e.key==="ArrowDown"?1:-1; const nx=h+d;
                 return nx<0?list.length-1:nx>=list.length?0:nx; });
    } else if(e.key==="Enter"){
      if(open&&hi>=0&&list[hi]){ e.preventDefault(); pick(list[hi]); }
    } else if(e.key==="Escape"){ setOpen(false); setHi(-1); }
  };
  return <div className="combo" ref={box}>
    <input value={value} placeholder={placeholder||"Select or type\u2026"}
           onChange={e=>{onChange(e);setOpen(true);setHi(-1);}}
           onFocus={()=>setOpen(true)} onKeyDown={key}
           role="combobox" aria-expanded={open} aria-autocomplete="list"/>
    <span className="combo-caret" onMouseDown={e=>{e.preventDefault();setOpen(o=>!o);}}
          title={open?"Hide options":"Show options"}>▼</span>
    {open?<div className="combo-pop">
      {list.length?list.map((o,i)=>
        <div key={o} className={"combo-opt"+(i===hi?" on":"")}
             onMouseEnter={()=>setHi(i)} onMouseDown={e=>{e.preventDefault();pick(o);}}>{o}</div>
      ):<div className="combo-none">No match</div>}
      {allowNew&&typed&&!exact?<div className="combo-new">Enter to keep “{value}” as a new entry</div>:null}
    </div>:null}
  </div>;
}

/* The import template and the import box both used to be a textarea of tab-separated text,
   which is exactly as readable as it sounds. Both now render the same grid. impText stays the
   single source of truth - the grid parses it on the way in and writes TSV back on the way
   out - so parseRows and doImport are untouched, and pasting still works. */
/* SheetJS is a <script> tag in the standalone page, but the SPFx bundle has no such tag -
   it only declares the global. So the deployed app had no XLSX at all: the Excel import
   silently never worked and there was nothing to download. Loaded on demand instead, once,
   and only when a workbook actually has to be read or written. */
let _xlsxPromise=null;
function ensureXlsx(){
  if(typeof XLSX!=="undefined") return Promise.resolve(true);
  if(_xlsxPromise) return _xlsxPromise;
  _xlsxPromise=new Promise(resolve=>{
    const el=document.createElement("script");
    el.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    el.onload=()=>resolve(typeof XLSX!=="undefined");
    /* A tenant that blocks the CDN must still be able to work - CSV covers that. */
    el.onerror=()=>resolve(false);
    document.head.appendChild(el);
  });
  return _xlsxPromise;
}
/* Anything a browser will save. Revoked immediately; the click is synchronous. */
function saveBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

const PARTS_COLS=["Part number","Description","Commodity","UOM","Currency","Annual volume","Unit cost"];
const PARTS_NUM=[5,6];
/* Column index -> the option list that cell picks from, so the grid offers the same choices
   the manual form does instead of trusting free text to match. */
const PARTS_OPTS={2:()=>NPI_COMMOD,3:()=>NPI_UOM,4:(rates)=>(rates||[]).map(r=>r.code)};
const PARTS_HEAD=SAMPLE_PARTS_TSV.split("\n")[0];
const BLANK_ROW=()=>PARTS_COLS.map(()=>"");
function tsvToGrid(t){
  const rows=String(t||"").split(/\r?\n/).filter(l=>l.trim()!==""||/[\t,]/.test(l)).map(l=>{
    const sep=l.indexOf("\t")>=0?"\t":",";
    return l.split(sep).map(x=>x.trim());
  });
  /* The grid draws its own headings, so a header line in the text is a duplicate, not a row.
     Same test parseRows uses, so the two agree on what counts as data. */
  if(rows.length&&/part\s*number|partnumber/i.test(rows[0][0]||"")) rows.shift();
  const w=PARTS_COLS.length;
  return rows.map(r=>{const o=r.slice(0,w);while(o.length<w)o.push("");return o;});
}
/* Written back with the header line so parseRows sees exactly the shape it always saw. */
const gridToTsv=(g)=>[PARTS_HEAD].concat(g.map(r=>r.join("\t"))).join("\n");

/* A project has many parts and each is quoted separately - one price for the whole project
   only ever worked because early test projects had a single part. The quote is therefore a
   row per part, priced in whatever currency that vendor quoted, with the same Excel round
   trip the intake import uses. Stored as TSV so paste, import and the grid all agree. */
const QUOTE_COLS=["Part number","Description","Annual quantity","Existing price","Existing currency","Localized price","Localized currency"];
const QUOTE_NUM=[2,3,5];
/* The two prices come from different places - the incumbent price off the current PO, the
   localized one out of the new vendor's quote - so they do not have to share a currency.
   Each converts on its own. */
const QUOTE_CCY=[4,6];
/* Part number and description come from the parts list; everything the sourcer types is
   required. One definition, read by the headers, the cell marking and the validator. */
/* Quantity, the existing price and the currency it was bought in are intake's figures -
   shown here because the saving is measured against them, but not asked for again. Only the
   localized pair is the sourcer's to fill, so only that pair is required. */
const QUOTE_EDIT=[5,6];
const QUOTE_REQ=[2,5,6];
const quoteCellBad=(r,ci)=>QUOTE_CCY.indexOf(ci)>=0?!String(r[ci]||"").trim():!(parseFloat(r[ci])>=0);
const QUOTE_HEAD=QUOTE_COLS.join("\t");
const quoteToRows=(t)=>{
  const w=QUOTE_COLS.length;
  return String(t||"").split(/\r?\n/)
    .filter(l=>l.trim()!==""||/[\t,]/.test(l))
    .map(l=>{const sep=l.indexOf("\t")>=0?"\t":",";return l.split(sep).map(x=>x.trim());})
    .filter((r,i)=>!(i===0&&/part\s*number|partnumber/i.test(r[0]||"")))
    /* Quotes captured before the split carry one currency for both prices. Six cells is
       that shape - widen it by giving each price the currency the row already names,
       rather than padding, which would read the localized price as a currency code. */
    .map(r=>r.length===6?[r[0],r[1],r[2],r[3],r[5],r[4],r[5]]:r)
    .map(r=>{const o=r.slice(0,w);while(o.length<w)o.push("");return o;});
};
const rowsToQuote=(g)=>[QUOTE_HEAD].concat(g.map(r=>r.join("\t"))).join("\n");

/* A project can source its parts from several vendors - the single name/email pair only
   ever described a one-vendor project. Seeded from the distinct suppliers already on the
   project's parts, so the names come from what the platform holds rather than being retyped;
   addresses start empty because that is the piece nobody has captured yet. */
/* name, the parts that vendor covers, address. Values written before the parts column
   existed are two-wide; they widen rather than break. */
const vendorRows=(t)=>String(t||"").split(/\r?\n/)
  .filter(l=>l.trim()!==""||l.indexOf("\t")>=0)
  .map(l=>{const c=l.split("\t");
    return c.length>=3 ? [(c[0]||"").trim(),(c[1]||"").trim(),(c[2]||"").trim()]
                       : [(c[0]||"").trim(),"",(c[1]||"").trim()];});
const rowsToVendors=(g)=>g.map(r=>[r[0]||"",r[1]||"",r[2]||""].join("\t")).join("\n");
const splitParts=(x)=>String(x||"").split(/[,;]/).map(y=>y.trim()).filter(Boolean);
/* The project's one vendor, {n: name, e: email}: the latest of a vendor replaced at F-06R, the
   one chosen at F-02, or - for a project from before the stored summary - the row's supplier.
   Projects quoted before the one-vendor rule keep the first vendor they named. */
const curVendor=(s)=>{s=s||{};const f=s.f02||{};
  const v=s.vendor||f.vendor||(f.vendors||[])[0]||null;return v&&v.n?v:null;};
/* GL account, cost centre and profit centre: recorded once by Finance (Opex) or AME (Capex)
   and read back everywhere they are needed - the routing gate shows them for information, the
   Buyer's card carries them onto the PR. */
/* Booked by Finance at F-02c and read everywhere after it. The F-03c/F-03o entries are kept
   in the lookup for projects coded before the capture moved. */
/* The plant is a code AND a name at Honeywell, and the code is what SAP, the PR and every
   Honeywell system key on - so a screen that shows only "Pune" is missing the identifier the
   plant actually works by.

   The code comes from the Plants table in Admin & Configuration, which is the master list:
   reading it off the project row instead let a project carry a code the configuration had
   never heard of, and two screens then disagreed about the same plant. The row's own code is
   only a fallback, for a plant that is not in the table at all.

   PLANT_CFG is refreshed by App from db.admin.plants on every render, before any child runs -
   a cache of configuration, never a second copy of state. */
let PLANT_CFG=[];
const plantCodeOf=(p)=>{
  const nm=String((p&&p.plant)||"").trim().toLowerCase();
  const cfg=nm?PLANT_CFG.find(x=>String(x.name||"").trim().toLowerCase()===nm):null;
  return (cfg&&String(cfg.code||"").trim())||String((p&&p.plantCode)||"").trim();
};
const plantLine=(p)=>{const nm=(p&&p.plant&&p.plant!=="—")?p.plant:"", cd=plantCodeOf(p);
  return cd?(nm?nm+" · "+cd:"Plant "+cd):(nm||"—");};

/* The configured team for a plant, keyed by role code. Read off the Team by plant table -
   the same table Admin edits - so a project that starts today picks up whatever the plant
   currently holds, and one that started last month keeps the team it was given. */
let TEAM_CFG=[];
const roleIdOfLabel=(label)=>{const l=String(label||"").trim().toLowerCase();
  const r=ROLE_REGISTRY.find(x=>String(x.label).toLowerCase()===l); return r?r.id:"";};
const teamForPlant=(plant)=>{
  const nm=String(plant||"").trim().toLowerCase(), out={};
  TEAM_CFG.forEach(row=>{
    if(String(row.status||"Active")==="Inactive") return;
    if(String(row.plant||"").trim().toLowerCase()!==nm) return;
    const id=roleIdOfLabel(row.role); if(!id||out[id]) return;
    out[id]={n:String(row.person||"").trim(),e:String(row.email||"").trim()};
  });
  return out;
};
/* The roles a project names a person for, in the order the work reaches them. */
const TEAM_ROLES=["SRC_MEMBER","SRC_HEAD","BU_MEMBER","BU_HEAD","FIN_ANALYST","FIN_HEAD",
  "CTRL","CTRL_HEAD","ENG","ENG_LEAD","SQE_ENG","SQE_HEAD","PROD_ENG","MFG_HEAD",
  "PLANNER","PLAN_LEAD","BUYER","BUYER_LEAD"];
/* The project's own team, falling back to the role registry for a role nobody was named for -
   a gate with no assignee would otherwise have nobody to ask. */
const teamMember=(p,roleId)=>{const t=(p&&p.team)||{}, m=t[roleId];
  return (m&&m.n)?m:{n:personFor(roleId),e:""};};
/* The approver map the chain and the gate flow already read, derived from the team so the two
   cannot describe different people. */
const approversFromTeam=(team)=>{const n=id=>((team||{})[id]||{}).n||personFor(id);
  return {sourcingHead:n("SRC_HEAD"),financeHead:n("FIN_HEAD"),buHead:n("BU_HEAD"),
    ameHead:n("ENG_LEAD"),iqa:n("SQE_ENG"),sqe:n("SQE_HEAD"),prodEng:n("PROD_ENG"),
    ameMfg:n("MFG_HEAD"),planner:n("PLANNER"),buyer:n("BUYER")};};

const projAcct=(p)=>{const s=(p&&p.summary)||{}, c=s.f02c||{}, a=s.f03c||{}, o=s.f03o||{};
  return {gl:c.gl||a.gl||o.gl||(p&&p.glAccount)||"",cc:c.cc||a.cc||o.cc||(p&&p.costCentre)||"",
          pc:c.pc||a.pc||o.pc||(p&&p.profitCentre)||""};};
/* Capex or Opex, as the Finance Head decided it - from this session's project row, or from the
   summary when the page has been reloaded since. Falls back to what Sourcing suggested. */
const projRoute=(p)=>{const s=(p&&p.summary)||{}, hf=(p&&p.hubForm)||{};
  return (p&&p.routingDecision)||(s.f02f||{}).route||hf.route||(s.f02c||{}).route||
         (p&&p.routingSuggestion)||(s.f02||{}).route||"";};
const projVendor=(p)=>curVendor(p&&p.summary)||
  ((p&&p.supplier&&p.supplier!=="\u2014")?{n:p.supplier,e:p.vendorEmail||""}:null);
const isEmail=(x)=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(x||"").trim());
/* Name, parts and address are all required: F-05 notifies each vendor at that address for
   those parts, so a row missing any of them is a sample request that cannot be sent. */
const vendorCellBad=(r,ci)=>ci===2?!isEmail(r[2]):!String(r[ci]||"").trim();

/* A localisation project can carry hundreds of parts, and drawing every one of them makes
   the form unusable - the page scrolls for screens, and the currency column rebuilds a
   160-option dropdown per row. So every grid renders a window instead.
   Row indexes stay absolute: paging changes only which slice is drawn, never what setCell,
   the validators or the stored TSV address. */
const GRID_PAGE=25;
function usePager(total){
  const [ps,setPs]=useState(GRID_PAGE);
  const [page,setPage]=useState(0);
  const pages=Math.max(1,Math.ceil(total/ps));
  /* Removing the last row of the last page would otherwise strand the view past the end. */
  const cur=Math.min(page,pages-1);
  const from=cur*ps;
  return {total:total,ps:ps,pages:pages,cur:cur,from:from,to:Math.min(from+ps,total),
    set:setPage,
    setPs:(nps)=>{setPs(nps);setPage(0);},
    /* a row appended below the window is no use to whoever just asked for it */
    toEnd:()=>setPage(Math.floor(total/ps)),
    window:(rows)=>rows.map((r,i)=>[r,i]).slice(from,from+ps)};
}
/* Same readout as the DataTable footer - rows per page, the range, then the arrows - so a
   long grid pages the way every other long table in the Hub already does. */
function Pager({pg,noun}){
  if(pg.total<=GRID_PAGE) return null;
  return <span className="xlpage">
    <span className="xlrpp">Rows<select value={pg.ps} onChange={e=>pg.setPs(+e.target.value)}
      aria-label="Rows per page">{[25,50,100].map(x=><option key={x} value={x}>{x}</option>)}</select></span>
    <span className="xlpn">{pg.total?pg.from+1:0}–{pg.to} of {pg.total}{noun?" "+noun:""}</span>
    <button className="btn xs" disabled={pg.cur===0} onClick={()=>pg.set(pg.cur-1)}
      title="Previous page">‹</button>
    <button className="btn xs" disabled={pg.cur>=pg.pages-1} onClick={()=>pg.set(pg.cur+1)}
      title="Next page">›</button>
  </span>;
}

function VendorList({value,onChange,parts,suppliers,showErr}){
  const rows=vendorRows(value);
  /* Grouped by supplier, so a vendor supplying four parts is one row listing four part
     numbers - not four rows, and not a name with no indication of what it covers. */
  useEffect(()=>{
    if(rows.length||!parts||!parts.length) return;
    const by={},order=[];
    parts.forEach(x=>{
      const nm=(x.supplier||"").trim();
      if(!nm||nm==="\u2014") return;
      if(!by[nm]){by[nm]=[];order.push(nm);}
      if(x.part&&by[nm].indexOf(x.part)<0) by[nm].push(x.part);
    });
    if(order.length) onChange({target:{value:rowsToVendors(order.map(nm=>[nm,by[nm].join(", "),""]))}});
  },[(parts||[]).length]);
  const write=(g)=>onChange({target:{value:rowsToVendors(g)}});
  const setCell=(ri,ci,val)=>{const g=rows.map(r=>r.slice());g[ri][ci]=val;write(g);};
  const known=(suppliers||[]).map(x=>x.name).filter(Boolean);
  const allParts=(parts||[]).map(x=>x.part).filter(Boolean);
  const covered=[];
  rows.forEach(r=>splitParts(r[1]).forEach(pn=>{if(covered.indexOf(pn)<0)covered.push(pn);}));
  const unassigned=allParts.filter(pn=>covered.indexOf(pn)<0);
  const pg=usePager(rows.length);
  return <div className="vgrid">
    <div className="xlwrap">
      <table className="xltable">
        <thead><tr><th className="rn"/><th>Vendor<i>*</i></th><th>Part numbers<i>*</i></th><th>Vendor email<i>*</i></th><th className="rn"/></tr></thead>
        <tbody>
          {rows.length?pg.window(rows).map(([r,ri])=>{
            const bad=splitParts(r[1]).filter(pn=>allParts.length&&allParts.indexOf(pn)<0);
            return <tr key={ri}>
              <td className="rn">{ri+1}</td>
              <td className={showErr&&vendorCellBad(r,0)?"miss":""}><input list="dl-vendors" value={r[0]} placeholder="Vendor name"
                         onChange={e=>setCell(ri,0,e.target.value)} aria-label={"Vendor "+(ri+1)}/></td>
              <td className={showErr&&(vendorCellBad(r,1)||bad.length)?"miss":""}><input value={r[1]} placeholder="e.g. AL-CP-001, AL-CP-002"
                         onChange={e=>setCell(ri,1,e.target.value)} aria-label={"Parts for vendor "+(ri+1)}/>
                  {bad.length?<div className="ferr" style={{padding:"0 9px 5px"}}>not on this project: {bad.join(", ")}</div>:null}</td>
              <td className={showErr&&vendorCellBad(r,2)?"miss":""}><input type="email" value={r[2]} placeholder="name@supplier.com"
                         onChange={e=>setCell(ri,2,e.target.value)} aria-label={"Vendor "+(ri+1)+" email"}/></td>
              <td className="rn"><button className="xlx" title="Remove this vendor"
                   onClick={()=>write(rows.filter((_,i)=>i!==ri))}>&times;</button></td>
            </tr>;
          }):<tr><td className="xlempty" colSpan={5}>No vendors yet \u2014 add one below.</td></tr>}
        </tbody>
      </table>
    </div>
    <datalist id="dl-vendors">{known.map(o=><option key={o} value={o}/>)}</datalist>
    <div className="xlfoot">
      <button className="btn" onClick={()=>{write(rows.concat([["","",""]]));pg.toEnd();}}>Add vendor</button>
      <Pager pg={pg} noun="vendors"/>
      {/* A part nobody has been assigned to is the failure this column exists to make visible. */}
      <span className="xlcount">{rows.length} vendor(s){unassigned.length?" \u00b7 "+unassigned.length+" part(s) unassigned":""}</span>
    </div>
  </div>;
}

/* PR/PO is per part, not per project. The live F-04 flow reads an SAP extract from the
   documents library and patches SAPMaterialNumber onto each NPIParts row, writing SAPNumber
   and Amount into SAPTransactions - so a single typed PR number was never how this worked.
   Same shape as that: a row per part, filled by hand or brought in from the SAP file. */
const SAP_COLS=["Part number","Description","PR number","TRUN quantity","PO number"];
const SAP_NUM=[3];
/* The PO number is the Buyer's column: the Planner's PR step does not show it. */
const SAP_PO=4;
const sapRows=(t)=>{
  const w=SAP_COLS.length;
  /* Rows saved before the split are [part, SAP material, PR, PO, amount] - the same width
     with three different meanings, so they are remapped rather than padded. Without this a
     project already past F-04 would show its PO number as a TRUN quantity. */
  const legacy=/SAP\s*material/i.test(String(t||"").split(/\r?\n/)[0]||"");
  return String(t||"").split(/\r?\n/)
    .filter(l=>l.trim()!==""||/[\t,]/.test(l))
    .map(l=>{const sep=l.indexOf("\t")>=0?"\t":",";return l.split(sep).map(x=>x.trim());})
    .filter((r,i)=>!(i===0&&/part\s*number|partnumber/i.test(r[0]||"")))
    .map(r=>legacy?[r[0],"",r[2]||"","",r[3]||""]:r)
    .map(r=>{const o=r.slice(0,w);while(o.length<w)o.push("");return o;});
};
const rowsToSap=(g)=>[SAP_COLS.join("\t")].concat(g.map(r=>r.join("\t"))).join("\n");

/* The live F-05 loops over the project's parts and writes VendorContactName,
   VendorContactEmail and SampleSubmissionDeadline against each one - so more than one vendor
   was always supported there. A single contact pair on the form could not express it.
   Seeded from the vendors named at F-02, which already carry the parts each one covers. */
const NOTIFY_COLS=["Vendor","Parts","Contact name","Contact email","Sample deadline","Qty requested"];
const NOTIFY_NUM=[5];
const notifyRows=(t)=>{
  const w=NOTIFY_COLS.length;
  return String(t||"").split(/\r?\n/)
    .filter(l=>l.trim()!==""||/[\t,]/.test(l))
    .map(l=>{const sep=l.indexOf("\t")>=0?"\t":",";return l.split(sep).map(x=>x.trim());})
    .filter((r,i)=>!(i===0&&/^vendor$/i.test(r[0]||"")))
    .map(r=>{const o=r.slice(0,w);while(o.length<w)o.push("");return o;});
};
const rowsToNotify=(g)=>[NOTIFY_COLS.join("\t")].concat(g.map(r=>r.join("\t"))).join("\n");

/* Samples arrive from different vendors on different days, so this is a standing list of
   what is expected rather than a one-shot form: fill the row that has just landed, submit,
   come back when the next one does. The live estate models it the same way - a row per sample
   in the Samples list, each one patching SampleReceivedDate onto its own part. */
const SAMPLE_COLS=["Vendor","Part number","Expected","Received","Qty received","Lot number"];
const SAMPLE_NUM=[4];
const sampleGridRows=(t)=>{
  const w=SAMPLE_COLS.length;
  return String(t||"").split(/\r?\n/)
    .filter(l=>l.trim()!==""||/[\t,]/.test(l))
    .map(l=>{const sep=l.indexOf("\t")>=0?"\t":",";return l.split(sep).map(x=>x.trim());})
    .filter((r,i)=>!(i===0&&/^vendor$/i.test(r[0]||"")))
    .map(r=>{const o=r.slice(0,w);while(o.length<w)o.push("");return o;});
};
const rowsToSampleGrid=(g)=>[SAMPLE_COLS.join("\t")].concat(g.map(r=>r.join("\t"))).join("\n");

function SampleGrid({value,onChange,pid,project,parts,group}){
  const rows=sampleGridRows(value);
  useEffect(()=>{
    if(rows.length) return;
    /* One row per part, all from the project's one vendor, expected on the date F-05 (or the
       group's re-sample request) agreed. Read from the stored summary, which survives a reload. */
    const sm=(project&&project.summary)||{}, v=projVendor(project);
    const due=(group&&sm.g&&sm.g[group]&&sm.g[group].rs&&sm.g[group].rs.due)||(sm.f05&&sm.f05.d)||"";
    const seed=(parts||[]).map(x=>[v?v.n:"",x.part||"",due,"","",""]);
    if(seed.length) onChange({target:{value:rowsToSampleGrid(seed)}});
  },[pid,(parts||[]).length]);
  const write=(g)=>onChange({target:{value:rowsToSampleGrid(g)}});
  const setCell=(ri,ci,v)=>{const g=rows.map(r=>r.slice());g[ri][ci]=v;write(g);};
  const got=rows.filter(r=>r[3]).length;
  const outstanding=rows.length-got;
  const pg=usePager(rows.length);

  const vend=projVendor(project);
  return <div className="qgrid">
    {vend?<div className="tmeta" style={{marginBottom:6}}>Vendor: <b>{vend.n}</b></div>:null}
    <div className="xlwrap">
      <table className="xltable">
        <thead><tr><th className="rn"/>{SAMPLE_COLS.map((c,ci)=>ci===0?null:<th key={c}>{c}</th>)}<th className="rn"/></tr></thead>
        <tbody>
          {rows.length?pg.window(rows).map(([r,ri])=><tr key={ri} className={r[3]?"":"jnow"}>
            <td className="rn">{r[3]?"\u2713":ri+1}</td>
            {r.map((c,ci)=>ci===0?null:<td key={ci} className={SAMPLE_NUM.indexOf(ci)>=0?"num":(ci<2?"ro":"")}>
              {ci<2 ? c
                : ci===2 ? <span className="tmeta" style={{padding:"0 9px"}}>{c||"\u2014"}</span>
                : ci===3 ? <span className="dcell">
                    <input type="date" value={c} onChange={e=>setCell(ri,ci,e.target.value)} aria-label={"Received "+(ri+1)}/>
                    {/* most receipts are logged the day they land, so the common case is one click */}
                    <button className="btn xs" title="Set to today"
                      onClick={()=>setCell(ri,ci,new Date().toISOString().slice(0,10))}>Today</button>
                  </span>
                : <input value={c} onChange={e=>setCell(ri,ci,e.target.value)} aria-label={SAMPLE_COLS[ci]+" "+(ri+1)}/>}
            </td>)}
            <td className="rn">{r[3]?<span className="tmeta">in</span>:<span className="tmeta">due</span>}</td>
          </tr>):<tr><td className="xlempty" colSpan={SAMPLE_COLS.length+1}>Nothing expected yet \u2014 F-05 sets this up.</td></tr>}
        </tbody>
      </table>
    </div>
    <div className="xlfoot">
      <button className="btn" onClick={()=>{write(rows.concat([[vend?vend.n:"","","","","",""]]));pg.toEnd();}}>Add row</button>
      <Pager pg={pg} noun="samples"/>
      <span className="xlcount">{got} received{outstanding?" \u00b7 "+outstanding+" still outstanding":" \u00b7 all in"}</span>
    </div>
  </div>;
}

function NotifyGrid({value,onChange,pid,project,parts,group}){
  const rows=notifyRows(value);
  useEffect(()=>{
    if(rows.length) return;
    /* Prefer the vendor list captured at F-02 - it already knows which parts each vendor
       covers. Fall back to the distinct suppliers on the parts if F-02 was never filled. */
    const f02=project&&project.form&&project.form["F-02"];
    let seed=[];
    if(f02&&f02.vendors){
      /* Answered for one group: only the vendors covering that group's parts, and only those
         parts against them. */
      const only=group?parts.map(x=>x.part):null;
      seed=vendorRows(f02.vendors).filter(r=>r[0]).map(r=>{
        const ps=splitParts(r[1]).filter(pn=>!only||only.indexOf(pn)>=0);
        return [r[0],ps.join(", "),"",r[2]||"","",""];
      }).filter(r=>!only||r[1]);
    }
    if(!seed.length&&parts&&parts.length){
      const by={},order=[];
      parts.forEach(x=>{const nm=(x.supplier||"").trim();
        if(!nm||nm==="\u2014")return;
        if(!by[nm]){by[nm]=[];order.push(nm);}
        if(x.part&&by[nm].indexOf(x.part)<0) by[nm].push(x.part);});
      seed=order.map(nm=>[nm,by[nm].join(", "),"","","",""]);
    }
    if(seed.length) onChange({target:{value:rowsToNotify(seed)}});
  },[pid,(parts||[]).length]);
  const write=(g)=>onChange({target:{value:rowsToNotify(g)}});
  const setCell=(ri,ci,v)=>{const g=rows.map(r=>r.slice());g[ri][ci]=v;write(g);};
  const ready=rows.filter(r=>r[3]&&r[4]).length;
  const pg=usePager(rows.length);

  const download=async()=>{
    const aoa=[NOTIFY_COLS].concat(rows);
    if(await ensureXlsx()){
      try{
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),"Vendors");
        XLSX.writeFile(wb,(pid||"NPI")+"_Vendor_Notification.xlsx"); return;

    const csv=aoa.map(r=>r.map(c=>{const v=String(c==null?"":c);
      return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\r\n");
    saveBlob(new Blob([csv],{type:"text/csv;charset=utf-8;"}),(pid||"NPI")+"_Vendor_Notification.csv");
  };
  const upload=async(e)=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    if(/\.csv$/i.test(f.name)){
      const rd=new FileReader();
      rd.onload=ev=>onChange({target:{value:String(ev.target.result||"")}});
      rd.readAsText(f); return;
    }
    if(!(await ensureXlsx())) return;
    const rd=new FileReader();
    rd.onload=ev=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false,defval:""});
        onChange({target:{value:aoa.map(r=>r.map(c=>String(c==null?"":c)).join("\t")).join("\n")}});
      }catch(err){}
    };
    rd.readAsArrayBuffer(f);
  };

  return <div className="qgrid">
    <div className="xlwrap">
      <table className="xltable">
        <thead><tr><th className="rn"/>{NOTIFY_COLS.map(c=><th key={c}>{c}</th>)}<th className="rn"/></tr></thead>
        <tbody>
          {rows.length?pg.window(rows).map(([r,ri])=><tr key={ri}>
            <td className="rn">{ri+1}</td>
            {r.map((c,ci)=><td key={ci} className={NOTIFY_NUM.indexOf(ci)>=0?"num":""}>
              {ci===4
                ? <input type="date" value={c} onChange={e=>setCell(ri,ci,e.target.value)} aria-label={"Deadline row "+(ri+1)}/>
                : <input value={c} onChange={e=>setCell(ri,ci,e.target.value)}
                         placeholder={ci===3?"name@supplier.com":""} aria-label={NOTIFY_COLS[ci]+" row "+(ri+1)}/>}
            </td>)}
            <td className="rn"><button className="xlx" title="Remove this vendor"
                 onClick={()=>write(rows.filter((_,i)=>i!==ri))}>&times;</button></td>
          </tr>):<tr><td className="xlempty" colSpan={NOTIFY_COLS.length+2}>No vendors on this project yet.</td></tr>}
        </tbody>
      </table>
    </div>
    <div className="xlfoot">
      <button className="btn" onClick={()=>{write(rows.concat([["","","","","",""]]));pg.toEnd();}}>Add vendor</button>
      <button className="btn" onClick={download}>Download Excel</button>
      <label className="btn" style={{position:"relative",overflow:"hidden",cursor:"pointer"}}>Import Excel
        <input type="file" accept=".xlsx,.xls,.csv" onChange={upload}
               style={{position:"absolute",inset:0,opacity:0,cursor:"pointer"}}/></label>
      <Pager pg={pg} noun="vendors"/>
      <span className="xlcount">{ready} of {rows.length} ready to send</span>
    </div>
  </div>;
}

function QuoteGrid({value,onChange,pid,rates,parts,showErr}){
  /* Derived from the project's own parts rather than written on mount: an effect only fires
     when the grid mounts with the field already empty, which is not what happens when the form
     is opened from My Work in an app that is already running. Quantity and existing cost come
     across as intake captured them; the first edit writes the whole grid back. */
  const typed=quoteToRows(value);
  const rows=(typed.length||!parts||!parts.length) ? typed : parts.map(x=>[
    x.part||"", x.desc||"", x.vol==null?"":String(x.vol),
    x.cost==null?"":String(x.cost), (x.currency||"USD"), "", (x.currency||"USD")]);
  const write=(g)=>onChange({target:{value:rowsToQuote(g)}});
  const setCell=(ri,ci,v)=>{const g=rows.map(r=>r.slice());g[ri][ci]=v;write(g);};
  const codes=(rates||[]).map(r=>r.code);
  const pg=usePager(rows.length);

  /* Totals are the point of the grid: each row converts on its own currency, so a quote
     mixing INR and EUR still adds up. */
  let cur=0,nw=0,ok=0;
  rows.forEach(r=>{
    const q=parseFloat(r[2]),a=parseFloat(r[3]),b=parseFloat(r[5]);
    const ua=usdOf(a,r[4]),ub=usdOf(b,r[6]);
    if(isFinite(q)&&ua!=null&&ub!=null){cur+=q*ua;nw+=q*ub;ok++;}
  });
  const save=ok?cur-nw:null;

  const download=async()=>{
    const aoa=[QUOTE_COLS].concat(rows);
    if(await ensureXlsx()){
      try{
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),"Quote");
        XLSX.writeFile(wb,(pid||"NPI")+"_Sourcing_Quote.xlsx");
        return;
      }catch(e){}
    }
    const csv=aoa.map(r=>r.map(c=>{const v=String(c==null?"":c);
      return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\r\n");
    saveBlob(new Blob([csv],{type:"text/csv;charset=utf-8;"}),(pid||"NPI")+"_Sourcing_Quote.csv");
  };
  /* An import prices the quote; it does not re-state the project. Only the localized pair
     is taken, matched on part number, so a sheet that came back with an edited quantity
     or existing price cannot quietly rewrite what intake captured - the same rule the
     grid enforces on screen. Parts the sheet does not name keep what they have. */
  const applyImport=(text)=>{
    const imp=quoteToRows(text), key=x=>String(x||"").trim().toUpperCase();
    const by={}; imp.forEach(r=>{ if(r[0]) by[key(r[0])]=r; });
    write(rows.map(r=>{const m=by[key(r[0])];
      return m?[r[0],r[1],r[2],r[3],r[4],m[5]||"",m[6]||r[6]]:r;}));
  };
  const upload=async(e)=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    if(/\.csv$/i.test(f.name)){
      const rd=new FileReader();
      rd.onload=ev=>applyImport(String(ev.target.result||""));
      rd.readAsText(f); return;
    }
    if(!(await ensureXlsx())) return;
    const rd=new FileReader();
    rd.onload=ev=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false,defval:""});
        applyImport(aoa.map(r=>r.map(c=>String(c==null?"":c)).join("\t")).join("\n"));
      }catch(err){}
    };
    rd.readAsArrayBuffer(f);
  };

  return <div className="qgrid">
    <div className="xlwrap">
      <table className="xltable">
        <thead><tr><th className="rn"/>{QUOTE_COLS.map((c,ci)=><th key={c}>{c}{QUOTE_REQ.indexOf(ci)>=0?<i>*</i>:null}</th>)}</tr></thead>
        <tbody>
          {rows.length?pg.window(rows).map(([r,ri])=><tr key={ri}>
            <td className="rn">{ri+1}</td>
            {r.map((c,ci)=><td key={ci} className={(QUOTE_NUM.indexOf(ci)>=0?"num":"")+(QUOTE_EDIT.indexOf(ci)<0?" ro":"")
                +(showErr&&QUOTE_REQ.indexOf(ci)>=0&&quoteCellBad(r,ci)?" miss":"")}>
              {QUOTE_EDIT.indexOf(ci)<0
                ? c
                : QUOTE_CCY.indexOf(ci)>=0
                ? <select className="xlsel" value={c} onChange={e=>setCell(ri,ci,e.target.value)}>
                    <option value=""/>
                    {codes.map(o=><option key={o} value={o}>{o}</option>)}
                    {/* a code typed into the spreadsheet that is not in the rate table is kept
                        and shown, rather than silently cleared by the dropdown */}
                    {c&&codes.indexOf(c)<0?<option value={c}>{c}</option>:null}
                  </select>
                : <input value={c} onChange={e=>setCell(ri,ci,e.target.value)} aria-label={QUOTE_COLS[ci]+" row "+(ri+1)}/>}
            </td>)}
          </tr>):<tr><td className="xlempty" colSpan={QUOTE_COLS.length+1}>No parts on this project yet.</td></tr>}
        </tbody>
      </table>
    </div>
    <div className="xlfoot">
      <button className="btn" onClick={download}>Download Excel</button>
      <label className="btn" style={{position:"relative",overflow:"hidden",cursor:"pointer"}}>Import Excel
        <input type="file" accept=".xlsx,.xls,.csv" onChange={upload}
               style={{position:"absolute",inset:0,opacity:0,cursor:"pointer"}}/></label>
      <Pager pg={pg} noun="parts"/>
      <span className="xlcount">{rows.length} part(s){ok<rows.length?" \u00b7 "+(rows.length-ok)+" incomplete":""}</span>
    </div>
    {ok?<div className="qtot">
      <span><b>Current annual spend</b> {money(cur,"USD")}</span>
      <span><b>New annual spend</b> {money(nw,"USD")}</span>
      <span className={save>=0?"good":"bad"}><b>Annual saving</b> {money(save,"USD")}{cur?" \u00b7 "+((save/cur)*100).toFixed(1)+"%":""}</span>
    </div>:null}
  </div>;
}
