    decideGate:(project,step,decision,comment,route)=>{
      const who=(project.approvers&&project.approvers[step.who])||personFor(step.role);
      if(!(roleKey===step.role||who===me)){denied(step.id+" · "+step.label);return;}
      /* The route has to be on the project before ok() reads it - this gate decides where the
         project goes next AND what it is funded as, and the second answers the first. */
      const decided=(step.route&&decision==="Approved")?{...project,routingDecision:route||project.routingDecision}:project;
      const to=decision==="Approved"?(typeof step.ok==="function"?step.ok(decided):step.ok):"Returned to Sourcing";
      if(!canTransition(project.status,to)){flash("Not a legal move from "+project.status);return;}
      setDb(d=>({...d,projects:d.projects.map(p=>p.id===project.id?{...p,status:to,updated:todayStr(),
        ...(step.route&&route?{routingDecision:route}:{})}:p),
        parts:syncParts(d.parts,project.id,"",to,project.phase),
        audit:withAudit(d,{action:step.id+" "+decision,entity:project.id,detail:project.status+" → "+to,comment:comment||"—"}),
        notifs:withNotif(d,step.label+" "+decision.toLowerCase()+" · "+project.id+" → "+to)}));
      runCommand("approve.gate",{projectId:project.id,fromStatus:project.status,toStatus:to,
        ...cardBits(decided,{from:project.status,to:to,note:comment,
          extra:(step.route&&route)?{route:route}:undefined}),
        fields:{step:step.id,decision:decision,comment:comment||"",...(step.route?{route:route||""}:{})}},
        project.id,step.id+" "+decision);
    },
    submitForm:(formId,project,values,choice,group)=>{
      const spec=FORM_SPECS[formId];
      if(!hasCap(roleKey,spec.cap)){denied(spec.id+" "+spec.name);return;}
      /* A group decision is validated against that group's status and written to that group's
         track. The project status that comes out is the slowest track - computed in
         applyTracks, never assigned here - so one group racing ahead cannot drag the project
         with it. */
      const tracks=group?liveTracks(project):[];
      const track=group?tracks.find(t=>t.g===group):null;
      if(track) return trackSubmit(formId,spec,project,tracks,track,values,choice);
      /* An empty target means "record this, leave the project where it is" - needed where
         evidence arrives in instalments, like samples landing from different vendors on
         different days. The router already treats an empty toStatus the same way. */
      const staysPut=!String(choice.to||"").trim();
      if(!staysPut&&!canTransition(project.status,choice.to)){flash("Not a legal move from "+project.status);return;}
      /* A recommendation leaves the project exactly where it is. Moving it optimistically and
         moving it back when the head disagrees would put two status changes in the audit trail
         that never happened. */
      const leader=leaderFor(formId,roleKey,project);
      setDb(d=>{
        const next=d.projects.map(p=>{
          if(p.id!==project.id) return p;
          const patched=spec.apply(p,values,me,choice);
          if(leader) return {...patched,updated:todayStr(),
            /* The evidence is kept so the head can see it; what the decision would COUNT is
               not, because the decision has not been taken yet. */
            rejectionCount:p.rejectionCount,engRejectionCount:p.engRejectionCount,
            recommendation:{form:spec.id,decision:choice.v,to:choice.to,by:me,at:todayStr()},
            form:{...(p.form||{}),[formId]:values}};
          if(staysPut) return {...patched,updated:todayStr(),
            form:{...(p.form||{}),[formId]:values}};
          return {...patched,status:choice.to,phase:choice.phase||p.phase,updated:todayStr(),
            form:{...(p.form||{}),[formId]:values}};
        });
        return {...d,projects:next,
          parts:(leader||staysPut)?d.parts:syncParts(d.parts,project.id,"",choice.to,choice.phase||project.phase),
          audit:withAudit(d,{action:spec.id+" "+(leader?"recommendation":choice.v),entity:project.id,
            detail:leader?("recommends "+choice.to+" · awaiting "+ROLE[leader].label)
                          :(staysPut?("recorded · still "+project.status)
                                     :(project.status+" → "+choice.to)),
            comment:values[spec.comment.k]||"—"}),
          notifs:withNotif(d,leader
            ? spec.id+" recorded · "+project.id+" — sent to "+ROLE[leader].label+" for approval"
            : spec.id+" "+choice.label.toLowerCase()+" · "+project.id
              +(staysPut?" — recorded":" is now "+choice.to))};
      });
      /* No toStatus on a recommendation: the router keeps the current status and stores the
         evidence, and Svc-Gate-Approval picks it up and asks the head. `recommend` is what the
         head's approval will apply. */
      const cards=cardBits(project,{formId:formId,values:values,from:project.status,
        to:(leader||staysPut)?"":choice.to,note:values[spec.comment.k]});
      runCommand(spec.cap, leader
        ? {projectId:project.id,fromStatus:project.status,...cards,
           fields:{...values,form:spec.id,decision:choice.v,
                   recommend:choice.to,recommendPhase:choice.phase||"",awaiting:leader}}
        : {projectId:project.id,fromStatus:project.status,toStatus:choice.to,...cards,
           toPhase:choice.phase||"",fields:{...values,form:spec.id,decision:choice.v}},
        project.id, leader?(spec.id+" recommendation"):spec.id);
    },
  };
  /* The three things every track write has to tell the router: which group moved, what all
     the tracks now are, and what the project row should therefore say. Passing the same
     transform the local reducer used keeps the two in step. */
  function trackBitsFor(project,group,fn){
    if(!group) return {};
    const nt=tracksOf(project).map(t=>t.g===group?fn(t):t);
    const lead=rollUp(nt);
    return {group:group,tracksJson:JSON.stringify(nt),
            projectStatus:lead.status,projectPhase:lead.phase||""};
  }

  /* One group's verdict. Everything the project-wide branch does - apply, store the values,
     audit, notify, post the command - happens against the track instead, and the project is
     re-derived from the tracks afterwards.
     F-07, F-08 and F-09 are all recommend-then-decide gates, so a member's submission is a
     recommendation on that group's track and moves nothing; the head opening the same form
     for the same group is what advances it. */
  function trackSubmit(formId,spec,project,tracks,track,values,choice){
    const leader=leaderFor(formId,roleKey,track);
    const staysPut=!String(choice.to||"").trim();
    if(!leader&&!staysPut&&!canTransition(track.status,choice.to)){
      flash("Not a legal move for "+track.g+" from "+track.status);return;}
    const applied=spec.apply({...project,rejectionCount:track.rejectionCount||0,
      engRejectionCount:track.engRejectionCount||0},values,me,choice);
    /* A recommendation leaves the group exactly where it is - moving it optimistically and
       moving it back when the head disagrees would put two status changes in the audit trail
       that never happened. */
    const held=leader||staysPut;
    const nextTrack={...track,
      status:held?track.status:choice.to,
      phase:held?track.phase:(choice.phase||track.phase),
      recommendation:leader?{form:spec.id,decision:choice.v,to:choice.to,by:me,at:todayStr()}
                           :(staysPut?track.recommendation:null),
      /* F-10 is the only form that writes the warrant, and it writes it for one group. */
      psw:(!leader&&formId==="F-10")?applied.psw:track.psw,
      resample:(!leader&&formId==="F-06R")?applied.resample:track.resample,
      rejectionCount:(!leader&&applied.rejectionCount!=null)?applied.rejectionCount:(track.rejectionCount||0),
      engRejectionCount:(!leader&&applied.engRejectionCount!=null)?applied.engRejectionCount:(track.engRejectionCount||0),
      form:{...(track.form||{}),[formId]:values}};
    setDb(d=>{
      const next=d.projects.map(p=>{
        if(p.id!==project.id) return p;
        const nt=(liveTracks(p).length?liveTracks(p):tracks).map(t=>t.g===track.g?nextTrack:t);
        /* The form's own field writes still belong on the project - they are the evidence a
           part carries - but status and phase come from the roll-up, not from apply. */
        const patched=spec.apply(p,values,me,choice);
        return {...applyTracks({...patched,updated:todayStr()},nt),
          rejectionCount:p.rejectionCount,engRejectionCount:p.engRejectionCount};
      });
      const rolled=rollUp((liveTracks(project).length?liveTracks(project):tracks)
        .map(t=>t.g===track.g?nextTrack:t));
      return {...d,projects:next,
        parts:(leader||staysPut)?d.parts:syncParts(d.parts,project.id,track.g,choice.to,choice.phase||track.phase),
        audit:withAudit(d,{action:spec.id+" "+(leader?"recommendation":choice.v),
          entity:project.id+" / "+track.g,
          detail:leader?("recommends "+choice.to+" \u00b7 awaiting "+ROLE[leader].label)
                :staysPut?("recorded \u00b7 "+track.g+" still "+track.status)
                         :(track.g+": "+track.status+" \u2192 "+choice.to),
          comment:values[spec.comment.k]||"\u2014"}),
        notifs:withNotif(d,leader
          ? spec.id+" recorded \u00b7 "+project.id+" "+track.g+" \u2014 sent to "+ROLE[leader].label+" for approval"
          : spec.id+" "+choice.label.toLowerCase()+" \u00b7 "+project.id+" \u2014 "+track.g
            +(staysPut?" recorded":" is now "+choice.to)
            +(rolled.status!==choice.to?" (project still "+rolled.status+")":""))};
    });
    /* Same shape as the project-wide branch: a recommendation carries no toStatus, so the
       router stores the evidence and Svc-Gate-Approval asks the head. The group travels with
       it - the head is approving one group, not the project.
       fromStatus/toStatus describe the GROUP's move, because that is what StatusTransitions
       has to authorise. What the project row ends up showing is the roll-up, sent separately
       as projectStatus so the router applies it rather than re-deriving it - two engines
       computing "slowest group" independently is two places for it to differ. */
    const nextTracks=(liveTracks(project).length?liveTracks(project):tracks)
      .map(t=>t.g===track.g?nextTrack:t);
    const lead=rollUp(nextTracks);
    const trackBits={group:track.g,tracksJson:JSON.stringify(nextTracks),
      projectStatus:lead.status,projectPhase:lead.phase||""};
    const cards=cardBits(project,{formId:formId,values:values,group:track.g,from:track.status,
      to:held?"":choice.to,note:values[spec.comment.k]});
    runCommand(spec.cap, leader
      ? {projectId:project.id,...trackBits,...cards,fromStatus:track.status,
         fields:{...values,form:spec.id,decision:choice.v,group:track.g,
                 recommend:choice.to,recommendPhase:choice.phase||"",awaiting:leader}}
      : {projectId:project.id,...trackBits,...cards,fromStatus:track.status,
         toStatus:choice.to,toPhase:choice.phase||"",
         fields:{...values,form:spec.id,decision:choice.v,group:track.g}},
      project.id,(leader?(spec.id+" recommendation"):spec.id)+" \u00b7 "+track.g);
  }

  /* capability guards - the UI hides these controls, this refuses them anyway */
  const GUARDED={submitIntake:["project.create","New Request (F-01)"],validateSample:["sample.validate","SQE validation (F-07)"],
    dispositionPilot:["pilot.disposition","IQC disposition"],uploadDoc:["doc.upload","Document upload"],
    addSupplier:["vendor.manage","Supplier master"],markCommReplied:["vendor.notify","Vendor communications"],
    addAdmin:["admin.manage","Admin configuration"],updateAdmin:["admin.manage","Admin configuration"],
    deleteAdmin:["admin.manage","Admin configuration"]};
  Object.keys(GUARDED).forEach(k=>{const fn=act[k],g=GUARDED[k];
    act[k]=(...a)=>{if(!hasCap(roleKey,g[0])){denied(g[1]);return;}return fn(...a);};});
  const ctx={db,act,openModal:setModal,closeModal:()=>setModal(null),confirm:setConfirmO,go:setPage,roleKey,me,flash,
    can:c=>hasCap(roleKey,c),cost:seesCost(roleKey),role:r,
    openForm:(fid,pid,group)=>{setFormOpen({fid,pid,group:group||null});setNavOpen(false);},closeForm:()=>setFormOpen(null),
    /* What the link asked for, so a screen can say "opened from Teams" rather than leaving
       the reader wondering why they are looking at this. */
    deepLink:deepLink,clearDeepLink:()=>setDeepLink(null),
    focusPid,focusPart,
    clearFocus:()=>{setFocusPid(null);setFocusPart(null);},
    openProject:(pid,part)=>{setFormOpen(null);setFocusPid(pid);setFocusPart(part||null);setPage("projects");}};
  /* Act on the link once, after the context object exists so the same navigation the rest of
     the app uses is what runs. A form target opens the form; anything else opens the project,
     and a bare page target just switches page. The target is left in state afterwards so the
     destination can show where it came from. */
  useEffect(()=>{
    if(!deepLink) return;
    if(deepLink.pid&&deepLink.form) ctx.openForm(deepLink.form,deepLink.pid,deepLink.group||null);
    else if(deepLink.pid) ctx.openProject(deepLink.pid,deepLink.part||null);
    else if(deepLink.page) setPage(deepLink.page);
  },[]);
  /* Identity -> person in People -> role. No mapping = no role, deliberately: an
     unmapped user should see that they are unmapped, not silently inherit someone
     else's access. SharePoint's page context wins over the Teams context when both
     exist - SharePoint has already authenticated this person, Teams is just the host.
     Waits for the live People load, or the lookup runs against seed rows. */
  useEffect(()=>{
    const sp=spx();
    const upn=(sp&&sp.upn)||(teamsId&&teamsId.upn)||null;
    if(!upn) return;
    if(sp&&spState==="loading") return;
    /* Inactive rows never resolve a role. The People list carries demo rows alongside
       real staff; an inactive row matching a live sign-in would grant access off
       fabricated data, so this filters rather than trusting the address to be unroutable. */
    const people=(db.admin.people||[]).filter(p=>p.status==="Active"&&!p.demoOnly);
    const person=people.find(p=>String(p.email||"").toLowerCase()===String(upn).toLowerCase());
    const rid=person?(person.roleCode||(ROLE_REGISTRY.find(x=>x.label===person.role)||{}).id):null;
    if(rid&&ROLE[rid]){setRole(rid);setAuthSrc("teams");
      /* Prefer the People row's name over the host's display name: People is the
         directory this app is governed by, and if the two disagree that disagreement
         belongs in the list, not papered over here. */
      setSignedIn({name:(person.name||(sp&&sp.displayName)||upn),upn:upn,roleCode:rid});
    }else{setAuthSrc("teams-unmapped");setSignedIn(null);}
  },[teamsId,spState,db.admin.people]);
  const ssoLocked=authSrc==="teams"&&roleKey!=="ADMIN";
  const crumb=page==="home"?"Home / My Work":LABELS[page];
  const unread=db.notifs.filter(n=>!n.read).length;
  const themeToggle=()=>{const el=document.documentElement,c=el.getAttribute('data-theme');el.setAttribute('data-theme',c==='dark'?'light':c==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark'));};
  return <AppCtx.Provider value={ctx}><div className="shell">
    <header className="appheader">
      <button className="hamburger" onClick={()=>setNavOpen(o=>!o)} title="Menu" aria-label="Toggle navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div className="brandwrap">
        <HoneywellMark size={26}/>
        <span className="wordmark">Honeywell</span>
        <span className="hdiv"/>
        <span className="apptitle">NPI Operations Hub</span>
        <span className="hdiv"/>
        <span className="crumb">{crumb}</span>
      </div>
      <div className="hdr-right">
        <button className="hicon" onClick={themeToggle} title="Theme">◐</button>
        <div className="hicon-wrap">
          <button className="hicon" title="Notifications" onClick={()=>{setNotifOpen(o=>!o);setUserMenu(false);}}><Icon n="bell" cls="" style={{width:17,height:17}}/>{unread?<span className="dot"/>:null}</button>
          {notifOpen?<NotifPanel notifs={db.notifs} onReadAll={act.markAllRead}/>:null}
        </div>
        <span className="demoTag" title={authSrc==="dev"?"Teams SSO takes over when this runs as a Teams tab":"Identity from the Teams context"}>{authSrc==="teams"?"Teams SSO":authSrc==="teams-unmapped"?"no role mapped":"viewing as"}</span>
        <div className="hicon-wrap">
          <div className="roleSel">
            <span className="av chipbtn" onClick={()=>{setUserMenu(o=>!o);setNotifOpen(false);}}>{me===r.person?r.init:initialsOf(me)}</span>
            <div className="who"><b>{me}</b><span> · {r.label}</span></div>
            <select value={roleKey} disabled={ssoLocked} title={ssoLocked?"Signed in through Teams — your role comes from Admin > People":"Role is chosen here until this runs inside Teams"} onChange={e=>{const v=e.target.value;setFormOpen(null);if(authSrc==="teams"&&roleKey==="ADMIN"&&v!=="ADMIN"){setDb(d=>({...d,audit:withAudit(d,{action:"Impersonation started",entity:ROLE[v].label,detail:"App Admin viewing as another role"})}));}setRole(v);setPage(navMode(v,page)?page:"home");}}>
              {ROLE_GROUPS.map(g=><optgroup key={g.name} label={g.name}>
                {g.roles.map(id=><option key={id} value={id} disabled={id==="VENDOR"}>{ROLE[id].label}</option>)}
              </optgroup>)}
            </select>
          </div>
          {userMenu?<div className="usermenu">
            <div style={{padding:"10px 14px",borderBottom:"1px solid var(--border2)"}}>
              <div style={{fontSize:12.5,fontWeight:600}}>{me}</div>
              <div className="mono" style={{fontSize:11,color:"var(--muted)",marginTop:2}}>{signedIn&&signedIn.roleCode===roleKey?signedIn.upn:r.id+" · "+r.aad}</div>
              <div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>{authSrc==="teams"?"Signed in via Teams SSO":authSrc==="teams-unmapped"?"Teams user not in Admin > People":"Role selected manually (no Teams host)"}</div>
            </div>
            <button onClick={()=>{setPage("home");setUserMenu(false);}}>My work</button>
            <button onClick={()=>{flash("Profile & settings (demo)");setUserMenu(false);}}>Profile &amp; settings</button>
            <button onClick={()=>{flash("Help (demo)");setUserMenu(false);}}>Help</button>
            <button onClick={()=>{flash("Sign out (demo)");setUserMenu(false);}}>Sign out</button>
          </div>:null}
        </div>
      </div>
    </header>
    <div className="body">
      <aside className={"sidebar"+(navOpen?" open":"")}>
        <nav className="sb-nav">
          <div className="sb-sec">Workspace</div>
          {NAV.filter(n=>navMode(roleKey,n.id)).map(n=><button key={n.id} className={"sb-item"+(page===n.id&&!formOpen?" active":"")} onClick={()=>{setFormOpen(null);setPage(n.id);setNavOpen(false);}}>
            <Icon n={n.icon} cls=""/>{n.label}{n.id==="approvals"&&approvalsFor(roleKey,db.approvals,db).length?<span className="sb-badge">{approvalsFor(roleKey,db.approvals,db).length}</span>:null}</button>)}
          {ADMINNAV.some(n=>navMode(roleKey,n.id))?<div className="sb-sec">Administration</div>:null}
          {ADMINNAV.filter(n=>navMode(roleKey,n.id)).map(n=><button key={n.id} className={"sb-item"+(page===n.id?" active":"")} onClick={()=>{setPage(n.id);setNavOpen(false);}}><Icon n={n.icon} cls=""/>{n.label}</button>)}
        </nav>
        <div className="sb-foot">
          {/* Never let the viewer guess whether they are looking at real data. */}
          <div style={{marginBottom:6,fontWeight:700,letterSpacing:.3,
            color:spState==="live"?"var(--green)":spState==="off"?"var(--faint)":spState==="loading"?"var(--amber)":"var(--red)"}}>
            {spState==="live"?"● LIVE — SharePoint":
             spState==="partial"?"● LIVE — partial":
             spState==="loading"?"◌ connecting to SharePoint…":
             spState==="error"?"● SharePoint unreachable":"○ sample data"}
          </div>
          {spState==="live"||spState==="partial"
            ? <div style={{marginBottom:6}}>{db.projects.length} projects · {db.parts.length} parts · {db.audit.length} audit rows</div>
            : null}
          {/* Standalone keeps its own state, so say where it lives and give it a way back to
              the seed - otherwise a half-finished test is impossible to clear. */}
          {spState==="off"
            ? <div style={{marginBottom:6,lineHeight:1.45}}>
                {demoSaveFailed
                  ? <span style={{color:"var(--amber)"}}>Not saving — this browser is blocking site data.</span>
                  : <>Kept in this browser{restored&&restored.saved?" · restored from "+cDate(restored.saved):""}.{" "}
                     <button onClick={resetDemo} style={{background:"none",border:0,padding:0,cursor:"pointer",
                       color:"var(--teal)",font:"inherit",textDecoration:"underline"}}>Reset to sample data</button></>}
              </div>
            : null}
          {busy>0
            ? <div style={{marginBottom:6,color:"var(--amber)",fontWeight:600}}>
                {"◌ sending "+busy+" command"+(busy===1?"":"s")+" to the router…"}</div>
            : null}
          {spErrors.length
            ? <div style={{color:"var(--red)",marginBottom:6,lineHeight:1.45}}>{spErrors.slice(0,2).map((e,i)=><div key={i}>{e}</div>)}</div>
            : null}
          v0.9 · {ROLE_KEYS.length} roles · {Object.keys(FORM_SPECS).length}/14 forms · {authSrc==="dev"?"Teams SSO ready":authSrc==="teams"?"Teams SSO active":"no role mapped"}
          <div style={{marginTop:4,opacity:.75}}>build {BUILD}</div>
        </div>
      </aside>
      {navOpen?<div className="nav-backdrop" onClick={()=>setNavOpen(false)}/>:null}
      <main className="content">
        {formOpen ? <PhaseForm key={formOpen.fid+"::"+formOpen.pid+"::"+(formOpen.group||"")}
          formId={formOpen.fid} pid={formOpen.pid} group={formOpen.group}/> : !navMode(roleKey,page) ? <Denied page={page} roleKey={roleKey}/> : page==="home" ? <Home roleKey={roleKey} onAct={flash} go={setPage}/> : page==="projects" ? <Projects onAct={flash}/> : page==="intake" ? <Intake onAct={flash}/> : page==="approvals" ? <Approvals onAct={flash}/> : page==="admin" ? <Admin onAct={flash}/> : page==="reports" ? <Reports onAct={flash}/> : page==="samples" ? <Samples onAct={flash}/> : page==="vendors" ? <Vendors onAct={flash}/> : page==="docs" ? <Documents onAct={flash}/> : page==="currency" ? <Currency onAct={flash}/> : page==="audit" ? <Audit onAct={flash}/> : page==="phases" ? <Phases/> : <Placeholder id={page}/>}
      </main>
    </div>
    <footer className="appfooter">Audit trail&nbsp; ·&nbsp; approver comments&nbsp; ·&nbsp; email&nbsp;/&nbsp;<u>Teams</u> alerts&nbsp; ·&nbsp; return for rework&nbsp; ·&nbsp; role-based access</footer>
    {toast?<div className="toast"><span className="cbadge">✓</span>{toast}</div>:null}
    {modal}
    {confirmO?<ConfirmDialog opts={confirmO} onClose={()=>setConfirmO(null)}/>:null}
  </div></AppCtx.Provider>;
}
document.documentElement.setAttribute("data-theme","light");
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body></html>
